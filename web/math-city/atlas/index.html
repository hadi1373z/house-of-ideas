ove the implementation’s complexity while the shortest-path correctness argument remains essential. Read Knuth for broader algorithm analysis, and Hopcroft for Tarjan’s collaborative work on graph algorithms.\n\n## Three directions to explore\n\n1. In the three-key example, compute the subtree-size potential before and after each rotation. What does the calculation reveal about why a local example alone cannot establish the general amortized bound?\n\n2. Construct an access sequence with two phases concentrated on different groups of keys. Why can a dynamically changing competitor have an advantage over every single fixed tree?\n\n3. In the July 2026 bound, when does the initialization term dominate? What additional improvement in the competitive factor would be needed to establish full dynamic optimality?\n\n## Sources\n\n- [Sleator and Tarjan · Self-Adjusting Binary Search Trees (1985)](https://www.cs.cmu.edu/~sleator/papers/self-adjusting.pdf)\n\n- [Chmel et al. · Splay trees are almost dynamically optimal (July 2026 preprint), Theorem 1](https://arxiv.org/html/2607.18498v1)\n\n- [Carnegie Mellon · Binary Search Trees and Dynamic Optimality (Spring 2026), amortized-analysis exposition](https://www.cs.cmu.edu/~yangp/15-451/lecture23.pdf)\n\n- [Tarjan · Efficiency of a Good But Not Linear Set Union Algorithm (1975)](https://collaborate.princeton.edu/en/publications/efficiency-of-a-good-but-not-linear-set-union-algorithm/)\n\n- [Fredman and Tarjan · Fibonacci heaps and their uses in improved network optimization algorithms (1987)](https://collaborate.princeton.edu/en/publications/fibonacci-heaps-and-their-uses-in-improved-network-optimization-a-2/)\n"},{"event_id":"edit-2026-09-30-bayer-data-structures","source_key":"edit:2026-09-30:bayer:data-structures","created_at":"2026-09-29T23:34:25Z","kind":"profile-edit","person_id":"bayer","name":"Rudolf Bayer","summary":"Add Rudolf Bayer with worked data-structure examples and sourced connections.","revision":"cc671ec1dac41ecb3a64ad2e333403b8a00eb845cce08a0c839d62bcfd34b990","article_markdown":"# Rudolf Bayer — Make the storage page the unit of search\n\nRudolf Bayer and Edward McCreight developed B-trees for maintaining large ordered indexes. The design treats a page containing many keys as one node, matching the structure to storage where fetching a page is expensive.\n\nHigh branching reduces the number of page fetches, while occupancy and equal-depth invariants keep the index usable as keys are inserted and deleted.\n\nsearch page transfers = O(1 + log_B n)\n\n## A different machine suggests a different tree\n\nA binary tree branches only twice at a node. That is a natural representation when following a pointer is cheap. An index stored mainly on disk changes the question: fetching a page costs much more than comparing several keys already on that page.\n\nBayer and McCreight’s work, published in Acta Informatica in 1972, organizes ordered indexes into pages with multiple separator keys. A page directs the search into one of many child ranges. The point is to reduce expensive transfers while preserving the ability to search and update an ordered collection.\n\n## Read one page, choose one interval\n\nImagine a root page holding separator keys 20 and 40. Its three child pages contain [5,10], [25,30], and [45,50]. To look up 30, compare it with the root separators and follow the middle pointer. That child page contains the answer. With neither page cached, this example uses two page reads.\n\nTo search for 35, follow exactly the same pointer and conclude absence after inspecting [25,30]. The ordering invariant rules out the other pages: their keys are below 20 or above 40. A failed search therefore needs a proof of absence just as a successful search needs a match.\n\n## A split preserves order and depth\n\nUse a small B-tree convention in which a non-root page holds between two and four keys. Suppose the middle leaf has become [25,28,30,35], and we insert 32. Its temporary five-key content is [25,28,30,32,35]. Promote the median 30 to the parent and leave two pages [25,28] and [32,35]. The root becomes [20,30,40] with four children.\n\nEach resulting leaf meets the occupancy rule, every key remains in the correct interval, and all leaves remain at the same depth. If the parent overflows, split it too. When a root splits, introducing a new root increases every leaf’s depth together. Deletion requires the corresponding care with redistribution or merging.\n\n## What the logarithm measures\n\nWhen page capacity is proportional to B and non-root pages retain a constant fraction of capacity, branching grows proportionally to B. This yields O(1+log_B n) page transfers for a search among n keys, in the usual page model. It does not say that all computation inside each page is free in real time.\n\nRead Codd for a useful conceptual separation: a relational data model describes data and queries; a B-tree is one possible physical access structure. Read Sedgewick for binary encodings of balanced multiway trees, and Tarjan for a different strategy in which accesses themselves reshape the search tree.\n\n## Three directions to explore\n\n1. After promoting 30 in the example, which child range contains an absent key 31, and why is looking there sufficient?\n\n2. Why are both minimum occupancy and equal leaf depth needed to prove a logarithmic height bound? Construct a failure when either condition is dropped.\n\n3. If the root and first level remain cached, how does the number of actual page fetches differ from the tree’s full height?\n\n## Sources\n\n- [Bayer and McCreight · Organization and Maintenance of Large Ordered Indexes (1972), paper copy](https://scispace.com/pdf/organization-and-maintenance-of-large-ordered-indices-4gyd1n5dhb.pdf)\n\n- [Bayer and McCreight · publisher record](https://doi.org/10.1007/BF00288683)\n"},{"event_id":"edit-2026-09-30-sedgewick-data-structures","source_key":"edit:2026-09-30:sedgewick:data-structures","created_at":"2026-09-29T23:34:25Z","kind":"profile-edit","person_id":"sedgewick","name":"Robert Sedgewick","summary":"Add Robert Sedgewick with worked data-structure examples and sourced connections.","revision":"e5e5aad4b4f7a34a38bea7e5dea79706c7af7831b9c1b1114db843bd4fa21594","article_markdown":"# Robert Sedgewick — Understand balance through representation\n\nRobert Sedgewick connects algorithm design, mathematical analysis, and implementation. His work with Leonidas Guibas on a dichromatic framework explains balanced search trees using red and black links; his later exposition makes the relationship with multiway trees especially tangible.\n\nA representation can turn a global balance requirement into local rotation and color rules. Correctness depends on preserving both key order and the balance invariant.\n\nred-black tree height = O(log n)\n\n## One tree, two representations\n\nWith Leonidas Guibas, Sedgewick developed the 1978 dichromatic framework for balanced trees. This belongs to a history that also includes Bayer’s earlier symmetric binary B-trees; it should not be presented as an isolated invention without predecessors.\n\nSedgewick’s later left-leaning red-black presentation offers a particularly clear reading path. A red link joins two ordinary binary nodes into one conceptual two-key node. Black links connect the conceptual nodes. The binary implementation can therefore be understood through a balanced multiway structure.\n\n## Encode a two-key node\n\nTake a conceptual node containing keys 10 and 20, with three child ranges: keys below 10, keys between 10 and 20, and keys above 20. Encode it as a black-rooted binary subtree with key 20 and a red left child 10. Attach the three child ranges to 10’s left, 10’s right, and 20’s right respectively.\n\nSearching for 15 compares first with 20, then with 10, and enters the middle range. Searching for 25 follows 20’s right link. The encoded search preserves exactly the interval decisions of the multiway node. The red link is representation metadata, not a reversal of key order.\n\n## Why local constraints limit height\n\nA standard red-black invariant gives every root-to-null path the same number of black nodes and prohibits consecutive red nodes. If that common black-height is b under a consistent counting convention, the tree contains at least 2^b−1 internal nodes. No path can be more than roughly twice as long as its black portion. Together these facts give logarithmic height.\n\nRotations preserve binary-search order, but they do not by themselves establish every color invariant. Insertion and deletion must combine rotations with recoloring and restore the required conditions. The left-leaning variant further restricts the orientation of red links; it is useful to state which variant a proof or implementation uses.\n\n## An algorithm is also something to examine\n\nSedgewick’s work with Kevin Wayne supplies implementations and explanations that connect the abstract invariant with actual operations. One can test a proposed implementation by checking sorted traversal, black-height agreement, and the absence of forbidden red-link patterns after every update. Passing such checks on examples is evidence, while a proof explains why every permitted update preserves the invariants.\n\nCompare this with Tarjan and Sleator: a splay tree need not retain logarithmic height after each access. Its guarantee concerns a sequence. Compare it with Bayer: grouping keys into storage pages reduces transfers, whereas a red-black encoding uses binary nodes. These are distinct design choices even when the word tree appears in all three names.\n\n## Three directions to explore\n\n1. Draw the binary encoding of a two-key node 15,35 and attach three nonempty child subtrees. Verify that every key retains its proper interval.\n\n2. Prove the minimum-node bound in terms of black-height by induction, then identify where prohibiting adjacent red nodes enters the height argument.\n\n3. Which invariant checks would distinguish a general red-black tree from the left-leaning variant? Why should a test suite avoid silently mixing their rules?\n\n## Sources\n\n- [Sedgewick and Wayne · Balanced Search Trees](https://algs4.cs.princeton.edu/33balanced/)\n\n- [Princeton · original algorithm references, including Guibas and Sedgewick (1978)](https://algs4.cs.princeton.edu/references/)\n\n- [Princeton · Robert Sedgewick, career and biography](https://faculty.princeton.edu/people/robert-sedgewick-0)\n"},{"event_id":"edit-2026-09-30-sleator-data-structures","source_key":"edit:2026-09-30:sleator:data-structures","created_at":"2026-09-29T23:34:25Z","kind":"profile-edit","person_id":"sleator","name":"Daniel Sleator","summary":"Add Daniel Sleator with worked data-structure examples and sourced connections.","revision":"17467058c62be6a0b14dcd098b13256ce405898fb719e168b43b7fa2e2a30c6d","article_markdown":"# Daniel Sleator — Adapt to requests without knowing the future\n\nDaniel Sleator, working with Robert Tarjan, helped establish self-adjusting data structures and the comparison of online algorithms with an optimum that knows the future. Splay trees and list-update algorithms make these ideas concrete.\n\nA data structure can respond to observed requests without predicting a probability distribution. Its guarantee must specify the competitor and which rearrangements cost time.\n\nonline cost ≤ c · offline optimum + initialization term\n\n## Let the access change the representation\n\nSleator’s work asks how a structure should reorganize itself while it is being used. An online algorithm receives requests one at a time. An offline benchmark may know the whole sequence, but it must still pay the costs allowed by the same model. Comparing the two separates a provable adaptive rule from a heuristic that merely seems reasonable.\n\nSplay trees, developed jointly with Tarjan, apply this viewpoint to ordered search. The move-to-front rule applies it to an unsorted list. The structures and proofs differ; the shared question is how much future efficiency can be bought by rearranging the present.\n\n## Move-to-front by hand\n\nStart with the list A,B,C,D. Let accessing the item at position i cost i, and allow the accessed item to move toward the front for free. Serve the requests D,D,B,D. The first D costs 4 and produces D,A,B,C. The second costs 1. Accessing B costs 3 and produces B,D,A,C. The final D costs 2 and restores D,B,A,C. Total access cost: 10.\n\nLeaving the original list fixed would cost 4+4+2+4=14. But 14 is not the offline optimum: a better competitor could rearrange its list. This small example shows adaptation, while also showing why comparing only with a deliberately weak baseline would not prove competitiveness.\n\n## The benchmark is part of the theorem\n\nSleator and Tarjan’s 1985 list-update paper proves a constant-factor comparison for move-to-front in its specified model. Rearrangements have accounting rules; one cannot give the offline algorithm unlimited free reordering and expect the same theorem.\n\nTheir analysis also treats paging and least-recently-used replacement. There, the competitive guarantee depends on cache capacity. The lesson is to name the resource and the cost model before using the word optimal: list position, page faults, and tree rotations are different quantities.\n\n## From lists to search trees\n\nAn ordered search tree must preserve key order, so arbitrary list moves are unavailable. Splaying uses rotations instead. It lifts the accessed key to the root using zig, zig-zig, and zig-zag steps, and can leave the tree temporarily tall. Its logarithmic guarantee is amortized across operations.\n\nTarjan’s profile gives a rotation example and the July 2026 almost-dynamic-optimality result. That recent preprint is about the original splay algorithm, and its nonconstant competitive factor should not be confused with a proof of the full constant-factor conjecture. Read Bayer and Sedgewick to compare access-driven adaptation with structures that maintain explicit balance constraints.\n\n## Three directions to explore\n\n1. For the same initial list, find a short request sequence on which move-to-front costs more than leaving the list unchanged. Why does that not contradict a constant-factor theorem?\n\n2. How would the model change if every move toward the front also cost its distance? Which part of the worked calculation would change?\n\n3. Which workloads make the distinction between a worst-case per-operation guarantee and an amortized sequence guarantee operationally important?\n\n## Sources\n\n- [Sleator and Tarjan · Amortized Efficiency of List Update and Paging Rules (1985)](https://www.cs.cmu.edu/~sleator/papers/amortized-efficiency.pdf)\n\n- [Sleator and Tarjan · Self-Adjusting Binary Search Trees (1985)](https://www.cs.cmu.edu/~sleator/papers/self-adjusting.pdf)\n\n- [Chmel et al. · Splay trees are almost dynamically optimal (2026 preprint)](https://arxiv.org/abs/2607.18498)\n\n- [Carnegie Mellon · Danny Sleator, research profile](https://csd.cmu.edu/people/faculty/danny-sleator)\n"},{"event_id":"daily-2026-10-06","source_key":"daily:2026-10-06","created_at":"2026-10-06T23:14:32Z","kind":"daily-profile","person_id":"edmonds","name":"Jack Edmonds","summary":"Publish the 2026-10-06 profile of Jack Edmonds: The moment efficiency became mathematics.","revision":"b5f689e9f9cd9caa18ff374fc72e0d66e36b902318910b627214dfd0b6150e1d","article_markdown":"# Jack Edmonds — The moment efficiency became mathematics\n\nJack Edmonds helped establish combinatorial optimization as a meeting point of graph theory, linear programming, convex geometry and algorithms. His work made efficient construction, not merely abstract existence, a central mathematical objective. [1]\n\nThe blossom algorithm, matching polytope and matroid greedy theorem reveal three faces of a strategy: identify the obstruction, express its structure, and exploit it algorithmically.\n\nmatching = augmenting paths + blossoms; odd-set inequalities restore integrality\n\n## Matching: why odd cycles matter\n\nLet M be a matching in a finite loopless graph. An augmenting path alternates between edges outside and inside M, with unmatched endpoints. Flipping membership along the path produces M △ E(P), a matching with one more edge. Berge's criterion says that M is maximum exactly when no augmenting path exists.\n\nBipartite graphs allow a comparatively direct alternating search. In a general graph, the search can encounter an odd alternating cycle. Edmonds's 1965 paper Paths, Trees, and Flowers handles this obstruction by contracting an appropriately rooted blossom, continuing the search, and later expanding it to recover an augmenting path in the original graph. [2]\n\nThe matching and search-tree conditions matter: this is not permission to contract an arbitrary odd cycle. For a blossom found by the alternating search, contraction preserves the relevant augmenting-path problem. Nested blossoms can be handled recursively, giving a polynomial-time maximum-cardinality matching algorithm.\n\nThe general lesson is to compress a precisely identified obstruction while preserving the question being solved.\n\n|M △ E(P)| = |M| + 1\n\n```tex\n|M\\triangle E(P)|=|M|+1\n```\n\n## The same obstruction becomes an inequality\n\nWrite a matching as its edge-incidence vector x. Every such vector satisfies x_e ≥ 0 and x(δ(v)) ≤ 1 for each vertex v. These obvious constraints are not enough: on a triangle, assigning 1/2 to each edge satisfies all vertex constraints but has total weight 3/2, whereas a matching contains at most one edge.\n\nIf S is any odd vertex set, a matching uses at most (|S|−1)/2 edges internal to S. Edmonds proved that adding all these odd-set inequalities gives exactly the convex hull of matchings. [3]\n\nThus an algorithmic obstruction and a geometric obstruction have the same origin. Blossoms explain why the alternating search needs extra machinery; odd sets explain why the first linear relaxation is fractional. This is a foundational example of polyhedral combinatorics: study the convex body whose vertices encode the desired discrete objects.\n\nP_match(G) = {x ≥ 0 : x(δ(v)) ≤ 1 for every v; x(E(S)) ≤ (|S|−1)/2 for every odd S}\n\n## Matroids: when greedy is a theorem\n\nA matroid (E,I) is a finite independence system closed under taking subsets and satisfying exchange: if A,B are independent and |A| < |B|, some b in B∖A can be added to A while preserving independence.\n\nSort the elements by decreasing weight and add an element whenever independence is preserved. For a matroid this finds a maximum-weight basis, for arbitrary real weights. For maximum-weight independent sets, use nonnegative weights or skip negative-weight elements. This qualification prevents greedy from needlessly adding costly elements.\n\nThe Rado–Edmonds characterization shows that universal success of the appropriate greedy rule characterizes matroid structure among hereditary independence systems. Edmonds's 1971 paper makes the link to optimization and polyhedra explicit. [4]\n\nGraphic matroids recover the spanning-tree setting; linear matroids recover linear independence. The abstract exchange axiom explains why apparently different greedy algorithms work.\n\nA,B ∈ I and |A| < |B| ⇒ ∃b ∈ B∖A with A ∪ {b} ∈ I\n\n## Why polynomial time became the standard\n\nThere can be exponentially many matchings. Edmonds nevertheless looked for a procedure whose work is bounded by a polynomial in the input size. His matching papers helped turn this demand into a systematic mathematical theory of efficient combinatorial algorithms. [1,2]\n\nThis does not mean every polynomial is practical, or every exponential algorithm useless. Polynomial time is a robust structural benchmark: changing reasonable encodings and composing efficient procedures usually preserves it.\n\nThe conceptual advance is the separation of three questions: does an object exist, can a proposed answer be checked, and can a correct answer be found efficiently? Edmonds's positive algorithms complemented the later Cook–Karp program of hardness reductions.\n\n## The link to approximation algorithms\n\nThe blossom algorithm tells us to understand the obstruction to search. The matching polytope tells us to express that obstruction by inequalities. Matroid theory tells us to locate the structural axiom behind an algorithmic principle.\n\nThese are useful guides when exact structure is lost. If a relaxation is fractional, one studies its integrality gap and rounding. If exchange is weaker, greedy may yield only an approximation. The connections to Lovász's convex methods and Goemans–Williamson rounding are conceptual reading links, not claims that one paper directly caused every later algorithm.\n\n## Three directions to explore\n\n1. Should the next profile stay with combinatorial optimization or return to graph limits and infinite graphs?\n\n2. Would a proof-centered mathematician or someone known for a major algorithmic paradigm be more useful next?\n\n3. Should the next profile go deeper into polyhedral methods, matroids, or approximation algorithms?\n\n## Sources\n\n- [[1] NIST: Edmonds and efficient combinatorial algorithms](https://www.nist.gov/mathematics-statistics/first-mathematical-theory-efficient-combinatorial-algorithms-jack-edmonds)\n\n- [[2] Edmonds (1965), Paths, Trees, and Flowers](https://doi.org/10.4153/CJM-1965-045-4)\n\n- [[3] Edmonds (1965), Maximum matching and a polyhedron with 0,1-vertices](https://doi.org/10.6028/jres.069B.013)\n\n- [[4] Edmonds (1971), Matroids and the greedy algorithm](https://doi.org/10.1007/BF01584082)\n"},{"event_id":"daily-2026-09-29","source_key":"daily:2026-09-29","created_at":"2026-10-06T23:17:58Z","kind":"daily-profile","person_id":"lyons","name":"Russell Lyons","summary":"Publish the 2026-09-29 profile of Russell Lyons: Probability on infinite graphs and mass transport.","revision":"893cb0ab3ddcc4d1193db739ddd04d8b7bf755c684802c70dfcc57d92d6b580d","article_markdown":"# Russell Lyons — Probability on infinite graphs and mass transport\n\nRussell Lyons works at the intersection of probability, infinite graphs, group actions and measurable structures. With Yuval Peres he wrote Probability on Trees and Networks, a systematic account of random walks, electrical networks, percolation and spanning forests. [1]\n\nMass transport carries finite double counting into random infinite graphs. It separates a necessary consistency law for finite approximation from the harder question of realizing that law by actual finite models.\n\nE[Σᵥ f(G,o,v)] = E[Σᵥ f(G,v,o)]\n\n## A network has several mathematical faces\n\nAn infinite locally finite graph can be studied by running a random walk, putting resistors on its edges, deleting edges independently, or sampling a spanning forest. Each experiment extracts different information, but the answers are linked.\n\nFor example, effective resistance to infinity governs recurrence and transience in the standard reversible network setting. On trees, growth and branching influence both percolation and biased random walks. Lyons's work and the Lyons–Peres book make these connections into reusable methods rather than isolated analogies. [1]\n\nThe important change of viewpoint is to seek an invariant mechanism behind a finite construction and then ask which parts survive at infinity.\n\n## Unimodularity is a conservation law\n\nA probability law on rooted, connected, locally finite graphs is unimodular if it satisfies the mass-transport identity for every nonnegative measurable isomorphism-invariant function f of a graph with an ordered pair of vertices. The two sides are allowed to be infinite.\n\nFor a finite graph with a uniform root, the identity follows simply by summing f over all ordered vertex pairs and interchanging the sums. Local weak limits of uniformly rooted finite graphs retain this identity. Aldous and Lyons developed unimodular random networks as a common setting for random walks, percolation, amenability and spanning forests. [2]\n\nThe root is not an arbitrarily favored vertex. The identity expresses a precise balance between what the sampled root sends and what it receives.\n\nE[Σᵥ f(G,o,v)] = E[Σᵥ f(G,v,o)]\n\n```tex\n\\mathbb E\\sum_v f(G,o,v)=\\mathbb E\\sum_v f(G,v,o)\n```\n\n## A mass-transport proof pattern\n\nSuppose an equivariant marking rule selected exactly one vertex in each infinite connected graph. Have every vertex send one unit to the selected vertex. Outgoing mass at the root is always one. Incoming mass is either zero or infinite, so its expectation is either zero or infinite, never one. This contradicts unimodularity.\n\nThe argument requires an equivariant measurable selection whose marked law remains unimodular; an arbitrary choice using an external labeling does not satisfy the premise. With that qualification, the calculation explains how a global impossibility can follow from a simple local rule for sending mass. [1,2]\n\n## Trees locate a positive approximation boundary\n\nA rooted random graph law is called sofic here when it is a local weak limit of uniformly rooted finite graphs. Unimodularity is necessary; an approximation theorem must establish more than the mass-transport identity.\n\nBenjamini, Lyons and Schramm gave a characterization of bounded-degree unimodular random trees as root components of invariant percolations on regular trees. They used it to give another proof of the soficity of unimodular random trees, crediting the earlier result to Gábor Elek. [3]\n\nThis is a valuable control case. Complex branching alone does not obstruct finite approximation. A proposed obstruction for more general graphs must detect something the tree setting lacks, rather than merely restating mass transport.\n\n## Spanning forests and determinants\n\nAn infinite graph has two natural limits of finite uniform spanning trees, depending on free or wired boundary conditions. The resulting free and wired uniform spanning forests connect random walks, resistance and harmonic functions. [1]\n\nLyons also developed discrete determinantal probability measures. For a positive contraction Q on ℓ²(W), a random subset S of the countable set W can satisfy Pr(A ⊆ S) = det(Q_A) for every finite A. These measures have strong negative-dependence properties and connect Hilbert-space operators to matroids and spanning forests. [4]\n\nWith Andreas Thom, Lyons proved invariant coupling results for such measures on sofic groups and analogous random rooted graphs. Finite approximation is therefore useful not only for drawing a graph but for transferring structured probability laws. [5]\n\nPr(A ⊆ S) = det(Q_A)\n\n## What should survive a finite approximation?\n\nThe common question is which information is retained when large finite networks are replaced by local probability laws. The unmarked rooted law of a graphing records component geometry, but not necessarily every global measurable coloring or coupling carried by that graphing.\n\nA useful distinction is between consequences of unimodularity and stronger hypotheses used by a particular finite-approximation theorem. Entropy, invariant couplings and local–global statistics are possible directions to investigate; none is asserted here to be a complete characterization of soficity.\n\n## Three directions to explore\n\n1. Should the next profile follow David Aldous and the objective method for local weak convergence?\n\n2. Would several short mass-transport proofs about ends and invariant forests be more useful than a broad biography?\n\n3. Should the next topic compare positive finite-approximation theorems with nonsofic constructions?\n\n## Sources\n\n- [[1] Lyons–Peres, Probability on Trees and Networks](https://rdlyons.pages.iu.edu/prbtree/)\n\n- [[2] Aldous–Lyons, Processes on Unimodular Random Networks](https://arxiv.org/abs/math/0603062)\n\n- [[3] Benjamini–Lyons–Schramm, Unimodular Random Trees](https://arxiv.org/abs/1207.1752)\n\n- [[4] Lyons, Determinantal probability measures](https://arxiv.org/abs/math/0204325)\n\n- [[5] Lyons–Thom, Invariant Coupling of Determinantal Measures on Sofic Groups](https://arxiv.org/abs/1402.0969)\n"},{"event_id":"daily-2026-09-30","source_key":"daily:2026-09-30","created_at":"2026-10-06T23:17:58Z","kind":"daily-profile","person_id":"gromov","name":"Mikhail Gromov","summary":"Publish the 2026-09-30 profile of Mikhail Gromov: When algebra becomes geometry.","revision":"51551dc717c986b3ec152fc581f2067a886dfb2e626b8075f66200bbee300597","article_markdown":"# Mikhail Gromov — When algebra becomes geometry\n\nMikhail Gromov reshaped geometry by studying structures after exact coordinates and small-scale details have been forgotten. His work on growth, hyperbolicity, metric limits and pseudoholomorphic curves connected geometry with groups, dynamics and probability.\n\nChanging the notion of equivalence can expose invariants invisible in an exact coordinate description. Finite approximation, quasi-isometry and metric convergence illustrate different versions of that strategy.\n\npolynomial growth ⇔ virtually nilpotent; coarse geometry retains algebraic structure\n\n## A group can be read as a graph\n\nA finitely generated group Γ with a finite symmetric generating set S has a Cayley graph. Word length is graph distance from the identity, and the ball B(n) consists of elements representable by words of length at most n.\n\nGromov proved that polynomial growth forces Γ to contain a nilpotent subgroup of finite index. Combined with the earlier converse, this gives the equivalence between polynomial growth and virtual nilpotence. The growth type does not depend on the finite generating set. [1]\n\nThis is a striking rigidity statement: a bound on the number of elements at distance at most n determines substantial algebraic structure. It is not merely an estimate on a particular drawing of the Cayley graph.\n\n|B(n)| ≤ Cnᵈ for all n ⇒ Γ is virtually nilpotent\n\n## Curvature without a manifold\n\nA geodesic metric space is δ-hyperbolic when each side of a geodesic triangle lies within distance δ of the union of the other two sides. Trees are the limiting case with δ = 0.\n\nGromov's hyperbolic-group framework applies this condition to Cayley graphs and makes it independent of the chosen finite generating set. Quasi-isometries preserve the relevant large-scale geometry: distances may change by multiplicative and additive constants, and every target point must lie a bounded distance from the image. [2]\n\nThe coarse viewpoint connects boundary geometry with algebra and algorithms, including solutions of the word problem for hyperbolic groups. It deliberately discards exact distances while retaining the structure that controls long paths.\n\nA⁻¹d_X(x,y)−B ≤ d_Y(f(x),f(y)) ≤ A d_X(x,y)+B\n\n## Finite models need not be finite Cayley graphs\n\nA finite quotient of Γ supplies an exact action on a finite set. Sofic approximation allows much weaker finite permutation models: multiplication relations hold at almost every point, and different group elements act differently at almost every point.\n\nFor a finitely generated group, this can be expressed by finite generator-labeled graphs in which almost every radius-r neighborhood agrees with the Cayley graph, for every prescribed r and error tolerance. The approximating graph need not itself be a Cayley graph. Gromov introduced the underlying direction; Weiss's paper supplied the terminology and its dynamical development. [3]\n\nThus exact finite quotients, finite local models and approximate models should not be identified. Requiring all relations everywhere is stronger than allowing a vanishing exceptional set.\n\nPrᵥ[B_r(X,v) ≅ B_r(Cay(Γ,S),e)] ≥ 1−ε\n\n## Metric limits without shared vertices\n\nGromov–Hausdorff distance compares compact metric spaces by embedding them isometrically in a common space and minimizing their Hausdorff distance there. No correspondence of vertices or coordinates is prescribed beforehand. [2]\n\nThis differs from Benjamini–Schramm convergence. The former controls global metric shape, often after rescaling. The latter records the distribution of fixed-radius neighborhoods around a random vertex. A graph sequence can behave differently under the two notions.\n\nThe useful habit is to state exactly what a limit retains before trying to transfer a theorem through it. “The graphs converge” is not a sufficient specification.\n\n## Pseudoholomorphic curves reveal another rigidity\n\nGromov introduced pseudoholomorphic curves as a central tool in symplectic geometry. A map u from a Riemann surface to an almost-complex manifold satisfies du ∘ j = J ∘ du, a nonlinear analogue of the Cauchy–Riemann equation. [4]\n\nOne application is non-squeezing: a standard symplectic ball B²ⁿ(R) cannot be symplectically embedded into the cylinder B²(r) × R²ⁿ⁻² unless R ≤ r. Volume alone cannot see this obstruction because the cylinder has infinite volume.\n\nThe theory made curves into probes of symplectic rigidity and became part of the foundation for later symplectic topology. This is a different setting from group theory but shares the strategy of detecting structure through the right invariant objects.\n\ndu ∘ j = J ∘ du; B²ⁿ(R) ↪ B²(r) × R²ⁿ⁻² symplectically ⇒ R ≤ r\n\n## The principle to retain\n\nThe common thread is not that every weakening loses information harmlessly. It is that a carefully chosen weaker equivalence exposes robust structure: quasi-isometry for groups, metric limits for geometric spaces, approximate actions for finite models, and curve invariants for symplectic manifolds.\n\nQuestions about local graph neighborhoods and global reconstruction fit this perspective, but need their own hypotheses. A local approximation theorem is not automatically an isomorphism or rigidity theorem.\n\n## Three directions to explore\n\n1. Should the next profile stay with finite approximations of infinite groups and graphs?\n\n2. Would probability and local convergence, or group actions and geometry, be the more useful next viewpoint?\n\n3. Should the next entry focus on one theorem with a detailed proof sketch rather than a broad biography?\n\n## Sources\n\n- [[1] Gromov (1981), Groups of polynomial growth and expanding maps](https://numdam.org/articles/10.1007/BF02698687/)\n\n- [[2] Gromov: papers and metric geometry](https://www.ihes.fr/~gromov/)\n\n- [[3] Weiss (2000), Sofic groups and dynamical systems](https://cris.huji.ac.il/en/publications/sofic-groups-and-dynamical-systems/)\n\n- [[4] Gromov (1985), Pseudo-holomorphic curves in symplectic manifolds](https://www.ihes.fr/~gromov/symplecticmanifolds/160/)\n"},{"event_id":"daily-2026-10-01","source_key":"daily:2026-10-01","created_at":"2026-10-06T23:17:58Z","kind":"daily-profile","person_id":"aldous","name":"David Aldous","summary":"Publish the 2026-10-01 profile of David Aldous: Turning finite graphs into infinite probability objects.","revision":"ce18724e94410d57ad286e88aca253b0cb71a7a8d9a2cd322afddfb972c02754","article_markdown":"# David Aldous — Turning finite graphs into infinite probability objects\n\nDavid Aldous is a probabilist known for exchangeability, Markov chains, continuum random trees and local weak limits. His objective method uses an infinite random limit to study asymptotic questions about large finite combinatorial structures. [1,2]\n\nThe objective method can turn a globally coupled finite optimization problem into a recursive problem on an infinite object, provided the transfer back to finite systems is rigorously justified.\n\n(Gₙ,oₙ) → (G,o) locally; E[Aₙ] → ζ(2) = π²/6\n\n## What a typical vertex sees\n\nChoose a vertex oₙ uniformly from a finite graph Gₙ. Local weak convergence means that for every fixed radius r, the distribution of the rooted ball B_r(Gₙ,oₙ) converges. In bounded-degree unmarked graphs these distributions can be expressed using finite rooted isomorphism types. Weighted networks require the corresponding marked topology.\n\nThe limiting object is a law on rooted graphs, not necessarily one deterministic graph. If component sizes grow appropriately the limit can be infinite; growing total vertex count alone does not ensure this. A disjoint union of triangles can have arbitrarily many vertices while its rooted local limit is still a triangle.\n\nAldous's objective method asks which finite questions become easier on this limit, then proves a transfer theorem. Local convergence by itself is not such a transfer theorem. [2]\n\nPr[B_r(Gₙ,oₙ) ≅ H] → Pr[B_r(G,o) ≅ H]\n\n## The random assignment problem\n\nLet c(i,j) be independent exponential random variables of mean one, for 1 ≤ i,j ≤ n. Define Aₙ as the minimum of Σᵢ c(i,π(i)) over permutations π. Each cheap choice competes with all choices in the same row and column, so the objective is globally coupled.\n\nAldous proved that E[Aₙ] tends to ζ(2) = π²/6. His construction solves a matching problem on the Poisson weighted infinite tree, an infinite limit that exposes a recursive structure absent from the original matrix. The result also describes edge costs in optimal assignments and an essential uniqueness property for near-optimal matchings. [3]\n\nThe lesson is not that every global optimization parameter is local. It is that a particular infinite model can organize a proof of its asymptotics, with substantial work needed to justify convergence of optimal solutions and costs.\n\nAₙ = min_π Σᵢ c(i,π(i)); lim E[Aₙ] = π²/6\n\n## The continuum random tree\n\nFor a critical Galton–Watson tree conditioned to have n vertices, with finite nonzero offspring variance, distances typically scale as √n. After rescaling, the trees converge to a Brownian continuum random tree, up to the variance-dependent scale factor. [4]\n\nA Brownian excursion e on [0,1] constructs the limit through the pseudometric d(s,t)=e(s)+e(t)−2 min e(u), where the minimum is over u between s and t. Identify pairs at distance zero to obtain a genuine real tree.\n\nThis is a scaling limit, not the same object as a fixed-radius local weak limit. The continuum tree retains rescaled metric shape and a mass measure. The distinction gives a useful example of two different limit procedures applied to discrete trees.\n\nd(s,t) = e(s)+e(t)−2 min{e(u): min(s,t) ≤ u ≤ max(s,t)}\n\n## Mass transport and finite approximability\n\nAldous and Lyons formulated unimodular random networks using an invariant mass-transport identity. For every nonnegative invariant transport f, expected total mass sent from the root equals expected total mass received there. Finite uniformly rooted graphs satisfy the identity by double counting, and their local weak limits do too. [5]\n\nThe identity is necessary for finite approximation, but it does not by itself construct an approximating sequence. Probability laws of unmarked rooted components also forget some information carried by a particular graphing, such as the organization of measurable colorings.\n\nThis gives three distinct tasks: define the local limit, identify its invariant consistency laws, and establish an actual finite realization theorem. They should not be collapsed into one claim.\n\nE[Σᵥ f(G,o,v)] = E[Σᵥ f(G,v,o)]\n\n## What the objective method does not promise\n\nTwo locally convergent sequences can have the same unmarked rooted limit while differing in important global behavior. For instance, putting two large pieces next to each other with very few connecting edges creates a global bottleneck that typical fixed-radius observations may miss.\n\nAccordingly, possible tools such as spectral control, decomposition, couplings or local–global information need to be matched to the parameter under investigation. The research suggestion is to identify the exact additional hypothesis that makes a chosen global quantity transfer, not to assume all finite approximability is captured by one extra number.\n\n## Three directions to explore\n\n1. Should the next profile focus on local–global convergence and graphings rather than ordinary local weak convergence?\n\n2. Would a concrete mass-transport proof be the best way to clarify what unimodularity does and does not enforce?\n\n3. Should the next mathematician come from probability and unimodularity or the group-theoretic side of soficity?\n\n## Sources\n\n- [[1] Berkeley: David Aldous](https://statistics.berkeley.edu/people/david-aldous)\n\n- [[2] Aldous–Steele, The objective method](https://doi.org/10.1007/978-3-662-09444-0_1)\n\n- [[3] Aldous, The zeta(2) limit in the random assignment problem](https://arxiv.org/abs/math/0010063)\n\n- [[4] Aldous: The Continuum Random Tree](https://www.stat.berkeley.edu/~aldous/Research/research-crt.html)\n\n- [[5] Aldous–Lyons, Processes on Unimodular Random Networks](https://arxiv.org/abs/math/0603062)\n"},{"event_id":"daily-2026-10-02","source_key":"daily:2026-10-02","created_at":"2026-10-06T23:21:32Z","kind":"daily-profile","person_id":"schramm","name":"Oded Schramm","summary":"Publish the 2026-10-02 profile of Oded Schramm: From local graph limits to stochastic geometry.","revision":"93ec5c39302b397e3bd669ba530d8b8e967db3b03c6bc09d9bd3879ba06e6335","article_markdown":"# Oded Schramm — From local graph limits to stochastic geometry\n\nOded Schramm (1961–2008) connected probability, conformal geometry and combinatorics. His work on Schramm–Loewner evolution and on sparse graph limits gave different ways to understand large discrete structures through limiting objects. [1–5]\n\nA common theme is to identify which structure survives a limit, then use that structure to obtain information invisible in any individual finite neighborhood.\n\n∂ₜgₜ(z) = 2 / (gₜ(z) − √κ Bₜ)\n\n## A random curve encoded by Brownian motion\n\nThe chordal Loewner equation describes a growing planar hull by a real-valued driving function ξₜ. Schramm's insight was that conformal invariance, an appropriate domain Markov property and symmetry put strong restrictions on the driving process. In the standard normalization the resulting family has ξₜ = √κ Bₜ, with B standard Brownian motion.\n\nThis does not mean every random planar curve is SLE, or that conformal invariance alone proves convergence of a discrete model. Schramm's initial work proposed and characterized scaling limits in the loop-erased random walk and uniform spanning tree setting. Lawler, Schramm and Werner subsequently established convergence to SLE₂ for planar loop-erased random walk, and to SLE₈ for the uniform-spanning-tree Peano curve under appropriate boundary conditions. [1,2]\n\nThe change of language is the breakthrough: a fractal geometric object can be analyzed using a one-dimensional stochastic process and complex analysis.\n\n## What a typical vertex sees\n\nFor a finite graph Gₙ, choose a root oₙ uniformly from its vertices. With a common degree bound, local weak convergence means that for every fixed radius r and finite rooted ball H, the probability that Bᵣ(Gₙ,oₙ) is isomorphic to H converges.\n\nThis records rooted neighborhood distributions, not a vertex-by-vertex identification of successive graphs. The limit may be supported on finite components; an infinite limit needs additional conditions. Benjamini–Schramm convergence became a central language for sparse graph limits. [3]\n\nThe distinction from a metric scaling limit is important. SLE and continuum trees involve rescaling geometry; local weak convergence keeps the graph-distance scale fixed and samples a typical neighborhood.\n\nPr[Bᵣ(Gₙ,oₙ) ≅ H] → Pr[Bᵣ(G,o) ≅ H]\n\n## A global conclusion from planar finite approximants\n\nBenjamini and Schramm proved that a distributional limit of uniformly rooted finite connected planar graphs, with uniformly bounded degrees, is almost surely recurrent for simple random walk. [3]\n\nRecurrence is an infinite-time statement: a walk returns to its starting point almost surely. No fixed-radius inspection decides it in general. The theorem obtains it from the combination of local convergence, planarity and the way the finite root is sampled.\n\nCircle packing is an essential geometric ingredient. The conclusion is not that every bounded-degree infinite planar graph is recurrent: regular trees supply counterexamples. Being a limit of the specified finite planar graphs imposes additional restrictions.\n\n## Hyperfiniteness: cutting into uniformly small pieces\n\nFollowing Elek's terminology, a bounded-degree finite graph family is hyperfinite if for every ε > 0 there is a finite k(ε) such that every graph in the family can be split into components of at most k(ε) vertices by removing at most ε|V| edges.\n\nSchramm extended this notion to the space of random rooted limits and proved a transfer theorem: if a sequence of finite bounded-degree graphs converges to a hyperfinite limit, then the sequence is a hyperfinite family. [4]\n\nThe uniform quantifiers matter. Merely saying that each individual finite graph can be partitioned into finite pieces is vacuous. A single component-size bound must work across the entire family, once ε is fixed. The random-rooted definition also requires a compatible invariant probabilistic deletion rule, not arbitrary root-dependent choices.\n\n∀ε > 0 ∃k < ∞ ∀G in the family: deleting ≤ ε|V(G)| edges leaves components of size ≤ k.\n\n## From graph limits to algorithms\n\nWith Itai Benjamini and Asaf Shapira, Schramm proved that every minor-closed graph property is testable with a number of queries independent of the graph's size in the bounded-degree model. The query bound may depend on the degree bound and the distance parameter ε. [5]\n\nA property tester distinguishes graphs satisfying the property from graphs requiring many edge changes to satisfy it, with bounded error. It does not decide exact membership on all graphs after inspecting a constant number of vertices. That promise gap is what makes local sampling useful.\n\nThese results show a recurring pattern: local statistics alone can forget important global features, but local statistics together with the right structural restrictions can yield both infinite probabilistic conclusions and finite algorithmic guarantees.\n\n## Three directions to explore\n\n1. Should the next profile stay with local-to-global graph limits, especially hyperfiniteness and graphings?\n\n2. Would a proof sketch of the hyperfinite-limit theorem be more useful than another broad biography?\n\n3. Should the next person come from the sofic-group side, Borel-graph side, or sparse property-testing side?\n\n## Sources\n\n- [[1] Schramm, Scaling limits of loop-erased random walks and uniform spanning trees](https://arxiv.org/abs/math/9904022)\n\n- [[2] Lawler–Schramm–Werner, Conformal invariance of planar loop-erased random walks and uniform spanning trees](https://arxiv.org/abs/math/0112234)\n\n- [[3] Benjamini–Schramm, Recurrence of distributional limits of finite planar graphs](https://arxiv.org/abs/math/0011019)\n\n- [[4] Schramm, Hyperfinite graph limits](https://arxiv.org/abs/0711.3808)\n\n- [[5] Benjamini–Schramm–Shapira, Every minor-closed property of sparse graphs is testable](https://arxiv.org/abs/0801.2797)\n"},{"event_id":"daily-2026-10-03","source_key":"daily:2026-10-03","created_at":"2026-10-06T23:21:32Z","kind":"daily-profile","person_id":"kechris","name":"Alexander S. Kechris","summary":"Publish the 2026-10-03 profile of Alexander S. Kechris: When definability changes the combinatorics.","revision":"85c38714f06273a82b1eeb3817525d08db6b621b8caa978915ead86ceabd4bbd","article_markdown":"# Alexander S. Kechris — When definability changes the combinatorics\n\nAlexander S. Kechris helped develop descriptive set theory as a framework for classification, group actions and infinite combinatorics. His work with Solecki and Todorčević made Borel graph coloring a central example of how requiring definable solutions changes a combinatorial problem. [1,2]\n\nDefinability is an additional mathematical constraint, not an automatic by-product of an existence theorem. This distinction is essential in graphings and measurable dynamics.\n\nordinary existence ≠ Borel existence\n\n## A coloring must be a definable function\n\nLet X be a standard Borel space and E ⊆ X×X an irreflexive symmetric Borel relation. An ordinary proper coloring is any function assigning different colors to adjacent points. A Borel coloring must additionally be Borel measurable.\n\nEvery acyclic graph is combinatorially 2-colorable. Yet acyclic Borel graphs can fail to have even a countable Borel coloring. A choice of a bipartition in each component may exist abstractly without being selectable in a Borel fashion across all components.\n\nKechris, Solecki and Todorčević's Borel Chromatic Numbers systematically develops this difference. Their bounded-degree theorem gives a contrasting positive result: a Borel graph of finite maximum degree d admits a Borel proper coloring with d+1 colors. [1]\n\nc is proper ⇔ xEy implies c(x) ≠ c(y).\n\n## The G₀ dichotomy\n\nThe same paper identifies a fixed analytic graph G₀ on Cantor space with a universal obstruction property. For an analytic graph on a Polish space, either it has a countable Borel coloring, or G₀ admits a continuous graph homomorphism into it. The alternatives are mutually exclusive. [1]\n\nThis is not a literal forbidden-subgraph characterization. A continuous homomorphism need not be injective and need not preserve nonedges. Its job is to transfer adjacency and the obstruction to countable Borel colorability.\n\nThe methodological change is important: a definable reduction, rather than literal containment, can be the right way to compare the complexity of infinite structures.\n\ncountable Borel coloring  OR  a continuous homomorphism G₀ → G\n\n## Orbit equivalence and graphings\n\nA countable group Γ acting by Borel automorphisms on X defines an orbit equivalence relation: x and y are related when y = γx for some γ in Γ. A generating set gives a graph connecting x to its generator translates; connected components are the orbits.\n\nA probability-preserving action can also supply a measured graphing. The measure-preserving hypothesis is essential: an arbitrary Borel action on a standard Borel space is not automatically a probability graphing.\n\nKechris and Benjamin Miller's Topics in Orbit Equivalence develops hyperfiniteness, amenability and cost in this setting, including the relation between Borel statements and measure-theoretic statements. [2]\n\nx EΓ y ⇔ ∃γ ∈ Γ such that γx = y\n\n## What hyperfinite means here\n\nA countable Borel equivalence relation E is hyperfinite when it is the increasing union of finite Borel equivalence relations Eₙ. Finite here means that every Eₙ-class is finite; there need not be one bound on their sizes. [2]\n\nThis resembles cutting finite graphs into small components, but the definitions live in different categories. Borel hyperfiniteness is a statement on the whole space. Measured hyperfiniteness may disregard a null exceptional set. Finite-graph hyperfiniteness asks for uniform small-component bounds after deleting a small fraction of edges.\n\nConnections between these notions require the relevant hypotheses. They should not be identified merely because all three involve finite pieces.\n\nE₁ ⊆ E₂ ⊆ ⋯ and E = ⋃ₙ Eₙ\n\n## The two separate local-to-global problems\n\nFor infinite graphs, one question is whether local constraints permit a global matching, coloring or decomposition. Another is whether that global solution can be selected with the required regularity.\n\nBorel, measurable for a specified measure, and Baire measurable for a specified topology are different requirements. A Borel solution meets the corresponding measurability requirements, but abstract existence alone supplies none of them. Working outside a null or meager exceptional set changes the assertion again.\n\nKechris's broader framework is to code objects in standard Borel or Polish spaces, formulate the regularity requirement precisely, and compare obstructions through definable maps. This makes it possible to distinguish combinatorial impossibility from the failure of definable choice. [1,2]\n\n## Three directions to explore\n\n1. Should the next profile continue into Borel graph theory or return to graph limits?\n\n2. Would a worked proof of one Borel-combinatorics theorem be more useful than a broad biography?\n\n3. Should the next focus be Borel versus measurable and Baire-measurable phenomena, or finite approximability and soficity?\n\n## Sources\n\n- [[1] Kechris–Solecki–Todorčević, Borel Chromatic Numbers (1999)](https://authors.library.caltech.edu/records/mbe97-y1b24)\n\n- [[2] Kechris–Miller, Topics in Orbit Equivalence (2004)](https://link.springer.com/book/10.1007/b99421)\n"},{"event_id":"daily-2026-10-04","source_key":"daily:2026-10-04","created_at":"2026-10-06T23:22:51Z","kind":"daily-profile","person_id":"weiss","name":"Benjamin Weiss","summary":"Publish the 2026-10-04 profile of Benjamin Weiss: Finite models for infinite dynamics.","revision":"08c01f87a8c32bfe6a887a5b7abba7b54bacf49551628aea0523b1be56093c96","article_markdown":"# Benjamin Weiss — Finite models for infinite dynamics\n\nBenjamin Weiss is a mathematician whose work connects ergodic theory, symbolic dynamics and group actions. Finite descriptions and approximate finite models recur across his work, from sofic symbolic systems to amenable actions and sofic groups. [1–4]\n\nFinite quotients, Følner sets and sofic approximations provide different mechanisms for comparing finite and infinite structures. Weiss helped develop the distinctions and their dynamical consequences.\n\nd_Ham(σ_gσ_h, σ_gh) < ε\n\n## Sofic symbolic systems\n\nA shift of finite type is a space of sequences over a finite alphabet specified by finitely many forbidden local patterns. A sofic shift is a factor of a shift of finite type; equivalently in the one-dimensional setting, it has a presentation by a finite labeled graph.\n\nWeiss's 1973 paper Subshifts of finite type and sofic systems studies this broader class. [1] The distinction is between a finite list of local constraints and a finite-state presentation whose hidden states may be forgotten. An infinite collection of sequences can still have a finite description.\n\n## Approximating a group by permutations\n\nGromov introduced the relevant group-approximation idea, and Weiss's 2000 paper supplied the term sofic and developed its link with dynamics. [2]\n\nFor permutations α and β of a finite set V, normalized Hamming distance is the fraction of points on which they disagree. A sofic approximation assigns finite permutations σ_g to group elements so that, on each prescribed finite part of the group, multiplication is almost respected and distinct elements act differently on almost every point. One can require σ_e to be the identity.\n\nThe finite set and approximation can change as the tested part grows and the allowed error decreases. This is not an exact representation of the whole group into one finite symmetric group.\n\nd_Ham(α,β) = |{v ∈ V : α(v) ≠ β(v)}| / |V|;  d_Ham(σ_g,σ_h) > 1−ε for distinct tested g,h.\n\n## Two reasons finite approximation can work\n\nResidual finiteness supplies genuine finite quotients separating any prescribed finite set of group elements. Amenability supplies finite Følner sets with a negligible translation boundary.\n\nBoth mechanisms produce sofic approximations, but neither is the definition of soficity. For finitely generated groups, the graph picture is a finite generator-labeled graph whose fixed-radius neighborhood is correct around almost every vertex. The approximating graph need not itself be a finite Cayley graph. [2]\n\nThe useful separation is exact finite quotient versus approximately correct finite model. Conflating them would impose an unnecessary symmetry requirement on the approximants.\n\n|gFₙ △ Fₙ| / |Fₙ| → 0 for every fixed g.\n\n## Ornstein–Weiss: finite towers for amenable actions\n\nWith Donald Ornstein, Weiss extended fundamental approximation methods from one measure-preserving transformation, or a ℤ-action, to actions of countable amenable groups.\n\nTheir Rokhlin-lemma work gives a way to approximate free probability-preserving amenable actions by large finite tower structures, with small errors. [3] The more general theory uses suitable families of shapes and approximate tilings; it should not be reduced to the claim that every action has an exact tiling by one arbitrary Følner set.\n\nThese methods made entropy and isomorphism theory possible in a substantially broader dynamical setting. Finite pieces are useful because amenability allows boundary effects to be controlled.\n\n## Mean topological dimension\n\nWith Elon Lindenstrauss, Weiss developed mean topological dimension, building on an invariant introduced by Gromov. It measures effective dimension per iterate rather than the dimension of the state space alone. [4]\n\nFor a compact metric system with transformation T, compare points using dₙ(x,y) = max₀≤j<n d(Tʲx,Tʲy). Roughly, mean dimension normalizes by n the topological dimension needed to describe orbit segments at a fixed resolution, then lets the resolution improve.\n\nThis is not simply entropy with a different name. It can distinguish behavior when ordinary topological dimension and entropy are both infinite.\n\ndₙ(x,y) = max {d(Tʲx,Tʲy) : 0 ≤ j < n}.\n\n## Finite approximation now has a boundary\n\nThe existence of nonsofic examples has made it especially important to separate sufficient approximation mechanisms from a general characterization. A 2026 preprint by Gábor Kun and Andreas Thom constructs nonsofic wreath products from suitable residually finite groups and builds on earlier nonsofic constructions. [5]\n\nThat is a specific theorem about particular constructions, not a claim that all property-(T) groups or all nonamenable groups are nonsofic. This profile records the preprint as a source, not as an independently audited proof.\n\nWeiss's lasting conceptual contribution is to look for a useful intermediate notion between finite and infinite: weak enough to capture many examples, but strong enough to retain algebraic and dynamical consequences.\n\n## Three directions to explore\n\n1. Should the next profile explain mechanisms behind nonsofic constructions, including the role of property (T) and expansion?\n\n2. Would amenability and Følner approximations, where finite models work particularly well, be more useful next?\n\n3. Should the next entry connect sofic groups to graphings, invariant random graphs, and co-soficity?\n\n## Sources\n\n- [[1] Weiss, Subshifts of finite type and sofic systems (1973)](https://cris.huji.ac.il/en/publications/subshifts-of-finite-type-and-sofic-systems/)\n\n- [[2] Weiss, Sofic groups and dynamical systems (2000)](https://cris.huji.ac.il/en/publications/sofic-groups-and-dynamical-systems/)\n\n- [[3] Ornstein–Weiss, Ergodic theory of amenable group actions I: the Rohlin lemma](https://doi.org/10.1090/S0273-0979-1980-14702-3)\n\n- [[4] Lindenstrauss–Weiss, Mean topological dimension (2000)](https://cris.huji.ac.il/en/publications/mean-topological-dimension/)\n\n- [[5] Kun–Thom, Nonsofic wreath products of residually finite groups (2026 preprint)](https://arxiv.org/abs/2608.06222)\n"},{"event_id":"daily-2026-10-05","source_key":"daily:2026-10-05","created_at":"2026-10-06T23:22:51Z","kind":"daily-profile","person_id":"ornstein","name":"Donald Ornstein","summary":"Publish the 2026-10-05 profile of Donald Ornstein: When entropy classifies an infinite random system.","revision":"7da962d5339f96d6851eb4cc1a035b3757da57813c189f6b0ff5624b72febac7","article_markdown":"# Donald Ornstein — When entropy classifies an infinite random system\n\nDonald Ornstein transformed ergodic theory by proving that equal entropy is sufficient for isomorphism of Bernoulli shifts. His later work with Benjamin Weiss extended classification and finite-approximation methods to amenable-group actions. [1–3]\n\nThe striking lesson is not that one number classifies all dynamics. It is that a complete invariant can emerge after the right structural class and the right notion of equivalence have been identified.\n\nBernoulli ℤ-shifts: equal entropy ⇔ measure-preserving isomorphism\n\n## What a Bernoulli shift is\n\nChoose a finite alphabet A with probability vector p. A point of A^ℤ is a bi-infinite sequence, sampled with independent p-distributed coordinates. The transformation T shifts each coordinate one place: (Tx)ₙ = xₙ₊₁.\n\nThe entropy of this Bernoulli system is H(p) = −Σₐ pₐ log₂ pₐ. Entropy was already known to be invariant under measure-preserving isomorphism. Ornstein's theorem proves the difficult converse within the Bernoulli class: equal base entropy implies isomorphism. [1]\n\nThus different alphabets and probability vectors can describe equivalent shift systems. The isomorphism is measurable, defined up to null sets, and intertwines the shifts. It is not asserted to be a topological conjugacy or a one-symbol recoding.\n\nh(T) = −Σₐ pₐ log₂ pₐ;  Φ ∘ T = S ∘ Φ almost everywhere.\n\n## Why the converse was difficult\n\nEntropy compresses a process into one asymptotic information rate. At first it provides only a necessary test: unequal values rule out isomorphism. A complete invariant requires a construction or existence argument in the opposite direction.\n\nOrnstein's machinery compares long finite blocks and increasingly accurate joinings and recodings. The important step is not simply observing that typical blocks have comparable counts. It is making successive approximations consistent enough to obtain an invertible measurable map on the infinite processes.\n\nThis is why the theorem is stronger than a counting calculation. It upgrades controlled finite approximations to an exact equivalence modulo null sets. [1,2]\n\n## The d-bar viewpoint\n\nFor stationary processes on a common finite alphabet, let λ range over stationary couplings with the required marginal laws. Define d-bar as the infimum of the probability of a mismatch at coordinate zero.\n\nThis compares whole processes through compatible joint distributions, not independent one-coordinate comparisons. Stationarity makes the mismatch probability representative of the mismatch rate.\n\nThe d-bar framework is one of the tools of Ornstein theory. Equal entropy does not imply d-bar distance zero between arbitrary original codings. Recoding and the special structural properties of Bernoulli processes are essential. [2]\n\nd̄(μ,ν) = inf {λ(X₀ ≠ Y₀) : λ is a stationary coupling of μ and ν}.\n\n## The structural hypothesis is indispensable\n\nEntropy does not classify arbitrary measure-preserving systems. A simple warning comes from finite probability spaces: the identity map and a nontrivial cyclic permutation both have zero entropy but are not isomorphic as transformations.\n\nThe Bernoulli theorem is therefore not an instruction to search for a single number and ignore structure. Its force comes from identifying a class where enough randomness is present to support a very strong classification argument.\n\nA necessary invariant, a complete invariant on one class, and a universal classification are three different achievements. Ornstein established the middle one in a major and initially unexpected setting.\n\n## From ℤ to amenable groups\n\nFor a countable amenable group, Følner sets have small relative boundary under each fixed translation. Ornstein and Weiss used finite towers and quasi-tiling ideas to extend approximation, entropy and isomorphism theory from ℤ-actions to amenable-group actions. [3]\n\nAn informal picture is an infinite action approximated by many large finite pieces, with boundary errors controlled in measure. The precise action, freeness and measure assumptions must be retained; this is not a purely combinatorial tiling assertion.\n\nThe result connects classification with the same finite-versus-infinite theme that occurs in graph decompositions and local limits, while remaining a theorem in measured dynamics.\n\n## A later continuation beyond amenability\n\nSeward proved that Bernoulli shifts over any countably infinite group with equal base Shannon entropy are isomorphic, extending Ornstein's sufficiency theorem beyond the amenable case. The paper builds on work of Lewis Bowen and also treats finitary isomorphisms for finite bases. [4]\n\nThe statement here is equal entropy implies isomorphism. It should not silently be strengthened to a complete two-way entropy classification for arbitrary countable groups.\n\nThe broader methodological lesson is to separate the invariant, the structural class and the equivalence relation. Only after these are specified can approximate finite information be asked to determine an infinite object.\n\n## Three directions to explore\n\n1. Should the next profile follow this theory into sofic entropy and Lewis Bowen's work?\n\n2. Should the next focus be property (T), expansion and rigidity rather than amenable approximation?\n\n3. Would hyperfiniteness and measurable equivalence relations, with almost-finite decompositions, be the most useful continuation?\n\n## Sources\n\n- [[1] Ornstein, Bernoulli shifts with the same entropy are isomorphic (1970)](https://doi.org/10.1016/0001-8708(70)90029-0)\n\n- [[2] Donald Ornstein, Ornstein Theory (author-written survey, 2008)](https://www.scholarpedia.org/article/Ornstein_theorem)\n\n- [[3] Ornstein–Weiss, Entropy and isomorphism theorems for actions of amenable groups (1987)](https://doi.org/10.1007/BF02790325)\n\n- [[4] Seward, Bernoulli shifts with bases of equal entropy are isomorphic (2022)](https://www.aimsciences.org/article/doi/10.3934/jmd.2022011)\n"}],"publishing":{"repository":"https://github.com/hadi1373z/atlas-of-ideas","site":"https://hadi1373z.github.io/atlas-of-ideas/","schemaVersion":1,"privateNotes":"browser-local","buildId":"b5913ba25e6334c676a48343612abb36f0d371388e41a21eedbd8c1e6b396b77","sourceCommit":"90a6dab9f7ae7b54bb34e0d7d8cabac155775e40"}}</script>

    body+=label(680,92,'…')+label(545,174,'A witness may appear.','text-anchor="middle"')+label(545,201,'Silence is not a NO.','text-anchor="middle"');

  } else if(id==='verification') {
    const pts=[[100,55],[215,70],[255,165],[120,195],[50,120]];

    pts.forEach(([x,y],i)=>body+=dot(x,y,13,'class="plate-node"')+label(x,y+5,String(i+1),'text-anchor="middle"'));
    body+=label(385,75,'A proposed tour')+label(385,114,'1 → 2 → 3 → 4 → 5 → 1')+label(385,164,'Check each edge.')+label(385,195,'Check each vertex appears once.');
  } else if(id==='approximation') {
    const pts=[[150,45],[265,95],[220,205],[80,205],[35,95]];

  if (obj.answers && typeof obj.answers === 'object') for (const [id,index] of Object.entries(obj.answers)) if (validID(id) && Number.isInteger(index) && index >= 0 && index < 3) out.answers[id] = index;

const profileText = p => [p.name,p.id,p.title,p.bio,p.impact,p.formula,D.fields[p.field].name,...p.sections.flatMap(s=>[s.title,s.text,s.math||''])].join(' ');
const searchIndex = Object.fromEntries(PEOPLE.map(p=>[p.id,normal(profileText(p))]));
const termFits = (text,term) => { const t=normal(term); return /^[a-z]{1,3}$/.test(t) ? new RegExp('\\b'+t+'s?\\b').test(text) : text.includes(t); };

  const terms=termsOf(query); if(!terms.length)return esc(text);
  // Map normalized indices back to the original text, including accented names.
  const chars=Array.from(String(text)), flat=[], indexes=[];
  chars.forEach((c,i)=>{for(const ch of normal(c)){flat.push(ch);indexes.push(i);}});
  const norm=flat.join(''), marked=new Set();
  for(const t of terms){let at=norm.indexOf(t);while(at>=0){for(let j=at;j<at+t.length;j++)marked.add(indexes[j]);at=norm.indexOf(t,at+Math.max(1,t.length));}}

  chars.forEach((c,i)=>{if(marked.has(i)&&!open){out+='<mark>';open=true;}if(!marked.has(i)&&open){out+='</mark>';open=false;}out+=esc(c);});
  return out+(open?'</mark>':'');

  let best=chunks.map(c=>({...c,score:terms.filter(t=>normal(c.text).includes(t)).length})).sort((a,b)=>b.score-a.score)[0];
  const index=Math.min(...terms.map(t=>normal(best.text).indexOf(t)).filter(i=>i>=0));
  const start=Number.isFinite(index)?Math.max(0,index-70):0;
  return {html:highlight((start?'…':'')+best.text.slice(start,start+220)+(best.text.length>start+220?'…':''),query),section:best.section};

  return `<a class="concept-card" href="#idea/${c.id}" style="--field-color:${D.fields[c.field].color};--field-soft:${D.fields[c.field].soft}"><div class="concept-top"><span class="eyebrow">${String(i+1).padStart(2,'0')} / ${esc(c.name)}</span>${ico('diagonal')}</div><h3>${esc(c.question)}</h3><div class="concept-bottom"><span>${count} RELATED PROFILES</span><span class="concept-orbit" aria-hidden="true"></span></div></a>`;
}
function trailcard(t,i) {
  const done=t.ids.filter(id=>state.read.includes(id)).length;
  return `<a class="trail-card" href="#trail/${t.id}" style="--field-color:${D.fields[t.field].color};--field-soft:${D.fields[t.field].soft}"><div class="eyebrow">${esc(t.tag)}</div><span class="trail-number">${String(i+1).padStart(2,'0')}</span><div class="path-mini" aria-hidden="true">${t.ids.map((id,j)=>`${j?'<span></span>':''}<i class="${state.read.includes(id)?'done':''}"></i>`).join('')}</div><h3>${esc(t.title)}</h3><p>${esc(t.description)}</p><div class="trail-bottom"><span>${t.ids.length} PROFILES · ${done} READ</span>${ico('arrow')}</div></a>`;
}

function library(field,params=new URLSearchParams()) {
  if(field&&Object.hasOwn(D.fields,field)){cat.field=field;cat.query='';}
  if(params.has('q')){cat.query=params.get('q');cat.field='all';cat.limit=24;}
  main.innerHTML=`<div class="wrap"><div class="page-head"><div class="eyebrow">THE COMPLETE COLLECTION</div><div class="head-line"><h1>Meet the minds.</h1><p>${PEOPLE.length} people. ${PEOPLE.filter(p=>p.extended).length} expanded profiles.<br>Search by a name, theorem or idea.</p></div></div><section class="collection-section"><div class="filterbar"><label class="search-input">${ico('search')}<input id="collection-search" type="search" value="${esc(cat.query)}" placeholder="Try ‘locality’, ‘permanent’, ‘Gödel’…" aria-label="Search names and full profile text"></label><select id="sort-select" aria-label="Sort profiles"><option value="featured">Suggested first</option><option value="name">Name A–Z</option><option value="oldest">Birth year: earliest</option><option value="newest">Birth year: latest</option></select><select id="scope-select" aria-label="Filter profile status"><option value="all">All profiles</option><option value="extended">Expanded profiles</option><option value="unread">Unread profiles</option><option value="saved">Saved profiles</option></select><div class="view-toggle" role="group" aria-label="Display style"><button data-action="view" data-mode="grid" aria-label="Grid view" aria-pressed="${cat.view==='grid'}">${ico('grid')}</button><button data-action="view" data-mode="list" aria-label="List view" aria-pressed="${cat.view==='list'}">${ico('list')}</button></div></div><div class="pills" id="field-pills" aria-label="Filter by research field">${fieldPills()}</div><div class="results-line"><span id="result-count" role="status" aria-live="polite"></span><button data-action="reset-filters">Reset filters</button></div><div id="catalogue-results"></div></section></div>`;
  $('#sort-select').value=cat.sort;$('#scope-select').value=cat.scope;renderResults();
}
function filtered() {
  const terms=termsOf(cat.query);
  return orderedPeople(PEOPLE.filter(p=>(cat.field==='all'||p.field===cat.field)&&(cat.scope==='all'||cat.scope==='extended'&&p.extended||cat.scope==='unread'&&!state.read.includes(p.id)||cat.scope==='saved'&&state.saved.includes(p.id))&&terms.every(t=>searchIndex[p.id].includes(t))),cat.sort);
}
function renderResults() {
  if(!$('#catalogue-results'))return;
  const list=filtered();
  $('#result-count').textContent=`${list.length} ${list.length===1?'PROFILE':'PROFILES'}${cat.query?' · MATCHING YOUR SEARCH':''}`;
  $('#catalogue-results').innerHTML=list.length?`<div class="card-grid ${cat.view==='list'?'list-view':''}">${list.slice(0,cat.limit).map(p=>card(p,cat.query)).join('')}</div>${list.length>cat.limit?`<div class="load-row"><button class="btn" data-action="load-more">Show ${Math.min(24,list.length-cat.limit)} more ${ico('down')}</button><span>${Math.min(cat.limit,list.length)} of ${list.length}</span></div>`:''}`:`<div class="empty"><div class="eyebrow">TRY A DIFFERENT ANGLE</div><h2>No matching profiles.</h2><p>Use a surname or a broader idea, or reset the field and status filters.</p><button class="btn" data-action="reset-filters">Reset the collection ${ico('arrow')}</button></div>`;
}

function mathblock(p,s=null,index=-1) {
  const item=s||p,text=item.math||item.formula||'',svg=item.mathSVG;
  return `<figure class="math-block"><div class="math-caption"><span>${index===-1?'THE SIGNATURE IDEA':'MATHEMATICAL NOTE'}</span><button data-action="equation" data-id="${p.id}" data-index="${index}" aria-label="Expand equation: ${esc(text)}">${ico('fit')}<span>Expand</span></button></div><div class="formula" role="math" aria-label="${esc(text)}"><div aria-hidden="true">${svg||esc(text)}</div></div></figure>`;
}
function toc(p,mobile=false) {
  const sections=[['overview','The essential idea'],...p.sections.map((s,i)=>['section-'+i,s.title]),['notes','Your margin notes'],['questions','Questions to follow'],['sources','Sources & reading']];
  return `<nav class="reader-toc ${mobile?'mobile-toc':''}" aria-label="Profile contents">${sections.map(([id,title],i)=>`<a href="${personLink(p.id,id)}" data-action="jump" data-section="${id}" data-toc="${id}"><span>${i===0?'—':String(i).padStart(2,'0')}</span>${esc(title)}</a>`).join('')}</nav>`;
}

function questionRecommendation(id,index) {

// ----- Map and route finder: every step reuses a recorded labeled edge. -----
function shortestRoute(start,end,directed=false) {
  if(!validID(start)||!validID(end))return null;
  const queue=[start],seen=new Map([[start,null]]);
  for(let i=0;i<queue.length;i++) {
    const id=queue[i];if(id===end)break;
    for(const edge of D.connections){
      const next=edge.source===id?edge.target:(!directed&&edge.target===id?edge.source:null);
      if(!next||seen.has(next))continue;seen.set(next,{from:id,edge});queue.push(next);
    }
  }
  if(!seen.has(end))return null;
  const nodes=[end],steps=[];let cursor=end;
  while(cursor!==start){const item=seen.get(cursor);steps.unshift({from:item.from,to:cursor,edge:item.edge});nodes.unshift(item.from);cursor=item.from;}
  return {nodes,steps};
}
function findPerson(value) {
  const n=normal(value).trim();return PEOPLE.find(p=>normal(p.name)===n||p.id===n)||PEOPLE.find(p=>normal(surname(p))===n)||null;
}

function validateBackup(raw){

function mergeState(current,incoming){
  const out=cleanState(current);out.saved=validIDs([...current.saved,...incoming.saved]);out.read=validIDs([...current.read,...incoming.read]);

function about(){

se text matching in this catalogue. They are navigation aids, not generated answers, scientific classifications or exhaustive literature surveys.</p><h2>Content and qualifications</h2>${D.standards.map((s,i)=>`<div class="standard"><span>${String(i+1).padStart(2,'0')}</span><p>${esc(s)}</p></div>`).join('')}<p>The starting point is the September 2026 educational snapshot. The original catalogue is preserved in the source, and subsequent changes are recorded in the <a href="#updates">publication journal</a>. A scheduled profile becomes part of this edition only after its update record is accepted, built and deployed. This page does not itself fetch your conversations or generate new articles. Neither the redesign nor a deployment constitutes independent re-verification of every claim.</p><h2>Publishing and your private notebook are separate</h2><p>The public source repository is <a class="inline-source" href="https://github.com/hadi1373z/atlas-of-ideas" target="_blank" rel="noopener noreferrer">hadi1373z/atlas-of-ideas</a>. Accepted source changes can be built and deployed to GitHub Pages. New content appears after reloading the site; there is no background polling or upload of your notebook.</p><h2>Your notebook belongs to you</h2><p>Notes, saved profiles and preferences remain in browser storage. There are no accounts, trackers, remote fonts, background requests or cloud uploads. Storage restrictions, private browsing, a new file location or clearing browser data can prevent your shelf from carrying over. Use a JSON backup when moving editions; Markdown export makes notes readable outside the website.</p><p>The original storage key and profile IDs are unchanged. Old JSON backups can be merged without discarding your current notes. Replace mode is available only after confirmation.</p><h2>Access and controls</h2><p>All main actions have keyboard controls, visible focus indicators and text labels. The graph has an equivalent connection list, so dragging is never necessary for exploring its data. Dialogs support Escape and return focus to the opening control. Reduced-motion preferences are respected. A manual screen-reader audit has not been performed.</p><div class="actions"><button class="btn" data-action="help">Keyboard guide ${ico('arrow')}</button><button class="btn" data-action="export-catalogue">Export catalogue ${ico('export')}</button></div><h2>Design references</h2><p>Implementation references: <a class="inline-source" href="https://www.w3.org/WAI/ARIA/apg/patterns/dialog-modal/" target="_blank" rel="noopener noreferrer">WAI dialog guidance</a>, <a class="inline-source" href="https://www.w3.org/WAI/WCAG22/Understanding/reflow.html" target="_blank" rel="noopener noreferrer">W3C reflow guidance</a>, and <a class="inline-source" href="https://developer.mozilla.org/en-US/docs/Web/API/Window/localStorage" target="_blank" rel="noopener noreferrer">MDN on browser storage</a>.</p></div><aside class="about-sidebar"><div class="about-number"><strong>${PEOPLE.length}</strong><span>MATHEMATICAL MINDS</span></div><div class="about-number"><strong>${D.connections.length}</strong><span>EXPLAINED CONNECTIONS</span></div><div class="about-number"><strong>${CONCEPTS.length}</strong><span>WAYS IN THROUGH IDEAS</span></div><div class="note-panel"><strong>Offline by design.</strong><p>One HTML file. No build step to read it. Only opening external sources needs internet.</p></div></aside></div></div>`;
}
