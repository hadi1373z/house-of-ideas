nother, the original observer can reproduce every decision available to the degraded observer. More useful information is defined relative to what decisions it enables.","sections":[{"title":"An experiment is a channel from a hidden state","text":"For finitely many states and signals, describe an experiment by a matrix E. Row θ gives the probabilities of its possible signals when the state is θ. A decision rule maps a signal to an action, possibly at random. A loss function then tells us how costly that action is in each state. This makes “useful” testable rather than impressionistic."},{"title":"Garbling supplies a simulation","text":"Suppose a second experiment is F = EK, where K is a stochastic matrix that processes the first signal without access to the hidden state. The observer of E can sample K and then apply any rule designed for F. The distribution of actions, and hence the risk in every state, is the same.\n\nBlackwell’s comparison theory characterizes this ordering through performance across decision problems. The finite setting is enough to see the central idea: an experiment is better when it permits all the decisions of the other, not merely when it scores better on one chosen task."},{"title":"A two-state example","text":"Let E reveal a hidden bit perfectly. Let K flip that bit with probability 1/4. Then F is a noisy observation with 3/4 chance of agreement. Someone holding E can imitate F by tossing a coin; someone holding F cannot generally reconstruct E.\n\nTo guess an equally likely hidden bit with zero-one loss, the perfect signal has error 0 and the noisy signal has minimum error 1/4. But if both states call for the same action, the signals are equally useful for that particular task. A strict difference on every task is not required."},{"title":"A bridge, with a boundary","text":"Compare this with Shannon’s information quantities. A channel description is shared mathematical language, but a single information score for one prior does not settle comparison for every decision problem. The atlas uses this as a thematic bridge to communication and learning, not as evidence that all these theories ask the same question."}],"sources":[{"label":"Blackwell · Equivalent Comparisons of Experiments (1953), abstract and publication record","url":"https://celebratio.org/Blackwell_DH/article/255/","type":"primary / scholarly"},{"label":"Bickel · David Blackwell: An explorer in mathematics and statistics (2020)","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7703635/","type":"primary / scholarly"},{"label":"Shannon · A Mathematical Theory of Communication (1948)","url":"https://people.math.harvard.edu/~ctm/home/text/others/shannon/entropy/entropy.pdf","type":"primary / scholarly"}],"questions":["Can you construct two experiments that are incomparable because each helps a different decision?","Why must the garbling matrix be independent of the hidden state?","When does compressing an observation preserve every decision you care about?"]},{"id":"hamming","extended":true,"approximateBirth":false,"readMinutes":4,"ref":"","aliases":[],"name":"Richard Hamming","born":1915,"field":"information","title":"Give a message room to survive","bio":"Richard Hamming turned unreliable digital operations into a mathematical question: how should valid messages be arranged so that a small error can be recognized and repaired?","formula":"d(x, y) = number of positions where x and y differ","impact":"Redundancy can create distance between valid messages. The receiver uses that distance to distinguish a damaged message from a different intended message.","sections":[{"title":"From a failed calculation to a code","text":"Working with computers at Bell Laboratories, Hamming studied parity checks and their limits. His 1950 paper gave explicit constructions for detecting and correcting errors; his later retrospective connects the work to the practical need for dependable computation. The mathematical object is a code: a chosen subset of all possible strings."},{"title":"A small example you can decode","text":"Encode 0 as 000 and 1 as 111. If exactly one position flips, the received word still has a majority of the intended bit. Thus 010 decodes to 000 and 101 decodes to 111. The two valid words differ in three positions.\n\nThis is the repetition code, an elementary illustration rather than the more efficient seven-bit Hamming construction. It spends three transmitted bits on one bit of information. Its simplicity lets you see the tradeoff before studying better codes."},{"title":"Distance turns noise into geometry","text":"For a code to correct every pattern of at most t bit errors, distinct codewords must have distance at least 2t + 1. Otherwise their radius-t neighborhoods can overlap, leaving the receiver unable to identify the sender’s choice uniquely. A minimum distance of three therefore permits single-error correction.\n\nHamming’s seven-bit code carries four information bits. Three parity checks produce a syndrome; for a single-bit error, it identifies which of the seven positions changed. Two errors are outside that correction guarantee.","math":"d_min ≥ 2t + 1"},{"title":"Existence and construction ask different questions","text":"Shannon describes achievable communication rates for a channel model; Hamming supplies explicit finite codes and a decoding rule. Read them together to distinguish a limit theorem from an actual method. A guarantee against one arbitrary error in a short block is different from a probability of error tending to zero as blocks grow."}],"sources":[{"label":"Hamming · Error Detecting and Error Correcting Codes (1950)","url":"https://ineffectivetheory.com/edu/papers/hamming-codes-1950.pdf","type":"primary / scholarly"},{"label":"Naval Postgraduate School · Richard Hamming","url":"https://library.nps.edu/richard-w-hamming","type":"primary / scholarly"},{"label":"Hamming · Retrospective on error correction (1982)","url":"https://garfield.library.upenn.edu/classics1982/A1982NY35700001.pdf","type":"primary / scholarly"},{"label":"Shannon · A Mathematical Theory of Communication (1948)","url":"https://people.math.harvard.edu/~ctm/home/text/others/shannon/entropy/entropy.pdf","type":"primary / scholarly"}],"questions":["Why do overlapping error neighborhoods prevent unique decoding?","How can three parity checks identify seven possible single-bit errors?","What changes when errors arrive in bursts rather than independently?"]},{"id":"julia-robinson","extended":true,"approximateBirth":false,"readMinutes":4,"ref":"","aliases":["Julia Bowman Robinson","Julia Hall Bowman Robinson"],"name":"Julia Robinson","born":1919,"field":"logic","title":"When equations encode computation","bio":"Julia Robinson connected number theory with mathematical logic. Her work with Martin Davis and Hilary Putnam prepared the route to Yuri Matiyasevich’s 1970 resolution of Hilbert’s tenth problem.","formula":"a ∈ A ⇔ ∃x₁,…,xₙ ∈ ℤ : P(a,x₁,…,xₙ) = 0","impact":"A polynomial can encode a search. The surprise is that integer solutions can express every computably enumerable set, including sets whose membership cannot be decided by an algorithm.","sections":[{"title":"A question about every equation","text":"Hilbert’s tenth problem asks for one algorithm that takes any polynomial with integer coefficients and decides whether it has an integer solution. A collection of clever methods for particular equations is not yet that universal method. Robinson’s research helped show why the unrestricted demand cannot be met."},{"title":"Finding a witness is not deciding absence","text":"For x² + y² = 25, the pair (3,4) is a witness that can be checked by substitution. For an arbitrary equation in finitely many integer variables, search successively through boxes of radius 0, 1, 2, and so on. Any existing solution eventually appears. If none exists, this search never announces that fact.\n\nThe difference between recognizing a successful search and deciding both outcomes is the bridge to computability. A bound on the search would change the task, but the unrestricted problem provides no such bound."},{"title":"The theorem belongs to a chain of work","text":"Davis, Putnam, and Robinson established a crucial exponential-Diophantine representation result. Matiyasevich supplied the missing step in 1970. The resulting DPRM theorem says that computably enumerable sets are exactly the Diophantine sets. An algorithm deciding all integer polynomial equations would therefore decide sets known to be undecidable.\n\nCredit matters here: Robinson was a central contributor to a cumulative proof, not its sole author. The formula above describes representation of a set by a polynomial with extra variables; it is not a practical recipe for solving all equations."},{"title":"The domain and the quantifiers matter","text":"Robinson’s doctoral work under Alfred Tarski established undecidability of the full first-order theory of the rational numbers. That theory allows alternating quantifiers and logical operations. Hilbert’s tenth problem asks only for existence of solutions. Do not identify these two decision problems, or silently replace integer solutions by rational or real solutions."}],"sources":[{"label":"University of California · Julia Robinson, memorial by her colleagues","url":"https://mathshistory.st-andrews.ac.uk/Obituaries/Robinson_Julia_UC/","type":"primary / scholarly"},{"label":"Poonen · Hilbert’s Tenth Problem, slides 2–4 (2006)","url":"https://math.mit.edu/~poonen/slides/h10.pdf","type":"primary / scholarly"},{"label":"Turing · On Computable Numbers (1936)","url":"https://www.cs.virginia.edu/~robins/Turing_Paper_1936.pdf","type":"primary / scholarly"}],"questions":["Why does enumeration find every existing integer solution but fail to decide all negative cases?","What must a reduction preserve when it turns a program into an equation?","How does changing the allowed domain or quantifiers change a decision problem?"]},{"id":"bayer","extended":true,"approximateBirth":false,"readMinutes":5,"ref":"","aliases":[],"name":"Rudolf Bayer","born":1939,"field":"systems","title":"Make the storage page the unit of search","bio":"Rudolf Bayer and Edward McCreight developed B-trees for maintaining large ordered indexes. The design treats a page containing many keys as one node, matching the structure to storage where fetching a page is expensive.","formula":"search page transfers = O(1 + log_B n)","impact":"High branching reduces the number of page fetches, while occupancy and equal-depth invariants keep the index usable as keys are inserted and deleted.","sections":[{"title":"A different machine suggests a different tree","text":"A binary tree branches only twice at a node. That is a natural representation when following a pointer is cheap. An index stored mainly on disk changes the question: fetching a page costs much more than comparing several keys already on that page.\n\nBayer and McCreight’s work, published in Acta Informatica in 1972, organizes ordered indexes into pages with multiple separator keys. A page directs the search into one of many child ranges. The point is to reduce expensive transfers while preserving the ability to search and update an ordered collection."},{"title":"Read one page, choose one interval","text":"Imagine a root page holding separator keys 20 and 40. Its three child pages contain [5,10], [25,30], and [45,50]. To look up 30, compare it with the root separators and follow the middle pointer. That child page contains the answer. With neither page cached, this example uses two page reads.\n\nTo search for 35, follow exactly the same pointer and conclude absence after inspecting [25,30]. The ordering invariant rules out the other pages: their keys are below 20 or above 40. A failed search therefore needs a proof of absence just as a successful search needs a match."},{"title":"A split preserves order and depth","text":"Use a small B-tree convention in which a non-root page holds between two and four keys. Suppose the middle leaf has become [25,28,30,35], and we insert 32. Its temporary five-key content is [25,28,30,32,35]. Promote the median 30 to the parent and leave two pages [25,28] and [32,35]. The root becomes [20,30,40] with four children.\n\nEach resulting leaf meets the occupancy rule, every key remains in the correct interval, and all leaves remain at the same depth. If the parent overflows, split it too. When a root splits, introducing a new root increases every leaf’s depth together. Deletion requires the corresponding care with redistribution or merging."},{"title":"What the logarithm measures","text":"When page capacity is proportional to B and non-root pages retain a constant fraction of capacity, branching grows proportionally to B. This yields O(1+log_B n) page transfers for a search among n keys, in the usual page model. It does not say that all computation inside each page is free in real time.\n\nRead Codd for a useful conceptual separation: a relational data model describes data and queries; a B-tree is one possible physical access structure. Read Sedgewick for binary encodings of balanced multiway trees, and Tarjan for a different strategy in which accesses themselves reshape the search tree."}],"questions":["After promoting 30 in the example, which child range contains an absent key 31, and why is looking there sufficient?","Why are both minimum occupancy and equal leaf depth needed to prove a logarithmic height bound? Construct a failure when either condition is dropped.","If the root and first level remain cached, how does the number of actual page fetches differ from the tree’s full height?"],"sources":[{"label":"Bayer and McCreight · Organization and Maintenance of Large Ordered Indexes (1972), paper copy","url":"https://scispace.com/pdf/organization-and-maintenance-of-large-ordered-indices-4gyd1n5dhb.pdf"},{"label":"Bayer and McCreight · publisher record","url":"https://doi.org/10.1007/BF00288683"}]},{"id":"sedgewick","extended":true,"approximateBirth":false,"readMinutes":5,"ref":"","aliases":[],"name":"Robert Sedgewick","born":1946,"field":"algorithms","title":"Understand balance through representation","bio":"Robert Sedgewick connects algorithm design, mathematical analysis, and implementation. His work with Leonidas Guibas on a dichromatic framework explains balanced search trees using red and black links; his later exposition makes the relationship with multiway trees especially tangible.","formula":"red-black tree height = O(log n)","impact":"A representation can turn a global balance requirement into local rotation and color rules. Correctness depends on preserving both key order and the balance invariant.","sections":[{"title":"One tree, two representations","text":"With Leonidas Guibas, Sedgewick developed the 1978 dichromatic framework for balanced trees. This belongs to a history that also includes Bayer’s earlier symmetric binary B-trees; it should not be presented as an isolated invention without predecessors.\n\nSedgewick’s later left-leaning red-black presentation offers a particularly clear reading path. A red link joins two ordinary binary nodes into one conceptual two-key node. Black links connect the conceptual nodes. The binary implementation can therefore be understood through a balanced multiway structure."},{"title":"Encode a two-key node","text":"Take a conceptual node containing keys 10 and 20, with three child ranges: keys below 10, keys between 10 and 20, and keys above 20. Encode it as a black-rooted binary subtree with key 20 and a red left child 10. Attach the three child ranges to 10’s left, 10’s right, and 20’s right respectively.\n\nSearching for 15 compares first with 20, then with 10, and enters the middle range. Searching for 25 follows 20’s right link. The encoded search preserves exactly the interval decisions of the multiway node. The red link is representation metadata, not a reversal of key order."},{"title":"Why local constraints limit height","text":"A standard red-black invariant gives every root-to-null path the same number of black nodes and prohibits consecutive red nodes. If that common black-height is b under a consistent counting convention, the tree contains at least 2^b−1 internal nodes. No path can be more than roughly twice as long as its black portion. Together these facts give logarithmic height.\n\nRotations preserve binary-search order, but they do not by themselves establish every color invariant. Insertion and deletion must combine rotations with recoloring and restore the required conditions. The left-leaning variant further restricts the orientation of red links; it is useful to state which variant a proof or implementation uses."},{"title":"An algorithm is also something to examine","text":"Sedgewick’s work with Kevin Wayne supplies implementations and explanations that connect the abstract invariant with actual operations. One can test a proposed implementation by checking sorted traversal, black-height agreement, and the absence of forbidden red-link patterns after every update. Passing such checks on examples is evidence, while a proof explains why every permitted update preserves the invariants.\n\nCompare this with Tarjan and Sleator: a splay tree need not retain logarithmic height after each access. Its guarantee concerns a sequence. Compare it with Bayer: grouping keys into storage pages reduces transfers, whereas a red-black encoding uses binary nodes. These are distinct design choices even when the word tree appears in all three names."}],"questions":["Draw the binary encoding of a two-key node 15,35 and attach three nonempty child subtrees. Verify that every key retains its proper interval.","Prove the minimum-node bound in terms of black-height by induction, then identify where prohibiting adjacent red nodes enters the height argument.","Which invariant checks would distinguish a general red-black tree from the left-leaning variant? Why should a test suite avoid silently mixing their rules?"],"sources":[{"label":"Sedgewick and Wayne · Balanced Search Trees","url":"https://algs4.cs.princeton.edu/33balanced/"},{"label":"Princeton · original algorithm references, including Guibas and Sedgewick (1978)","url":"https://algs4.cs.princeton.edu/references/"},{"label":"Princeton · Robert Sedgewick, career and biography","url":"https://faculty.princeton.edu/people/robert-sedgewick-0"}]},{"id":"sleator","extended":true,"approximateBirth":false,"readMinutes":5,"ref":"","aliases":[],"name":"Daniel Sleator","born":1953,"field":"algorithms","title":"Adapt to requests without knowing the future","bio":"Daniel Sleator, working with Robert Tarjan, helped establish self-adjusting data structures and the comparison of online algorithms with an optimum that knows the future. Splay trees and list-update algorithms make these ideas concrete.","formula":"online cost ≤ c · offline optimum + initialization term","impact":"A data structure can respond to observed requests without predicting a probability distribution. Its guarantee must specify the competitor and which rearrangements cost time.","sections":[{"title":"Let the access change the representation","text":"Sleator’s work asks how a structure should reorganize itself while it is being used. An online algorithm receives requests one at a time. An offline benchmark may know the whole sequence, but it must still pay the costs allowed by the same model. Comparing the two separates a provable adaptive rule from a heuristic that merely seems reasonable.\n\nSplay trees, developed jointly with Tarjan, apply this viewpoint to ordered search. The move-to-front rule applies it to an unsorted list. The structures and proofs differ; the shared question is how much future efficiency can be bought by rearranging the present."},{"title":"Move-to-front by hand","text":"Start with the list A,B,C,D. Let accessing the item at position i cost i, and allow the accessed item to move toward the front for free. Serve the requests D,D,B,D. The first D costs 4 and produces D,A,B,C. The second costs 1. Accessing B costs 3 and produces B,D,A,C. The final D costs 2 and restores D,B,A,C. Total access cost: 10.\n\nLeaving the original list fixed would cost 4+4+2+4=14. But 14 is not the offline optimum: a better competitor could rearrange its list. This small example shows adaptation, while also showing why comparing only with a deliberately weak baseline would not prove competitiveness."},{"title":"The benchmark is part of the theorem","text":"Sleator and Tarjan’s 1985 list-update paper proves a constant-factor comparison for move-to-front in its specified model. Rearrangements have accounting rules; one cannot give the offline algorithm unlimited free reordering and expect the same theorem.\n\nTheir analysis also treats paging and least-recently-used replacement. There, the competitive guarantee depends on cache capacity. The lesson is to name the resource and the cost model before using the word optimal: list position, page faults, and tree rotations are different quantities."},{"title":"From lists to search trees","text":"An ordered search tree must preserve key order, so arbitrary list moves are unavailable. Splaying uses rotations instead. It lifts the accessed key to the root using zig, zig-zig, and zig-zag steps, and can leave the tree temporarily tall. Its logarithmic guarantee is amortized across operations.\n\nTarjan’s profile gives a rotation example and the July 2026 almost-dynamic-optimality result. That recent preprint is about the original splay algorithm, and its nonconstant competitive factor should not be confused with a proof of the full constant-factor conjecture. Read Bayer and Sedgewick to compare access-driven adaptation with structures that maintain explicit balance constraints."}],"questions":["For the same initial list, find a short request sequence on which move-to-front costs more than leaving the list unchanged. Why does that not contradict a constant-factor theorem?","How would the model change if every move toward the front also cost its distance? Which part of the worked calculation would change?","Which workloads make the distinction between a worst-case per-operation guarantee and an amortized sequence guarantee operationally important?"],"sources":[{"label":"Sleator and Tarjan · Amortized Efficiency of List Update and Paging Rules (1985)","url":"https://www.cs.cmu.edu/~sleator/papers/amortized-efficiency.pdf"},{"label":"Sleator and Tarjan · Self-Adjusting Binary Search Trees (1985)","url":"https://www.cs.cmu.edu/~sleator/papers/self-adjusting.pdf"},{"label":"Chmel et al. · Splay trees are almost dynamically optimal (2026 preprint)","url":"https://arxiv.org/abs/2607.18498"},{"label":"Carnegie Mellon · Danny Sleator, research profile","url":"https://csd.cmu.edu/people/faculty/danny-sleator"}]},{"id":"lyons","extended":true,"approximateBirth":false,"readMinutes":6,"ref":"","aliases":[],"name":"Russell Lyons","born":1957,"field":"graphs","title":"Probability on infinite graphs and mass transport","bio":"Russell Lyons works at the intersection of probability, infinite graphs, group actions and measurable structures. With Yuval Peres he wrote Probability on Trees and Networks, a systematic account of random walks, electrical networks, percolation and spanning forests. [1]","formula":"E[Σᵥ f(G,o,v)] = E[Σᵥ f(G,v,o)]","impact":"Mass transport carries finite double counting into random infinite graphs. It separates a necessary consistency law for finite approximation from the harder question of realizing that law by actual finite models.","sections":[{"title":"A network has several mathematical faces","text":"An infinite locally finite graph can be studied by running a random walk, putting resistors on its edges, deleting edges independently, or sampling a spanning forest. Each experiment extracts different information, but the answers are linked.\n\nFor example, effective resistance to infinity governs recurrence and transience in the standard reversible network setting. On trees, growth and branching influence both percolation and biased random walks. Lyons's work and the Lyons–Peres book make these connections into reusable methods rather than isolated analogies. [1]\n\nThe important change of viewpoint is to seek an invariant mechanism behind a finite construction and then ask which parts survive at infinity."},{"title":"Unimodularity is a conservation law","text":"A probability law on rooted, connected, locally finite graphs is unimodular if it satisfies the mass-transport identity for every nonnegative measurable isomorphism-invariant function f of a graph with an ordered pair of vertices. The two sides are allowed to be infinite.\n\nFor a finite graph with a uniform root, the identity follows simply by summing f over all ordered vertex pairs and interchanging the sums. Local weak limits of uniformly rooted finite graphs retain this identity. Aldous and Lyons developed unimodular random networks as a common setting for random walks, percolation, amenability and spanning forests. [2]\n\nThe root is not an arbitrarily favored vertex. The identity expresses a precise balance between what the sampled root sends and what it receives.","math":"E[Σᵥ f(G,o,v)] = E[Σᵥ f(G,v,o)]","tex":"\\mathbb E\\sum_v f(G,o,v)=\\mathbb E\\sum_v f(G,v,o)"},{"title":"A mass-transport proof pattern","text":"Suppose an equivariant marking rule selected exactly one vertex in each infinite connected graph. Have every vertex send one unit to the selected vertex. Outgoing mass at the root is always one. Incoming mass is either zero or infinite, so its expectation is either zero or infinite, never one. This contradicts unimodularity.\n\nThe argument requires an equivariant measurable selection whose marked law remains unimodular; an arbitrary choice using an external labeling does not satisfy the premise. With that qualification, the calculation explains how a global impossibility can follow from a simple local rule for sending mass. [1,2]"},{"title":"Trees locate a positive approximation boundary","text":"A rooted random graph law is called sofic here when it is a local weak limit of uniformly rooted finite graphs. Unimodularity is necessary; an approximation theorem must establish more than the mass-transport identity.\n\nBenjamini, Lyons and Schramm gave a characterization of bounded-degree unimodular random trees as root components of invariant percolations on regular trees. They used it to give another proof of the soficity of unimodular random trees, crediting the earlier result to Gábor Elek. [3]\n\nThis is a valuable control case. Complex branching alone does not obstruct finite approximation. A proposed obstruction for more general graphs must detect something the tree setting lacks, rather than merely restating mass transport."},{"title":"Spanning forests and determinants","text":"An infinite graph has two natural limits of finite uniform spanning trees, depending on free or wired boundary conditions. The resulting free and wired uniform spanning forests connect random walks, resistance and harmonic functions. [1]\n\nLyons also developed discrete determinantal probability measures. For a positive contraction Q on ℓ²(W), a random subset S of the countable set W can satisfy Pr(A ⊆ S) = det(Q_A) for every finite A. These measures have strong negative-dependence properties and connect Hilbert-space operators to matroids and spanning forests. [4]\n\nWith Andreas Thom, Lyons proved invariant coupling results for such measures on sofic groups and analogous random rooted graphs. Finite approximation is therefore useful not only for drawing a graph but for transferring structured probability laws. [5]","math":"Pr(A ⊆ S) = det(Q_A)"},{"title":"What should survive a finite approximation?","text":"The common question is which information is retained when large finite networks are replaced by local probability laws. The unmarked rooted law of a graphing records component geometry, but not necessarily every global measurable coloring or coupling carried by that graphing.\n\nA useful distinction is between consequences of unimodularity and stronger hypotheses used by a particular finite-approximation theorem. Entropy, invariant couplings and local–global statistics are possible directions to investigate; none is asserted here to be a complete characterization of soficity."}],"sources":[{"label":"[1] Lyons–Peres, Probability on Trees and Networks","url":"https://rdlyons.pages.iu.edu/prbtree/","type":"primary source"},{"label":"[2] Aldous–Lyons, Processes on Unimodular Random Networks","url":"https://arxiv.org/abs/math/0603062","type":"primary source"},{"label":"[3] Benjamini–Lyons–Schramm, Unimodular Random Trees","url":"https://arxiv.org/abs/1207.1752","type":"primary source"},{"label":"[4] Lyons, Determinantal probability measures","url":"https://arxiv.org/abs/math/0204325","type":"primary source"},{"label":"[5] Lyons–Thom, Invariant Coupling of Determinantal Measures on Sofic Groups","url":"https://arxiv.org/abs/1402.0969","type":"primary source"}],"questions":["Should the next profile follow David Aldous and the objective method for local weak convergence?","Would several short mass-transport proofs about ends and invariant forests be more useful than a broad biography?","Should the next topic compare positive finite-approximation theorems with nonsofic constructions?"]},{"id":"gromov","extended":true,"approximateBirth":false,"readMinutes":6,"ref":"","aliases":["Mikhael Gromov"],"name":"Mikhail Gromov","born":1943,"field":"geometry","title":"When algebra becomes geometry","bio":"Mikhail Gromov reshaped geometry by studying structures after exact coordinates and small-scale details have been forgotten. His work on growth, hyperbolicity, metric limits and pseudoholomorphic curves connected geometry with groups, dynamics and probability.","formula":"polynomial growth ⇔ virtually nilpotent; coarse geometry retains algebraic structure","impact":"Changing the notion of equivalence can expose invariants invisible in an exact coordinate description. Finite approximation, quasi-isometry and metric convergence illustrate different versions of that strategy.","sections":[{"title":"A group can be read as a graph","text":"A finitely generated group Γ with a finite symmetric generating set S has a Cayley graph. Word length is graph distance from the identity, and the ball B(n) consists of elements representable by words of length at most n.\n\nGromov proved that polynomial growth forces Γ to contain a nilpotent subgroup of finite index. Combined with the earlier converse, this gives the equivalence between polynomial growth and virtual nilpotence. The growth type does not depend on the finite generating set. [1]\n\nThis is a striking rigidity statement: a bound on the number of elements at distance at most n determines substantial algebraic structure. It is not merely an estimate on a particular drawing of the Cayley graph.","math":"|B(n)| ≤ Cnᵈ for all n ⇒ Γ is virtually nilpotent"},{"title":"Curvature without a manifold","text":"A geodesic metric space is δ-hyperbolic when each side of a geodesic triangle lies within distance δ of the union of the other two sides. Trees are the limiting case with δ = 0.\n\nGromov's hyperbolic-group framework applies this condition to Cayley graphs and makes it independent of the chosen finite generating set. Quasi-isometries preserve the relevant large-scale geometry: distances may change by multiplicative and additive constants, and every target point must lie a bounded distance from the image. [2]\n\nThe coarse viewpoint connects boundary geometry with algebra and algorithms, including solutions of the word problem for hyperbolic groups. It deliberately discards exact distances while retaining the structure that controls long paths.","math":"A⁻¹d_X(x,y)−B ≤ d_Y(f(x),f(y)) ≤ A d_X(x,y)+B"},{"title":"Finite models need not be finite Cayley graphs","text":"A finite quotient of Γ supplies an exact action on a finite set. Sofic approximation allows much weaker finite permutation models: multiplication relations hold at almost every point, and different group elements act differently at almost every point.\n\nFor a finitely generated group, this can be expressed by finite generator-labeled graphs in which almost every radius-r neighborhood agrees with the Cayley graph, for every prescribed r and error tolerance. The approximating graph need not itself be a Cayley graph. Gromov introduced the underlying direction; Weiss's paper supplied the terminology and its dynamical development. [3]\n\nThus exact finite quotients, finite local models and approximate models should not be identified. Requiring all relations everywhere is stronger than allowing a vanishing exceptional set.","math":"Prᵥ[B_r(X,v) ≅ B_r(Cay(Γ,S),e)] ≥ 1−ε"},{"title":"Metric limits without shared vertices","text":"Gromov–Hausdorff distance compares compact metric spaces by embedding them isometrically in a common space and minimizing their Hausdorff distance there. No correspondence of vertices or coordinates is prescribed beforehand. [2]\n\nThis differs from Benjamini–Schramm convergence. The former controls global metric shape, often after rescaling. The latter records the distribution of fixed-radius neighborhoods around a random vertex. A graph sequence can behave differently under the two notions.\n\nThe useful habit is to state exactly what a limit retains before trying to transfer a theorem through it. “The graphs converge” is not a sufficient specification."},{"title":"Pseudoholomorphic curves reveal another rigidity","text":"Gromov introduced pseudoholomorphic curves as a central tool in symplectic geometry. A map u from a Riemann surface to an almost-complex manifold satisfies du ∘ j = J ∘ du, a nonlinear analogue of the Cauchy–Riemann equation. [4]\n\nOne application is non-squeezing: a standard symplectic ball B²ⁿ(R) cannot be symplectically embedded into the cylinder B²(r) × R²ⁿ⁻² unless R ≤ r. Volume alone cannot see this obstruction because the cylinder has infinite volume.\n\nThe theory made curves into probes of symplectic rigidity and became part of the foundation for later symplectic topology. This is a different setting from group theory but shares the strategy of detecting structure through the right invariant objects.","math":"du ∘ j = J ∘ du; B²ⁿ(R) ↪ B²(r) × R²ⁿ⁻² symplectically ⇒ R ≤ r"},{"title":"The principle to retain","text":"The common thread is not that every weakening loses information harmlessly. It is that a carefully chosen weaker equivalence exposes robust structure: quasi-isometry for groups, metric limits for geometric spaces, approximate actions for finite models, and curve invariants for symplectic manifolds.\n\nQuestions about local graph neighborhoods and global reconstruction fit this perspective, but need their own hypotheses. A local approximation theorem is not automatically an isomorphism or rigidity theorem."}],"sources":[{"label":"[1] Gromov (1981), Groups of polynomial growth and expanding maps","url":"https://numdam.org/articles/10.1007/BF02698687/","type":"primary source"},{"label":"[2] Gromov: papers and metric geometry","url":"https://www.ihes.fr/~gromov/","type":"primary source"},{"label":"[3] Weiss (2000), Sofic groups and dynamical systems","url":"https://cris.huji.ac.il/en/publications/sofic-groups-and-dynamical-systems/","type":"primary source"},{"label":"[4] Gromov (1985), Pseudo-holomorphic curves in symplectic manifolds","url":"https://www.ihes.fr/~gromov/symplecticmanifolds/160/","type":"primary source"}],"questions":["Should the next profile stay with finite approximations of infinite groups and graphs?","Would probability and local convergence, or group actions and geometry, be the more useful next viewpoint?","Should the next entry focus on one theorem with a detailed proof sketch rather than a broad biography?"]},{"id":"aldous","extended":true,"approximateBirth":false,"readMinutes":6,"ref":"","aliases":[],"name":"David Aldous","born":1952,"field":"analysis","title":"Turning finite graphs into infinite probability objects","bio":"David Aldous is a probabilist known for exchangeability, Markov chains, continuum random trees and local weak limits. His objective method uses an infinite random limit to study asymptotic questions about large finite combinatorial structures. [1,2]","formula":"(Gₙ,oₙ) → (G,o) locally; E[Aₙ] → ζ(2) = π²/6","impact":"The objective method can turn a globally coupled finite optimization problem into a recursive problem on an infinite object, provided the transfer back to finite systems is rigorously justified.","sections":[{"title":"What a typical vertex sees","text":"Choose a vertex oₙ uniformly from a finite graph Gₙ. Local weak convergence means that for every fixed radius r, the distribution of the rooted ball B_r(Gₙ,oₙ) converges. In bounded-degree unmarked graphs these distributions can be expressed using finite rooted isomorphism types. Weighted networks require the corresponding marked topology.\n\nThe limiting object is a law on rooted graphs, not necessarily one deterministic graph. If component sizes grow appropriately the limit can be infinite; growing total vertex count alone does not ensure this. A disjoint union of triangles can have arbitrarily many vertices while its rooted local limit is still a triangle.\n\nAldous's objective method asks which finite questions become easier on this limit, then proves a transfer theorem. Local convergence by itself is not such a transfer theorem. [2]","math":"Pr[B_r(Gₙ,oₙ) ≅ H] → Pr[B_r(G,o) ≅ H]"},{"title":"The random assignment problem","text":"Let c(i,j) be independent exponential random variables of mean one, for 1 ≤ i,j ≤ n. Define Aₙ as the minimum of Σᵢ c(i,π(i)) over permutations π. Each cheap choice competes with all choices in the same row and column, so the objective is globally coupled.\n\nAldous proved that E[Aₙ] tends to ζ(2) = π²/6. His construction solves a matching problem on the Poisson weighted infinite tree, an infinite limit that exposes a recursive structure absent from the original matrix. The result also describes edge costs in optimal assignments and an essential uniqueness property for near-optimal matchings. [3]\n\nThe lesson is not that every global optimization parameter is local. It is that a particular infinite model can organize a proof of its asymptotics, with substantial work needed to justify convergence of optimal solutions and costs.","math":"Aₙ = min_π Σᵢ c(i,π(i)); lim E[Aₙ] = π²/6"},{"title":"The continuum random tree","text":"For a critical Galton–Watson tree conditioned to have n vertices, with finite nonzero offspring variance, distances typically scale as √n. After rescaling, the trees converge to a Brownian continuum random tree, up to the variance-dependent scale factor. [4]\n\nA Brownian excursion e on [0,1] constructs the limit through the pseudometric d(s,t)=e(s)+e(t)−2 min e(u), where the minimum is over u between s and t. Identify pairs at distance zero to obtain a genuine real tree.\n\nThis is a scaling limit, not the same object as a fixed-radius local weak limit. The continuum tree retains rescaled metric shape and a mass measure. The distinction gives a useful example of two different limit procedures applied to discrete trees.","math":"d(s,t) = e(s)+e(t)−2 min{e(u): min(s,t) ≤ u ≤ max(s,t)}"},{"title":"Mass transport and finite approximability","text":"Aldous and Lyons formulated unimodular random networks using an invariant mass-transport identity. For every nonnegative invariant transport f, expected total mass sent from the root equals expected total mass received there. Finite uniformly rooted graphs satisfy the identity by double counting, and their local weak limits do too. [5]\n\nThe identity is necessary for finite approximation, but it does not by itself construct an approximating sequence. Probability laws of unmarked rooted components also forget some information carried by a particular graphing, such as the organization of measurable colorings.\n\nThis gives three distinct tasks: define the local limit, identify its invariant consistency laws, and establish an actual finite realization theorem. They should not be collapsed into one claim.","math":"E[Σᵥ f(G,o,v)] = E[Σᵥ f(G,v,o)]"},{"title":"What the objective method does not promise","text":"Two locally convergent sequences can have the same unmarked rooted limit while differing in important global behavior. For instance, putting two large pieces next to each other with very few connecting edges creates a global bottleneck that typical fixed-radius observations may miss.\n\nAccordingly, possible tools such as spectral control, decomposition, couplings or local–global information need to be matched to the parameter under investigation. The research suggestion is to identify the exact additional hypothesis that makes a chosen global quantity transfer, not to assume all finite approximability is captured by one extra number."}],"sources":[{"label":"[1] Berkeley: David Aldous","url":"https://statistics.berkeley.edu/people/david-aldous","type":"primary source"},{"label":"[2] Aldous–Steele, The objective method","url":"https://doi.org/10.1007/978-3-662-09444-0_1","type":"primary source"},{"label":"[3] Aldous, The zeta(2) limit in the random assignment problem","url":"https://arxiv.org/abs/math/0010063","type":"primary source"},{"label":"[4] Aldous: The Continuum Random Tree","url":"https://www.stat.berkeley.edu/~aldous/Research/research-crt.html","type":"primary source"},{"label":"[5] Aldous–Lyons, Processes on Unimodular Random Networks","url":"https://arxiv.org/abs/math/0603062","type":"primary source"}],"questions":["Should the next profile focus on local–global convergence and graphings rather than ordinary local weak convergence?","Would a concrete mass-transport proof be the best way to clarify what unimodularity does and does not enforce?","Should the next mathematician come from probability and unimodularity or the group-theoretic side of soficity?"]},{"id":"schramm","extended":true,"approximateBirth":false,"readMinutes":6,"ref":"","aliases":[],"name":"Oded Schramm","born":1961,"field":"analysis","title":"From local graph limits to stochastic geometry","bio":"Oded Schramm (1961–2008) connected probability, conformal geometry and combinatorics. His work on Schramm–Loewner evolution and on sparse graph limits gave different ways to understand large discrete structures through limiting objects. [1–5]","formula":"∂ₜgₜ(z) = 2 / (gₜ(z) − √κ Bₜ)","tex":"\\partial_t g_t(z)=\\frac{2}{g_t(z)-\\sqrt{\\kappa}B_t}","impact":"A common theme is to identify which structure survives a limit, then use that structure to obtain information invisible in any individual finite neighborhood.","sections":[{"title":"A random curve encoded by Brownian motion","text":"The chordal Loewner equation describes a growing planar hull by a real-valued driving function ξₜ. Schramm's insight was that conformal invariance, an appropriate domain Markov property and symmetry put strong restrictions on the driving process. In the standard normalization the resulting family has ξₜ = √κ Bₜ, with B standard Brownian motion.\n\nThis does not mean every random planar curve is SLE, or that conformal invariance alone proves convergence of a discrete model. Schramm's initial work proposed and characterized scaling limits in the loop-erased random walk and uniform spanning tree setting. Lawler, Schramm and Werner subsequently established convergence to SLE₂ for planar loop-erased random walk, and to SLE₈ for the uniform-spanning-tree Peano curve under appropriate boundary conditions. [1,2]\n\nThe change of language is the breakthrough: a fractal geometric object can be analyzed using a one-dimensional stochastic process and complex analysis."},{"title":"What a typical vertex sees","text":"For a finite graph Gₙ, choose a root oₙ uniformly from its vertices. With a common degree bound, local weak convergence means that for every fixed radius r and finite rooted ball H, the probability that Bᵣ(Gₙ,oₙ) is isomorphic to H converges.\n\nThis records rooted neighborhood distributions, not a vertex-by-vertex identification of successive graphs. The limit may be supported on finite components; an infinite limit needs additional conditions. Benjamini–Schramm convergence became a central language for sparse graph limits. [3]\n\nThe distinction from a metric scaling limit is important. SLE and continuum trees involve rescaling geometry; local weak convergence keeps the graph-distance scale fixed and samples a typical neighborhood.","math":"Pr[Bᵣ(Gₙ,oₙ) ≅ H] → Pr[Bᵣ(G,o) ≅ H]"},{"title":"A global conclusion from planar finite approximants","text":"Benjamini and Schramm proved that a distributional limit of uniformly rooted finite connected planar graphs, with uniformly bounded degrees, is almost surely recurrent for simple random walk. [3]\n\nRecurrence is an infinite-time statement: a walk returns to its starting point almost surely. No fixed-radius inspection decides it in general. The theorem obtains it from the combination of local convergence, planarity and the way the finite root is sampled.\n\nCircle packing is an essential geometric ingredient. The conclusion is not that every bounded-degree infinite planar graph is recurrent: regular trees supply counterexamples. Being a limit of the specified finite planar graphs imposes additional restrictions."},{"title":"Hyperfiniteness: cutting into uniformly small pieces","text":"Following Elek's terminology, a bounded-degree finite graph family is hyperfinite if for every ε > 0 there is a finite k(ε) such that every graph in the family can be split into components of at most k(ε) vertices by removing at most ε|V| edges.\n\nSchramm extended this notion to the space of random rooted limits and proved a transfer theorem: if a sequence of finite bounded-degree graphs converges to a hyperfinite limit, then the sequence is a hyperfinite family. [4]\n\nThe uniform quantifiers matter. Merely saying that each individual finite graph can be partitioned into finite pieces is vacuous. A single component-size bound must work across the entire family, once ε is fixed. The random-rooted definition also requires a compatible invariant probabilistic deletion rule, not arbitrary root-dependent choices.","math":"∀ε > 0 ∃k < ∞ ∀G in the family: deleting ≤ ε|V(G)| edges leaves components of size ≤ k."},{"title":"From graph limits to algorithms","text":"With Itai Benjamini and Asaf Shapira, Schramm proved that every minor-closed graph property is testable with a number of queries independent of the graph's size in the bounded-degree model. The query bound may depend on the degree bound and the distance parameter ε. [5]\n\nA property tester distinguishes graphs satisfying the property from graphs requiring many edge changes to satisfy it, with bounded error. It does not decide exact membership on all graphs after inspecting a constant number of vertices. That promise gap is what makes local sampling useful.\n\nThese results show a recurring pattern: local statistics alone can forget important global features, but local statistics together with the right structural restrictions can yield both infinite probabilistic conclusions and finite algorithmic guarantees."}],"sources":[{"label":"[1] Schramm, Scaling limits of loop-erased random walks and uniform spanning trees","url":"https://arxiv.org/abs/math/9904022","type":"primary source"},{"label":"[2] Lawler–Schramm–Werner, Conformal invariance of planar loop-erased random walks and uniform spanning trees","url":"https://arxiv.org/abs/math/0112234","type":"primary source"},{"label":"[3] Benjamini–Schramm, Recurrence of distributional limits of finite planar graphs","url":"https://arxiv.org/abs/math/0011019","type":"primary source"},{"label":"[4] Schramm, Hyperfinite graph limits","url":"https://arxiv.org/abs/0711.3808","type":"primary source"},{"label":"[5] Benjamini–Schramm–Shapira, Every minor-closed property of sparse graphs is testable","url":"https://arxiv.org/abs/0801.2797","type":"primary source"}],"questions":["Should the next profile stay with local-to-global graph limits, especially hyperfiniteness and graphings?","Would a proof sketch of the hyperfinite-limit theorem be more useful than another broad biography?","Should the next person come from the sofic-group side, Borel-graph side, or sparse property-testing side?"]},{"id":"kechris","extended":true,"approximateBirth":false,"readMinutes":6,"ref":"","aliases":["Alexander Kechris"],"name":"Alexander S. Kechris","born":1946,"field":"logic","title":"When definability changes the combinatorics","bio":"Alexander S. Kechris helped develop descriptive set theory as a framework for classification, group actions and infinite combinatorics. His work with Solecki and Todorčević made Borel graph coloring a central example of how requiring definable solutions changes a combinatorial problem. [1,2]","formula":"ordinary existence ≠ Borel existence","impact":"Definability is an additional mathematical constraint, not an automatic by-product of an existence theorem. This distinction is essential in graphings and measurable dynamics.","sections":[{"title":"A coloring must be a definable function","text":"Let X be a standard Borel space and E ⊆ X×X an irreflexive symmetric Borel relation. An ordinary proper coloring is any function assigning different colors to adjacent points. A Borel coloring must additionally be Borel measurable.\n\nEvery acyclic graph is combinatorially 2-colorable. Yet acyclic Borel graphs can fail to have even a countable Borel coloring. A choice of a bipartition in each component may exist abstractly without being selectable in a Borel fashion across all components.\n\nKechris, Solecki and Todorčević's Borel Chromatic Numbers systematically develops this difference. Their bounded-degree theorem gives a contrasting positive result: a Borel graph of finite maximum degree d admits a Borel proper coloring with d+1 colors. [1]","math":"c is proper ⇔ xEy implies c(x) ≠ c(y)."},{"title":"The G₀ dichotomy","text":"The same paper identifies a fixed analytic graph G₀ on Cantor space with a universal obstruction property. For an analytic graph on a Polish space, either it has a countable Borel coloring, or G₀ admits a continuous graph homomorphism into it. The alternatives are mutually exclusive. [1]\n\nThis is not a literal forbidden-subgraph characterization. A continuous homomorphism need not be injective and need not preserve nonedges. Its job is to transfer adjacency and the obstruction to countable Borel colorability.\n\nThe methodological change is important: a definable reduction, rather than literal containment, can be the right way to compare the complexity of infinite structures.","math":"countable Borel coloring  OR  a continuous homomorphism G₀ → G"},{"title":"Orbit equivalence and graphings","text":"A countable group Γ acting by Borel automorphisms on X defines an orbit equivalence relation: x and y are related when y = γx for some γ in Γ. A generating set gives a graph connecting x to its generator translates; connected components are the orbits.\n\nA probability-preserving action can also supply a measured graphing. The measure-preserving hypothesis is essential: an arbitrary Borel action on a standard Borel space is not automatically a probability graphing.\n\nKechris and Benjamin Miller's Topics in Orbit Equivalence develops hyperfiniteness, amenability and cost in this setting, including the relation between Borel statements and measure-theoretic statements. [2]","math":"x EΓ y ⇔ ∃γ ∈ Γ such that γx = y"},{"title":"What hyperfinite means here","text":"A countable Borel equivalence relation E is hyperfinite when it is the increasing union of finite Borel equivalence relations Eₙ. Finite here means that every Eₙ-class is finite; there need not be one bound on their sizes. [2]\n\nThis resembles cutting finite graphs into small components, but the definitions live in different categories. Borel hyperfiniteness is a statement on the whole space. Measured hyperfiniteness may disregard a null exceptional set. Finite-graph hyperfiniteness asks for uniform small-component bounds after deleting a small fraction of edges.\n\nConnections between these notions require the relevant hypotheses. They should not be identified merely because all three involve finite pieces.","math":"E₁ ⊆ E₂ ⊆ ⋯ and E = ⋃ₙ Eₙ"},{"title":"The two separate local-to-global problems","text":"For infinite graphs, one question is whether local constraints permit a global matching, coloring or decomposition. Another is whether that global solution can be selected with the required regularity.\n\nBorel, measurable for a specified measure, and Baire measurable for a specified topology are different requirements. A Borel solution meets the corresponding measurability requirements, but abstract existence alone supplies none of them. Working outside a null or meager exceptional set changes the assertion again.\n\nKechris's broader framework is to code objects in standard Borel or Polish spaces, formulate the regularity requirement precisely, and compare obstructions through definable maps. This makes it possible to distinguish combinatorial impossibility from the failure of definable choice. [1,2]"}],"sources":[{"label":"[1] Kechris–Solecki–Todorčević, Borel Chromatic Numbers (1999)","url":"https://authors.library.caltech.edu/records/mbe97-y1b24","type":"primary source"},{"label":"[2] Kechris–Miller, Topics in Orbit Equivalence (2004)","url":"https://link.springer.com/book/10.1007/b99421","type":"primary source"}],"questions":["Should the next profile continue into Borel graph theory or return to graph limits?","Would a worked proof of one Borel-combinatorics theorem be more useful than a broad biography?","Should the next focus be Borel versus measurable and Baire-measurable phenomena, or finite approximability and soficity?"]},{"id":"weiss","extended":true,"approximateBirth":false,"readMinutes":6,"ref":"","aliases":[],"name":"Benjamin Weiss","born":1941,"field":"analysis","title":"Finite models for infinite dynamics","bio":"Benjamin Weiss is a mathematician whose work connects ergodic theory, symbolic dynamics and group actions. Finite descriptions and approximate finite models recur across his work, from sofic symbolic systems to amenable actions and sofic groups. [1–4]","formula":"d_Ham(σ_gσ_h, σ_gh) < ε","tex":"d_{\\mathrm{Ham}}(\\sigma_g\\sigma_h,\\sigma_{gh})<\\varepsilon","impact":"Finite quotients, Følner sets and sofic approximations provide different mechanisms for comparing finite and infinite structures. Weiss helped develop the distinctions and their dynamical consequences.","sections":[{"title":"Sofic symbolic systems","text":"A shift of finite type is a space of sequences over a finite alphabet specified by finitely many forbidden local patterns. A sofic shift is a factor of a shift of finite type; equivalently in the one-dimensional setting, it has a presentation by a finite labeled graph.\n\nWeiss's 1973 paper Subshifts of finite type and sofic systems studies this broader class. [1] The distinction is between a finite list of local constraints and a finite-state presentation whose hidden states may be forgotten. An infinite collection of sequences can still have a finite description."},{"title":"Approximating a group by permutations","text":"Gromov introduced the relevant group-approximation idea, and Weiss's 2000 paper supplied the term sofic and developed its link with dynamics. [2]\n\nFor permutations α and β of a finite set V, normalized Hamming distance is the fraction of points on which they disagree. A sofic approximation assigns finite permutations σ_g to group elements so that, on each prescribed finite part of the group, multiplication is almost respected and distinct elements act differently on almost every point. One can require σ_e to be the identity.\n\nThe finite set and approximation can change as the tested part grows and the allowed error decreases. This is not an exact representation of the whole group into one finite symmetric group.","math":"d_Ham(α,β) = |{v ∈ V : α(v) ≠ β(v)}| / |V|;  d_Ham(σ_g,σ_h) > 1−ε for distinct tested g,h."},{"title":"Two reasons finite approximation can work","text":"Residual finiteness supplies genuine finite quotients separating any prescribed finite set of group elements. Amenability supplies finite Følner sets with a negligible translation boundary.\n\nBoth mechanisms produce sofic approximations, but neither is the definition of soficity. For finitely generated groups, the graph picture is a finite generator-labeled graph whose fixed-radius neighborhood is correct around almost every vertex. The approximating graph need not itself be a finite Cayley graph. [2]\n\nThe useful separation is exact finite quotient versus approximately correct finite model. Conflating them would impose an unnecessary symmetry requirement on the approximants.","math":"|gFₙ △ Fₙ| / |Fₙ| → 0 for every fixed g."},{"title":"Ornstein–Weiss: finite towers for amenable actions","text":"With Donald Ornstein, Weiss extended fundamental approximation methods from one measure-preserving transformation, or a ℤ-action, to actions of countable amenable groups.\n\nTheir Rokhlin-lemma work gives a way to approximate free probability-preserving amenable actions by large finite tower structures, with small errors. [3] The more general theory uses suitable families of shapes and approximate tilings; it should not be reduced to the claim that every action has an exact tiling by one arbitrary Følner set.\n\nThese methods made entropy and isomorphism theory possible in a substantially broader dynamical setting. Finite pieces are useful because amenability allows boundary effects to be controlled."},{"title":"Mean topological dimension","text":"With Elon Lindenstrauss, Weiss developed mean topological dimension, building on an invariant introduced by Gromov. It measures effective dimension per iterate rather than the dimension of the state space alone. [4]\n\nFor a compact metric system with transformation T, compare points using dₙ(x,y) = max₀≤j<n d(Tʲx,Tʲy). Roughly, mean dimension normalizes by n the topological dimension needed to describe orbit segments at a fixed resolution, then lets the resolution improve.\n\nThis is not simply entropy with a different name. It can distinguish behavior when ordinary topological dimension and entropy are both infinite.","math":"dₙ(x,y) = max {d(Tʲx,Tʲy) : 0 ≤ j < n}."},{"title":"Finite approximation now has a boundary","text":"The existence of nonsofic examples has made it especially important to separate sufficient approximation mechanisms from a general characterization. A 2026 preprint by Gábor Kun and Andreas Thom constructs nonsofic wreath products from suitable residually finite groups and builds on earlier nonsofic constructions. [5]\n\nThat is a specific theorem about particular constructions, not a claim that all property-(T) groups or all nonamenable groups are nonsofic. This profile records the preprint as a source, not as an independently audited proof.\n\nWeiss's lasting conceptual contribution is to look for a useful intermediate notion between finite and infinite: weak enough to capture many examples, but strong enough to retain algebraic and dynamical consequences."}],"sources":[{"label":"[1] Weiss, Subshifts of finite type and sofic systems (1973)","url":"https://cris.huji.ac.il/en/publications/subshifts-of-finite-type-and-sofic-systems/","type":"primary source"},{"label":"[2] Weiss, Sofic groups and dynamical systems (2000)","url":"https://cris.huji.ac.il/en/publications/sofic-groups-and-dynamical-systems/","type":"primary source"},{"label":"[3] Ornstein–Weiss, Ergodic theory of amenable group actions I: the Rohlin lemma","url":"https://doi.org/10.1090/S0273-0979-1980-14702-3","type":"primary source"},{"label":"[4] Lindenstrauss–Weiss, Mean topological dimension (2000)","url":"https://cris.huji.ac.il/en/publications/mean-topological-dimension/","type":"primary source"},{"label":"[5] Kun–Thom, Nonsofic wreath products of residually finite groups (2026 preprint)","url":"https://arxiv.org/abs/2608.06222","type":"primary source"}],"questions":["Should the next profile explain mechanisms behind nonsofic constructions, including the role of property (T) and expansion?","Would amenability and Følner approximations, where finite models work particularly well, be more useful next?","Should the next entry connect sofic groups to graphings, invariant random graphs, and co-soficity?"]},{"id":"ornstein","extended":true,"approximateBirth":false,"readMinutes":6,"ref":"","aliases":["Donald S. Ornstein"],"name":"Donald Ornstein","born":1934,"field":"analysis","title":"When entropy classifies an infinite random system","bio":"Donald Ornstein transformed ergodic theory by proving that equal entropy is sufficient for isomorphism of Bernoulli shifts. His later work with Benjamin Weiss extended classification and finite-approximation methods to amenable-group actions. [1–3]","formula":"Bernoulli ℤ-shifts: equal entropy ⇔ measure-preserving isomorphism","impact":"The striking lesson is not that one number classifies all dynamics. It is that a complete invariant can emerge after the right structural class and the right notion of equivalence have been identified.","sections":[{"title":"What a Bernoulli shift is","text":"Choose a finite alphabet A with probability vector p. A point of A^ℤ is a bi-infinite sequence, sampled with independent p-distributed coordinates. The transformation T shifts each coordinate one place: (Tx)ₙ = xₙ₊₁.\n\nThe entropy of this Bernoulli system is H(p) = −Σₐ pₐ log₂ pₐ. Entropy was already known to be invariant under measure-preserving isomorphism. Ornstein's theorem proves the difficult converse within the Bernoulli class: equal base entropy implies isomorphism. [1]\n\nThus different alphabets and probability vectors can describe equivalent shift systems. The isomorphism is measurable, defined up to null sets, and intertwines the shifts. It is not asserted to be a topological conjugacy or a one-symbol recoding.","math":"h(T) = −Σₐ pₐ log₂ pₐ;  Φ ∘ T = S ∘ Φ almost everywhere."},{"title":"Why the converse was difficult","text":"Entropy compresses a process into one asymptotic information rate. At first it provides only a necessary test: unequal values rule out isomorphism. A complete invariant requires a construction or existence argument in the opposite direction.\n\nOrnstein's machinery compares long finite blocks and increasingly accurate joinings and recodings. The important step is not simply observing that typical blocks have comparable counts. It is making successive approximations consistent enough to obtain an invertible measurable map on the infinite processes.\n\nThis is why the theorem is stronger than a counting calculation. It upgrades controlled finite approximations to an exact equivalence modulo null sets. [1,2]"},{"title":"The d-bar viewpoint","text":"For stationary processes on a common finite alphabet, let λ range over stationary couplings with the required marginal laws. Define d-bar as the infimum of the probability of a mismatch at coordinate zero.\n\nThis compares whole processes through compatible joint distributions, not independent one-coordinate comparisons. Stationarity makes the mismatch probability representative of the mismatch rate.\n\nThe d-bar framework is one of the tools of Ornstein theory. Equal entropy does not imply d-bar distance zero between arbitrary original codings. Recoding and the special structural properties of Bernoulli processes are essential. [2]","math":"d̄(μ,ν) = inf {λ(X₀ ≠ Y₀) : λ is a stationary coupling of μ and ν}."},{"title":"The structural hypothesis is indispensable","text":"Entropy does not classify arbitrary measure-preserving systems. A simple warning comes from finite probability spaces: the identity map and a nontrivial cyclic permutation both have zero entropy but are not isomorphic as transformations.\n\nThe Bernoulli theorem is therefore not an instruction to search for a single number and ignore structure. Its force comes from identifying a class where enough randomness is present to support a very strong classification argument.\n\nA necessary invariant, a complete invariant on one class, and a universal classification are three different achievements. Ornstein established the middle one in a major and initially unexpected setting."},{"title":"From ℤ to amenable groups","text":"For a countable amenable group, Følner sets have small relative boundary under each fixed translation. Ornstein and Weiss used finite towers and quasi-tiling ideas to extend approximation, entropy and isomorphism theory from ℤ-actions to amenable-group actions. [3]\n\nAn informal picture is an infinite action approximated by many large finite pieces, with boundary errors controlled in measure. The precise action, freeness and measure assumptions must be retained; this is not a purely combinatorial tiling assertion.\n\nThe result connects classification with the same finite-versus-infinite theme that occurs in graph decompositions and local limits, while remaining a theorem in measured dynamics."},{"title":"A later continuation beyond amenability","text":"Seward proved that Bernoulli shifts over any countably infinite group with equal base Shannon entropy are isomorphic, extending Ornstein's sufficiency theorem beyond the amenable case. The paper builds on work of Lewis Bowen and also treats finitary isomorphisms for finite bases. [4]\n\nThe statement here is equal entropy implies isomorphism. It should not silently be strengthened to a complete two-way entropy classification for arbitrary countable groups.\n\nThe broader methodological lesson is to separate the invariant, the structural class and the equivalence relation. Only after these are specified can approximate finite information be asked to determine an infinite object."}],"sources":[{"label":"[1] Ornstein, Bernoulli shifts with the same entropy are isomorphic (1970)","url":"https://doi.org/10.1016/0001-8708(70)90029-0","type":"primary source"},{"label":"[2] Donald Ornstein, Ornstein Theory (author-written survey, 2008)","url":"https://www.scholarpedia.org/article/Ornstein_theorem","type":"primary source"},{"label":"[3] Ornstein–Weiss, Entropy and isomorphism theorems for actions of amenable groups (1987)","url":"https://doi.org/10.1007/BF02790325","type":"primary source"},{"label":"[4] Seward, Bernoulli shifts with bases of equal entropy are isomorphic (2022)","url":"https://www.aimsciences.org/article/doi/10.3934/jmd.2022011","type":"primary source"}],"questions":["Should the next profile follow this theory into sofic entropy and Lewis Bowen's work?","Should the next focus be property (T), expansion and rigidity rather than amenable approximation?","Would hyperfiniteness and measurable equivalence relations, with almost-finite decompositions, be the most useful continuation?"]}],"connections":[{"source":"euclid","target":"hilbert","label":"Axiomatization","description":"Hilbert revisited the axiomatic foundations of geometry."},{"source":"euclid","target":"descartes","label":"Coordinates","description":"A conceptual bridge from synthetic geometry to algebraic geometry in coordinates."},{"source":"archimedes","target":"newton","label":"Areas and limits","description":"A reading connection from exhaustion arguments to integral calculus."},{"source":"archimedes","target":"leibniz","label":"Areas and limits","description":"A conceptual predecessor-to-calculus route, not a claim of direct mentorship."},{"source":"diophantus","target":"fermat","label":"Diophantine equations","description":"Fermat's work grew in conversation with the arithmetic tradition represented by Arithmetica."},{"source":"aryabhata","target":"al-khwarizmi","label":"Algorithmic arithmetic","description":"A thematic comparison of computational mathematics across traditions."},{"source":"al-khwarizmi","target":"fibonacci","label":"Transmission of arithmetic","description":"A reading route through the spread of Hindu–Arabic calculation."},{"source":"khayyam","target":"descartes","label":"Equations and curves","description":"Compare conic solutions of cubics with coordinate geometry."},{"source":"fibonacci","target":"knuth","label":"Recurrences","description":"Fibonacci recurrences recur in combinatorial and algorithmic analysis."},{"source":"descartes","target":"newton","label":"Coordinates and change","description":"Coordinate geometry provides a language for calculus and mechanics."},{"source":"fermat","target":"pascal","label":"Probability","description":"Their correspondence developed reasoning about games of chance."},{"source":"fermat","target":"gauss","label":"Modular arithmetic","description":"Arithmetic congruences connect the two bodies of work."},{"source":"fermat","target":"wiles","label":"Fermat's Last Theorem","description":"Wiles's modularity work supplied the final route to the theorem."},{"source":"pascal","target":"laplace","label":"Probability","description":"A reading route from elementary chances to a systematic probabilistic theory."},{"source":"newton","target":"euler","label":"Calculus and mechanics","description":"Euler developed analysis and mechanics in the calculus tradition."},{"source":"leibniz","target":"euler","label":"Calculus notation","description":"The differential and integral calculus became central to Euler's analysis."},{"source":"leibniz","target":"boole","label":"Symbolic reasoning","description":"A conceptual route from symbolic calculation to algebraic logic."},{"source":"euler","target":"lagrange","label":"Analysis and mechanics","description":"Lagrange further developed analytical methods in mechanics and variation."},{"source":"euler","target":"fourier","label":"Series","description":"A mathematical bridge through expansions and analytic representations."},{"source":"euler","target":"tutte","label":"Graph structure","description":"The bridge problem opens a reading route into structural graph theory."},{"source":"lagrange","target":"dantzig","label":"Constrained optimization","description":"Compare nonlinear multiplier conditions with linear optimization."},{"source":"laplace","target":"markov","label":"Probability","description":"A thematic route from probabilistic analysis to dependent random processes."},{"source":"fourier","target":"odonnell","label":"Fourier analysis","description":"Boolean-cube Fourier analysis is a finite harmonic-analysis counterpart."},{"source":"gauss","target":"riemann","label":"Geometry","description":"Riemann's intrinsic geometry develops the study of curvature beyond surfaces."},{"source":"cauchy","target":"lebesgue","label":"Analysis and integration","description":"A route through increasingly flexible foundations of analysis."},{"source":"galois","target":"cayley","label":"Groups","description":"Permutation symmetries of equations connect to abstract group structure."},{"source":"galois","target":"noether","label":"Structural algebra","description":"A reading bridge from Galois groups to modern algebraic methods."},{"source":"boole","target":"shannon","label":"Switching circuits","description":"Shannon applied Boolean algebra to electrical switching circuits."},{"source":"lovelace","target":"hopper","label":"Programming","description":"A historical reading bridge between symbolic programs and automatic programming."},{"source":"cayley","target":"babai","label":"Permutation groups","description":"Groups acting on finite sets become algorithmic data structures."},{"source":"riemann","target":"poincare","label":"Manifolds and topology","description":"The geometry of spaces leads to global topological invariants."},{"source":"riemann","target":"atiyah","label":"Geometry and analysis","description":"Differential-geometric structure enters the index theorem."},{"source":"dedekind","target":"noether","label":"Ideals","description":"The structural study of ideals is central to modern algebra."},{"source":"cantor","target":"godel","label":"Infinity and foundations","description":"Set theory and diagonal methods connect these foundational programs."},{"source":"cantor","target":"turing","label":"Diagonalization","description":"Both arguments turn an alleged complete listing or decision procedure against itself. Cantor constructs an object differing along a diagonal; Turing makes effective computation itself part of the contradiction. The resemblance is useful, but the theorem about uncountable sets and the theorem about undecidable computation have different premises.","kind":"Thematic comparison","sources":[{"label":"Turing · On Computable Numbers (1936)","url":"https://www.cs.virginia.edu/~robins/Turing_Paper_1936.pdf","type":"primary / scholarly"}]},{"source":"frege","target":"russell","label":"Foundations","description":"Russell's paradox challenged unrestricted foundations including Frege's system."},{"source":"russell","target":"godel","label":"Formal arithmetic","description":"The Principia Mathematica tradition forms part of the setting for incompleteness."},{"source":"poincare","target":"thurston","label":"Topology","description":"A route from foundational topology to geometric three-manifold theory."},{"source":"markov","target":"polya","label":"Random walks","description":"Lattice walks are a central class of Markov chains."},{"source":"markov","target":"kolmogorov","label":"Stochastic processes","description":"Transition-based probability sits inside the modern axiomatic framework."},{"source":"peano","target":"godel","label":"Formal arithmetic","description":"An effective arithmetic theory is the setting in which incompleteness operates."},{"source":"hilbert","target":"godel","label":"Limits of formal proof","description":"Read this as a route between foundational questions, not a statement that every aspiration of Hilbert’s program failed. Keep the objects distinct: a theory is a set of formal claims, whereas a decision procedure must return an answer on every allowed input. Turing’s work provides the next step toward explicit limits on such procedures.","kind":"Thematic comparison","sources":[{"label":"Turing · On Computable Numbers (1936)","url":"https://www.cs.virginia.edu/~robins/Turing_Paper_1936.pdf","type":"primary / scholarly"}]},{"source":"hilbert","target":"noether","label":"Algebra","description":"Finite generation and structural algebra connect their mathematical work."},{"source":"hilbert","target":"lasserre","label":"Algebraic certificates","description":"A conceptual route from polynomial impossibility certificates to positivity certificates."},{"source":"lebesgue","target":"kolmogorov","label":"Measure and probability","description":"Measure theory provides the language for modern probability axioms."},{"source":"lebesgue","target":"banach","label":"Function spaces","description":"Integration and normed function spaces meet in functional analysis."},{"source":"hardy","target":"ramanujan","label":"Collaboration","description":"Their work includes the partition asymptotic and analytic number theory."},{"source":"brouwer","target":"nash","label":"Fixed points","description":"Nash's equilibrium existence proof uses a fixed-point theorem."},{"source":"brouwer","target":"papadimitriou","label":"Computational fixed points","description":"Finding a guaranteed fixed point is a central PPAD-type question."},{"source":"noether","target":"grothendieck","label":"Structural algebra","description":"Rings, ideals and modules supply part of the algebraic language of schemes."},{"source":"ramanujan","target":"tao","label":"Arithmetic patterns","description":"A thematic reading link across analytic and additive number theory."},{"source":"banach","target":"von-neumann","label":"Functional analysis","description":"Operators on infinite-dimensional spaces connect their work."},{"source":"wiener","target":"shannon","label":"Noise and communication","description":"A thematic bridge between stochastic analysis, control and information."},{"source":"post","target":"turing","label":"Computability","description":"Distinct formal models and undecidable problems illuminate the same boundary."},{"source":"tarski","target":"gaifman","label":"Model theory","description":"Semantic structure and logical expressiveness lead toward locality."},{"source":"kolmogorov","target":"levin","label":"Algorithmic information","description":"Levin developed fundamental parts of the algorithmic-information program."},{"source":"kolmogorov","target":"erdos","label":"Probability and combinatorics","description":"The probabilistic method uses probability as a tool for deterministic existence."},{"source":"church","target":"turing","label":"Models of computation","description":"Turing’s 1936 paper relates his machine model to Church’s effective calculability. Equivalent formal models support a common notion of computable function. The Church–Turing thesis additionally identifies this formal notion with informal effective procedure; that identification is not another equivalence theorem between two already formal definitions.","kind":"Documented mathematical equivalence","sources":[{"label":"Turing · On Computable Numbers (1936)","url":"https://www.cs.virginia.edu/~robins/Turing_Paper_1936.pdf","type":"primary / scholarly"}]},{"source":"church","target":"kleene","label":"Recursion theory","description":"Kleene developed the lambda-calculus and recursive-function tradition."},{"source":"church","target":"mccarthy","label":"Functional computation","description":"Lambda notation and function application influenced Lisp's language of computation."},{"source":"von-neumann","target":"nash","label":"Game theory","description":"Nash extends equilibrium existence beyond the zero-sum setting."},{"source":"von-neumann","target":"connes","label":"Operator algebras","description":"Noncommutative geometry develops an operator-algebraic tradition."},{"source":"von-neumann","target":"ulam","label":"Monte Carlo","description":"They collaborated in the development of Monte Carlo methods."},{"source":"hopper","target":"backus","label":"High-level languages","description":"A reading bridge from automatic programming to FORTRAN and compiler design."},{"source":"whitney","target":"edmonds","label":"Matroids","description":"Independence axioms become algorithmic and polyhedral tools."},{"source":"whitney","target":"tutte","label":"Graph structure","description":"Matroids and structural graph theory connect their work."},{"source":"kleene","target":"scott","label":"Logic and semantics","description":"Formal computation and fixed points lead into denotational semantics."},{"source":"ulam","target":"erdos","label":"Combinatorics","description":"A thematic link through combinatorial questions and probabilistic reasoning."},{"source":"turing","target":"cook","label":"Computation to complexity","description":"Cook–Levin measures the cost of computations in a formal machine model."},{"source":"turing","target":"shannon","label":"Information processing","description":"Turing asks which transformations a rule-following machine can carry out. Shannon asks how reliably messages can pass through a specified channel. A perfectly reliable channel cannot decide the halting problem, and a universal computer cannot remove a channel’s information limits. This is a comparison of questions, not a historical influence claim.","kind":"Thematic comparison","sources":[{"label":"Turing · On Computable Numbers (1936)","url":"https://www.cs.virginia.edu/~robins/Turing_Paper_1936.pdf","type":"primary / scholarly"},{"label":"Shannon · A Mathematical Theory of Communication (1948)","url":"https://people.math.harvard.edu/~ctm/home/text/others/shannon/entropy/entropy.pdf","type":"primary / scholarly"}]},{"source":"erdos","target":"lovasz","label":"L
