<style>/* Atlas of Ideas — Reader’s edition. System typefaces; no network assets. */
:root {
  --paper: #f6f4ed; --card: #fffdf8; --ink: #28372e; --muted: #626c61;
  --line: #d8dbce; --accent: #a44e31; --green: #2c493a; --soft: #eaece2;
  --serif: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
  --display: Georgia, 'Times New Roman', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
  --reader-size: 19px; --reader-leading: 1.85; --measure: 650px;
  --max: 1320px; --header-height: 80px;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 155px; }
body { margin: 0; color: var(--ink); background: var(--paper); font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
body[data-theme=dark] { --paper:#17231e; --card:#1e2d25; --ink:#f0ecdf; --muted:#b3bcae; --line:#3e5042; --accent:#e5ae8b; --green:#cfddc3; --soft:#2b3a2f; }
button,input,select,textarea { font:inherit; color:inherit; }
button { border:0; background:none; cursor:pointer; }
button:disabled { opacity:.5; cursor:default; }
a { color:inherit; text-decoration:none; }
button,a { touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
svg { display:block; flex-shrink:0; }
img { max-width:100%; }
input,select,textarea { max-width:100%; }
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,[role=button]:focus-visible {
  outline:3px solid var(--accent); outline-offset:4px; border-radius:3px;
}
h1[tabindex="-1"]:focus,.article-section[tabindex="-1"]:focus,main:focus { outline:none; }
::selection { background:#dac3a0; color:#1d3527; }
.wrap { width:min(var(--max),calc(100% - 112px)); margin-inline:auto; }
.sr-only { position:absolute; width:1px; height:1px; padding:0; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
.skip { position:fixed; left:16px; top:-80px; padding:12px 20px; background:var(--ink); color:var(--paper); z-index:200; }
.skip:focus { top:12px; }
.eyebrow { font:11px/1.65 var(--mono); text-transform:uppercase; letter-spacing:1.35px; color:var(--muted); }
.dot { display:inline-block; width:6px; height:6px; background:var(--accent); border-radius:50%; vertical-align:2px; margin-right:8px; }
h1,h2,h3,h4,p { margin-top:0; }
h1,h2,h3,h4 { font-family:var(--display); font-weight:400; line-height:1.13; }
h1 { font-size:clamp(40px,4.7vw,68px); letter-spacing:-2.1px; margin:16px 0 24px; overflow-wrap:break-word; }
h2 { font-size:32px; letter-spacing:-.7px; }
h3 { font-size:25px; letter-spacing:-.4px; }
.actions { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.btn { display:inline-flex; min-height:46px; align-items:center; justify-content:center; gap:12px; padding:11px 18px; border:1px solid var(--line); border-radius:5px; font-size:13px; font-weight:500; line-height:1.5; transition:background .16s,border-color .16s; }
.btn svg { width:17px; height:17px; }
.btn:hover { background:var(--soft); border-color:var(--muted); }
.btn.primary { color:var(--paper); background:var(--ink); border-color:var(--ink); }
.btn.primary:hover { background:var(--accent); border-color:var(--accent); color:var(--card); }
body[data-theme=dark] .btn.primary:hover { color:#17231e; }
.btn.text { border-color:transparent; background:transparent; }
.btn.text:hover { color:var(--accent); }
.btn.small { min-height:40px; padding:8px 12px; font-size:12px; gap:8px; }
.btn.inverse { color:#f4eddc; border-color:#84967c; background:transparent; }
.btn.inverse:hover { background:#395542; }
.icon-btn { display:inline-flex; width:44px; height:44px; align-items:center; justify-content:center; border:1px solid transparent; border-radius:50%; }
.icon-btn:hover { background:var(--soft); border-color:var(--line); }
.icon-btn svg { width:19px; height:19px; }
.quiet-link { display:inline-flex; align-items:center; gap:9px; min-height:40px; font-size:13px; font-weight:500; }
.quiet-link:hover { color:var(--accent); }
.quiet-link svg { width:17px; height:17px; }
.small-muted,.fineprint { color:var(--muted); font-size:13px; line-height:1.75; }
.fineprint { margin:24px 0 40px; }
.note-panel { padding:22px 26px; background:var(--soft); border-left:2px solid var(--accent); font-size:14px; line-height:1.75; }
.note-panel p { margin:8px 0 0; color:var(--muted); }
main { min-height:65vh; }
/* Navigation */
.site-header { position:sticky; top:0; height:var(--header-height); z-index:40; border-bottom:1px solid var(--line); background:var(--paper); }
.header-inner { display:flex; height:100%; align-items:center; gap:28px; }
.brand { display:flex; align-items:center; gap:10px; white-space:nowrap; font:25px var(--display); letter-spacing:-.8px; }
.brand-mark { width:33px; height:33px; color:var(--accent); }
.brand-dot { color:var(--accent); }
.nav { display:flex; gap:25px; align-items:center; margin-left:auto; }
.nav a { display:flex; min-height:44px; align-items:center; color:var(--muted); font-size:13px; position:relative; }
.nav a:hover,.nav a.active { color:var(--ink); }
.nav a.active::after { content:''; position:absolute; bottom:0; left:0; right:0; height:2px; background:var(--accent); }
.header-actions { display:flex; align-items:center; gap:5px; }
.shelf-link { display:flex; align-items:center; gap:8px; font-size:12px; min-height:44px; white-space:nowrap; padding-inline:8px; }
.shelf-link svg { width:18px; height:18px; }
.count-badge { font:11px var(--mono); padding:4px 6px; background:var(--soft); border-radius:4px; }
.mobile-menu { display:none; }
#mobile-dock { display:none; }
.storage-banner { display:flex; align-items:center; justify-content:center; gap:18px; flex-wrap:wrap; background:#fff0c9; color:#5b4619; padding:8px 24px; font-size:12px; }
.storage-banner button { display:flex; align-items:center; gap:7px; min-height:32px; text-decoration:underline; }
.storage-banner svg { width:16px; }
/* Discover */
.hero { display:grid; grid-template-columns:1.02fr 1fr; align-items:center; gap:65px; padding:62px 0 56px; }
.hero h1 { font-size:clamp(54px,5.8vw,83px); line-height:1.03; letter-spacing:-3.6px; margin:27px 0 26px; }
.hero h1 em { color:var(--accent); font-weight:400; }
.hero-copy>p { max-width:465px; color:var(--muted); font-size:17px; line-height:1.9; margin:0 0 28px; }
.hero-stats { display:flex; gap:40px; align-items:center; padding-top:30px; margin-top:30px; border-top:1px solid var(--line); max-width:450px; }
.hero-stats>div { display:flex; flex-direction:column; gap:7px; }
.hero-stats strong { font:30px/1 var(--display); }
.hero-stats span { font:10px var(--mono); color:var(--muted); letter-spacing:.7px; }
.hero-art { background:#233e32; color:#bccda8; border-radius:9px; overflow:hidden; position:relative; min-width:0; border:1px solid #466047; }
.art-caption { display:flex; justify-content:space-between; gap:10px; font:9px var(--mono); letter-spacing:1px; padding:24px 25px 0; color:#c5cfb7; }
.hero-art>svg { width:100%; height:auto; padding:0 9px; }
.hero-art a:hover .star-halo,.hero-art a:focus-visible .star-halo { r:14; stroke:#f1d0ad; stroke-width:2; }
.hero-art svg a:focus-visible { outline:none; }
.art-footer { display:flex; justify-content:space-between; align-items:center; border-top:1px solid #62735a; margin:0 25px; padding:18px 0; color:#e6e8d5; font-size:12px; }
.art-footer svg { width:17px; }
.continue-card { display:flex; gap:20px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:7px; padding:25px 28px; }
.continue-icon { width:49px; height:49px; border-radius:50%; background:var(--soft); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--green); }
.continue-card h2 { margin:5px 0 4px; font-size:25px; }
.continue-card p { margin:0; font-size:13px; color:var(--muted); }
.continue-card>div { flex:1; }
.continue-card>.quiet-link { margin-left:5px; }
.section { padding:66px 0 0; }
.section-heading { display:flex; justify-content:space-between; gap:25px; align-items:end; margin-bottom:27px; }
.section-heading h2 { margin:7px 0 0; font-size:36px; }
.section-heading p { color:var(--muted); margin:8px 0 0; }
.section-heading>.quiet-link { white-space:nowrap; }
.concept-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:22px; }
.concept-card { border-top:2px solid var(--field-color); border-bottom:1px solid var(--line); padding:22px 0 17px; position:relative; }
.concept-top { display:flex; gap:10px; align-items:start; justify-content:space-between; }
.concept-top>.eyebrow { letter-spacing:.65px; font-size:10px; }
.concept-top svg { width:16px; height:16px; }
.concept-card h3 { max-width:310px; font-size:31px; line-height:1.13; margin:23px 0 26px; }
.concept-card:hover h3 { color:var(--accent); }
.concept-bottom { display:flex; align-items:center; justify-content:space-between; font:10px var(--mono); letter-spacing:.6px; color:var(--muted); }
.concept-orbit { height:24px; width:38px; border:1px solid var(--field-color); border-radius:50%; transform:rotate(-25deg); }
.concept-orbit::after { content:''; display:block; height:24px; width:38px; border:1px solid var(--field-color); border-radius:50%; transform:rotate(50deg); }
.feature { margin-top:66px; background:#2c493a; border:1px solid #567157; border-radius:8px; color:#f5f0df; display:grid; grid-template-columns:.65fr 1fr; overflow:hidden; }
.feature-art { min-height:305px; position:relative; overflow:hidden; color:#bec6a1; background:#324f3e; }
.feature-art .motif { position:absolute; inset:15% -15%; width:130%; height:75%; opacity:.65; }
.feature-art>span { position:absolute; left:43%; top:25%; font:130px var(--display); color:#e5c4a1; }
.feature-copy { padding:40px 50px; }
.feature-copy .eyebrow { color:#d1d5b7; }
.feature-copy h2 { font-size:41px; line-height:1.1; margin:16px 0; }
.feature-copy p { max-width:460px; font-size:15px; color:#d4dccc; margin-bottom:24px; }
.next-box { display:grid; grid-template-columns:1fr 1.25fr; align-items:center; gap:48px; padding:35px 37px; margin:62px 0; background:var(--soft); border-radius:7px; }
.next-box h2 { font-size:30px; margin:10px 0 13px; }
.next-box p { font-size:14px; color:var(--muted); margin:0; }
.next-controls { display:grid; grid-template-columns:1fr .75fr; align-items:end; gap:14px; }
.next-controls label { font-size:12px; color:var(--muted); }
.next-controls select { margin-top:6px; width:100%; }
.next-controls>.btn { grid-column:1/-1; justify-self:start; }
select { background:var(--card); padding:12px 32px 12px 12px; border:1px solid var(--line); border-radius:4px; min-height:44px; font-size:13px; }
/* Collection */
.page-head { padding:57px 0 38px; }
.page-head h1 { margin-bottom:21px; }
.page-head>p { max-width:740px; color:var(--muted); font-size:17px; line-height:1.85; margin-bottom:0; }
.head-line { display:flex; justify-content:space-between; align-items:center; gap:25px; }
.head-line h1 { margin-bottom:0; }
.head-line p { max-width:460px; color:var(--muted); font-size:15px; margin:18px 0 0; }
.collection-section { padding-bottom:42px; }
.filterbar { display:flex; align-items:center; gap:12px; padding-bottom:19px; }
.search-input { display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:5px; background:var(--card); min-width:0; flex:1; padding:0 16px; min-height:49px; }
.search-input>svg { color:var(--muted); width:20px; height:20px; }
.search-input input { background:transparent; width:100%; min-width:0; border:0; padding:13px 0; font-size:15px; }
.search-input:focus-within { outline:2px solid var(--accent); outline-offset:1px; }
.search-input input:focus-visible { outline:0; }
.filterbar select { min-height:49px; }
.view-toggle { display:flex; border:1px solid var(--line); border-radius:4px; padding:3px; }
.view-toggle button { display:flex; align-items:center; justify-content:center; width:38px; min-height:41px; border-radius:3px; }
.view-toggle button[aria-pressed=true] { background:var(--soft); }
.view-toggle svg { width:18px; height:18px; }
.pills { display:flex; gap:8px; flex-wrap:wrap; }
.pill { display:inline-flex; align-items:center; gap:7px; min-height:37px; border:1px solid var(--line); border-radius:20px; padding:7px 13px; font-size:12px; line-height:1.4; }
.pill:hover { background:var(--soft); }
.pill.active { background:var(--ink); border-color:var(--ink); color:var(--paper); }
.pill svg { width:14px; height:14px; }
.field-dot { width:5px; height:5px; border-radius:50%; background:var(--field-color); display:block; }
.results-line { display:flex; justify-content:space-between; align-items:center; padding:21px 0 18px; font:11px var(--mono); color:var(--muted); }
.results-line button { font:12px var(--sans); min-height:38px; text-decoration:underline; text-underline-offset:3px; }
.card-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:23px; }
.person-card { border:1px solid var(--line); background:var(--card); border-radius:6px; overflow:hidden; position:relative; min-width:0; display:flex; flex-direction:column; transition:border-color .2s,box-shadow .2s; }
.person-card:hover { border-color:var(--muted); box-shadow:0 8px 22px #1b33270b; }
.person-link { display:flex; flex-direction:column; flex:1; min-width:0; }
.card-art { background:var(--field-soft); height:137px; position:relative; overflow:hidden; color:var(--field-color); }
.card-art .motif { width:100%; height:100%; position:absolute; inset:0; opacity:.45; }
.cover-year { position:absolute; top:15px; left:17px; font:10px var(--mono); letter-spacing:.5px; }
.cover-symbol { position:absolute; right:29px; top:28px; font:73px var(--display); }
.card-content { padding:21px 19px 16px; display:flex; flex-direction:column; flex:1; min-width:0; }
.card-label { display:flex; justify-content:space-between; gap:8px; font:9px/1.5 var(--mono); text-transform:uppercase; letter-spacing:.65px; color:var(--muted); min-height:25px; }
.read-indicator { white-space:nowrap; color:var(--green); }
.card-content h3 { font-size:25px; line-height:1.13; margin:6px 0 13px; letter-spacing:-.5px; }
.card-content>p { color:var(--muted); font-size:13px; line-height:1.7; margin-bottom:25px; }
.card-footer { margin-top:auto; display:flex; align-items:center; justify-content:space-between; border-top:1px solid var(--line); padding-top:13px; font:9px var(--mono); letter-spacing:.25px; color:var(--muted); gap:8px; }
.card-footer i { padding:0 3px; font-style:normal; }
.card-footer svg { width:16px; height:16px; color:var(--ink); }
.bookmark-btn { position:absolute; top:5px; right:5px; width:44px; height:44px; display:flex; justify-content:center; align-items:center; color:var(--field-color); border-radius:50%; }
.bookmark-btn svg { width:17px; height:17px; }
.bookmark-btn.saved svg { fill:currentColor; }
.bookmark-btn:hover { background:#ffffff65; }
.card-progress { height:3px; background:var(--soft); }
.card-progress>span { display:block; height:100%; background:var(--accent); }
.search-excerpt { font-size:12px; color:var(--muted); line-height:1.85; margin-bottom:20px; }
mark { background:#ecd7ad; color:#2c3b2c; border-radius:2px; }
body[data-theme=dark] mark { background:#536443; color:#fffbe4; }
.load-row { display:flex; flex-direction:column; align-items:center; gap:12px; margin-top:30px; }
.load-row>span { color:var(--muted); font-size:12px; }
.card-grid.list-view { grid-template-columns:1fr; gap:12px; }
.list-view .person-link { flex-direction:row; }
.list-view .card-art { width:126px; height:auto; min-height:146px; flex-shrink:0; }
.list-view .cover-year { top:14px; font-size:9px; }
.list-view .cover-symbol { font-size:55px; right:40px; top:39px; }
.list-view .card-content { display:grid; grid-template-columns:220px minmax(0,1fr) auto; gap:4px 24px; padding:18px 67px 18px 25px; align-items:center; }
.list-view .card-label { grid-column:1/-1; min-height:0; justify-content:start; }
.list-view .card-content h3 { margin:0; }
.list-view .card-content>p { margin:0; }
.list-view .card-footer { border:0; margin:0; padding:0; }
.list-view .search-excerpt { grid-column:1/-1; margin:9px 0 0; }
.list-view .bookmark-btn { color:var(--muted); top:12px; right:12px; }
.empty { text-align:center; padding:70px 25px; border:1px dashed var(--line); border-radius:6px; margin-bottom:35px; }
.empty h2 { font-size:34px; margin:17px 0; }
.empty p { color:var(--muted); max-width:550px; margin:0 auto 24px; }
.empty-icon { display:flex; justify-content:center; color:var(--accent); }
.empty-icon svg { width:32px; height:32px; }
/* Idea lenses and paths */
.ideas-grid { gap:30px; padding-bottom:50px; }
.ideas-grid .concept-card { padding:25px; background:var(--card); border:1px solid var(--line); border-top:2px solid var(--field-color); border-radius:4px; }
.idea-intro { display:grid; grid-template-columns:1.3fr 1fr; gap:55px; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:32px; margin-bottom:45px; }
.idea-intro h2 { margin:12px 0; font-size:35px; }
.idea-intro p { color:var(--muted); line-height:1.85; }
.idea-vocabulary { padding-top:5px; }
.idea-vocabulary>.eyebrow { margin-bottom:17px; }
.trail-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:22px; }
.trail-card { display:flex; flex-direction:column; padding:25px; background:var(--card); border:1px solid var(--line); border-radius:5px; position:relative; overflow:hidden; }
.trail-card>.eyebrow { font-size:10px; letter-spacing:.75px; padding-right:22px; }
.trail-number { position:absolute; right:18px; top:19px; font:18px var(--display); color:var(--muted); opacity:.7; }
.trail-card h3 { font-size:28px; margin:15px 0 13px; }
.trail-card p { font-size:13px; line-height:1.8; color:var(--muted); margin:0 0 25px; }
.path-mini { display:flex; align-items:center; margin-top:22px; }
.path-mini i { width:6px; height:6px; border:1px solid var(--field-color); border-radius:50%; }
.path-mini i:first-of-type,.path-mini i.done { background:var(--field-color); }
.path-mini>span { width:14px; height:1px; background:var(--line); }
.trail-bottom { display:flex; align-items:center; justify-content:space-between; padding-top:15px; border-top:1px solid var(--line); margin-top:auto; color:var(--muted); font:10px var(--mono); }
.trail-bottom svg { width:16px; }
.all-trails { padding-top:8px; }
.back-link { display:inline-flex; align-items:center; gap:10px; color:var(--muted); font-size:12px; min-height:44px; margin:18px 0 5px; }
.back-link svg { width:17px; height:17px; }
.back-link:hover { color:var(--accent); }
.trail-intro { display:grid; grid-template-columns:1fr 235px; gap:70px; padding:31px 0 50px; align-items:center; border-bottom:1px solid var(--line); }
.trail-intro h1 { font-size:clamp(40px,4.5vw,64px); max-width:840px; }
.trail-intro>div>p { color:var(--muted); font-size:17px; max-width:730px; line-height:1.8; margin-bottom:22px; }
.trail-progress { border:1px solid var(--line); background:var(--card); padding:27px; border-radius:5px; }
.trail-progress strong { display:block; font:64px/1.4 var(--display); }
.trail-progress small { font-size:26px; color:var(--muted); }
.trail-progress p { font-size:12px; margin:15px 0 0; color:var(--muted); }
.progress-track { height:4px; background:var(--soft); }
.progress-track>span { display:block; height:100%; background:var(--accent); }
.trail-step { display:flex; gap:28px; padding:34px 0; border-bottom:1px solid var(--line); }
.step-index { flex-shrink:0; width:45px; height:45px; display:flex; align-items:center; justify-content:center; border:1px solid var(--line); border-radius:50%; font:15px var(--mono); }
.step-index.done { color:var(--paper); background:var(--ink); }
.step-content { display:flex; gap:40px; align-items:center; justify-content:space-between; flex:1; }
.step-content h2 { font-size:30px; margin:8px 0 10px; }
.step-content p { color:var(--muted); font-size:14px; max-width:860px; margin:0; line-height:1.8; }
.step-content>.btn { flex-shrink:0; }
/* Reading desk */

  .profile-head { display:block; padding:0 0 16pt; }.profile-head h1 { font-size:30pt; }.profile-subtitle { font-size:19pt; }.profile-meta { font-size:10pt; }
  .article { font:12pt/1.6 Georgia,serif; max-width:none; }.article-lede { font-size:13pt; }.article-section h2 { font-size:19pt; break-after:avoid; }.math-block { break-inside:avoid; margin-top:15pt; }.article-section { margin-bottom:20pt; }
  .formula { font-size:13pt; overflow:visible; }.print-footer { display:block; margin-top:20pt; border-top:1px solid #ccc; padding-top:10pt; font:9pt/1.7 sans-serif; overflow-wrap:anywhere; }
  .sources-section { display:none; }
}

/* Mobile graph labels remain legible rather than shrinking with the SVG. */
@media(max-width:600px) {
  #network.local-map .node-label { font-size:30px; stroke-width:5px; }
  #network.local-map .map-node[aria-pressed=true] .node-label { font-size:35px; }
  #network.local-map .node-target { r:56px; }
}

/* Public publishing journal. Never mixes with the reader's private notebook. */
.publication-banner{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:28px 0;border-block:1px solid var(--line);margin:24px 0}.publication-banner h2{margin:12px 0}.publication-banner p{max-width:65ch}.publication-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:56px;margin-bottom:80px}.publication-entry{padding:32px 0;border-bottom:1px solid var(--line)}.publication-entry h2{margin:12px 0}.publication-entry p{max-width:68ch}.publication-archive{max-width:800px;margin:0 auto 80px}.publication-archive pre{font:inherit;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.publication-layout code{overflow-wrap:anywhere}.publication-banner h2 a,.publication-entry h2 a{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:5px}@media(max-width:760px){.publication-layout{grid-template-columns:1fr;gap:24px}.publication-banner{align-items:flex-start;flex-direction:column}}

/* Illustrated idea essays, in the original paper-and-line palette. */
.idea-drawing { display:block; width:100%; height:auto; color:var(--field-color,var(--ink)); }
.idea-drawing text { fill:var(--ink); stroke:none; font:16px var(--sans); }
.idea-drawing .plate-word { font:30px var(--mono); letter-spacing:5px; }
.idea-drawing .plate-accent { stroke:var(--accent); stroke-width:3; }
.idea-drawing .plate-faint { opacity:.32; stroke-dasharray:5 5; }
.idea-drawing .plate-node { fill:var(--card); }
.idea-drawing .plate-solid { fill:var(--field-color,var(--ink)); }
.idea-essay { display:grid; grid-template-columns:1.15fr 1fr; align-items:start; gap:38px; margin:0 0 46px; }
.idea-plate { margin:0; padding:25px; border:1px solid var(--line); border-radius:5px; background:var(--card); }
.idea-plate .idea-drawing { margin:30px 0 20px; }
.idea-plate figcaption { color:var(--muted); font:13px/1.8 var(--sans); border-top:1px solid var(--line); padding-top:18px; }
.idea-explanation h2 { font-size:32px; margin:13px 0 18px; }
.idea-explanation p { font:17px/1.85 var(--serif); }
.editorial-sources { display:grid; gap:8px; margin-top:17px; }
.editorial-sources a { color:var(--muted); font:12px/1.7 var(--sans); text-decoration:underline; text-underline-offset:3px; overflow-wrap:anywhere; }
.editorial-sources a:hover { color:var(--accent); }
.editorial-sources svg { width:13px; height:13px; vertical-align:middle; }
.idea-bridges { margin:0 0 48px; }
.idea-bridge-grid { display:grid; grid-template-columns:1fr 1fr; gap:22px; }
.idea-bridge { border-top:1px solid var(--line); padding:22px 0; }
.idea-bridge h3 { margin:0 0 10px; font-size:26px; }
.idea-bridge p { color:var(--muted); max-width:540px; margin:0; }
.idea-bridge:hover h3 { color:var(--accent); }
.connection-kind { display:inline-block; font:10px/1.6 var(--mono); text-transform:uppercase; letter-spacing:.04em; border:1px solid var(--line); border-radius:3px; padding:4px 7px; margin:5px 0 10px; }
.graph-neighbor .editorial-sources { margin:10px 0; }
.graph-neighbor .editorial-sources a { font-size:11px; }
body[data-theme=dark] .idea-drawing { color:var(--ink); }
body[data-theme=dark] .idea-drawing .plate-solid { fill:var(--ink); }
@media(max-width:1000px) { .idea-essay { grid-template-columns:1fr; gap:26px; }.idea-explanation { max-width:760px; } }
@media(max-width:620px) { .idea-plate { padding:15px; }.idea-bridge-grid { grid-template-columns:1fr; gap:0; }.idea-drawing:not(.small) text { font-size:19px; }.idea-plate .idea-drawing { margin:20px 0; }.idea-explanation h2 { font-size:29px; } }

.plate-scroll { overflow-x:auto; max-width:100%; }
.idea-essay > * { min-width:0; }
.plate-scroll-hint { display:none; }
@media(max-width:620px) { .idea-plate .idea-drawing { min-width:620px; }.plate-scroll-hint { display:block; color:var(--muted); font:11px var(--sans); margin:0 0 18px; } }

ial to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Évariste Galois","id":"galois","born":1811,"field":"algebra","title":"Symmetry explains solvability","bio":"Galois related polynomial equations to permutation groups of their roots. His work transformed the question of solving equations by radicals into a structural question about groups.","formula":"Gal(L/K)","impact":"A polynomial's hidden symmetries govern which algebraic operations can recover its roots. The approach made group theory central to algebra.","ref":"Galois","sections":[{"title":"The idea to carry forward","text":"A polynomial's hidden symmetries govern which algebraic operations can recover its roots. The approach made group theory central to algebra.","math":"Gal(L/K)"}],"sources":[{"label":"MacTutor · historical biography","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Galois/","type":"biography"}],"questions":["What is the simplest example of symmetry explains solvability?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"George Boole","id":"boole","born":1815,"field":"logic","title":"Logic becomes algebra","bio":"Boole introduced an algebraic treatment of logical reasoning. His work helped establish the idea that logical operations can be manipulated symbolically.","formula":"x ∧ y,  x ∨ y,  ¬x","impact":"Boolean algebra eventually became a foundation of digital circuit design. Shannon supplied the explicit engineering bridge to switching circuits.","ref":"Boole","sections":[{"title":"The idea to carry forward","text":"Boolean algebra eventually became a foundation of digital circuit design. Shannon supplied the explicit engineering bridge to switching circuits.","math":"x ∧ y,  x ∨ y,  ¬x"}],"sources":[{"label":"MacTutor · historical biography","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Boole/","type":"biography"}],"questions":["What is the simplest example of logic becomes algebra?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Ada Lovelace","id":"lovelace","born":1815,"field":"systems","title":"Programs before electronic computers","bio":"Lovelace's notes on Babbage's Analytical Engine included a detailed scheme for computing Bernoulli numbers. She also considered how a general symbolic machine might manipulate more than numerical quantities.","formula":"instructions + data → computation","impact":"Her importance lies in the conception and explanation of programmable symbolic machinery. The Analytical Engine itself was not completed in her lifetime.","ref":"Lovelace","sections":[{"title":"The idea to carry forward","text":"Her importance lies in the conception and explanation of programmable symbolic machinery. The Analytical Engine itself was not completed in her lifetime.","math":"instructions + data → computation"}],"sources":[{"label":"MacTutor · historical biography","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Lovelace/","type":"biography"}],"questions":["What is the simplest example of programs before electronic computers?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Arthur Cayley","id":"cayley","born":1821,"field":"algebra","title":"Algebraic structures in their own right","bio":"Cayley developed matrix theory and abstract group theory. He also contributed to invariant theory and the enumeration of combinatorial structures.","formula":"G ↪ S_G","impact":"Every group acts faithfully on itself by left multiplication. Cayley's theorem makes an abstract group concrete as a group of permutations.","ref":"Cayley","sections":[{"title":"The idea to carry forward","text":"Every group acts faithfully on itself by left multiplication. Cayley's theorem makes an abstract group concrete as a group of permutations.","math":"G ↪ S_G"}],"sources":[{"label":"MacTutor · historical biography","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Cayley/","type":"biography"}],"questions":["What is the simplest example of algebraic structures in their own right?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Bernhard Riemann","id":"riemann","born":1826,"field":"geometry","title":"Geometry beyond flat space","bio":"Riemann introduced a flexible framework for curved spaces and made profound contributions to complex analysis and number theory. His 1854 geometry lecture changed the meaning of space in mathematics.","formula":"ds² = Σᵢⱼ gᵢⱼ dxᵢ dxⱼ","impact":"A metric can vary from point to point. This permits intrinsic geometry on manifolds and later became essential to general relativity.","ref":"Riemann","sections":[{"title":"The idea to carry forward","text":"A metric can vary from point to point. This permits intrinsic geometry on manifolds and later became essential to general relativity.","math":"ds² = Σᵢⱼ gᵢⱼ dxᵢ dxⱼ"}],"sources":[{"label":"MacTutor · historical biography","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Riemann/","type":"biography"}],"questions":["What is the simplest example of geometry beyond flat space?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Richard Dedekind","id":"dedekind","born":1831,"field":"algebra","title":"Numbers defined by structure","bio":"Dedekind developed structural foundations for the real numbers and algebraic number theory. Ideals provide a replacement for unique factorization of elements in settings where it fails.","formula":"ℝ via Dedekind cuts","impact":"A real number can be described through a partition of the rationals. Structural definitions clarify what an object is without depending on a particular numerical approximation.","ref":"Dedekind","sections":[{"title":"The idea to carry forward","text":"A real number can be described through a partition of the rationals. Structural definitions clarify what an object is without depending on a particular numerical approximation.","math":"ℝ via Dedekind cuts"}],"sources":[{"label":"MacTutor · historical biography","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Dedekind/","type":"biography"}],"questions":["What is the simplest example of numbers defined by structure?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Georg Cantor","id":"cantor","born":1845,"field":"logic","title":"Different sizes of infinity","bio":"Cantor founded set theory and distinguished countable from uncountable infinity. His diagonal argument demonstrates limits on attempts to enumerate all infinite binary sequences.","formula":"|ℕ| < |ℝ|","impact":"Infinity is not one undifferentiated size. Diagonalization also became a recurring tool in logic and computability.","ref":"Cantor","sections":[{"title":"The idea to carry forward","text":"Infinity is not one undifferentiated size. Diagonalization also became a recurring tool in logic and computability.","math":"|ℕ| < |ℝ|"}],"sources":[{"label":"MacTutor · historical biography","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Cantor/","type":"biography"}],"questions":["What is the simplest example of different sizes of infinity?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Gottlob Frege","id":"frege","born":1848,"field":"logic","title":"Quantifiers and formal reasoning","bio":"Frege developed a powerful formal notation for logic in his Begriffsschrift. His work brought quantification and the structure of mathematical inference into a precise symbolic system.","formula":"∀x ∃y R(x,y)","impact":"Modern predicate logic owes much to the distinction between objects, functions and quantified assertions. Frege's later foundational system also exposed the dangers of unrestricted comprehension.","ref":"Frege","sections":[{"title":"The idea to carry forward","text":"Modern predicate logic owes much to the distinction between objects, functions and quantified assertions. Frege's later foundational system also exposed the dangers of unrestricted comprehension.","math":"∀x ∃y R(x,y)"}],"sources":[{"label":"MacTutor · historical biography","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Frege/","type":"biography"}],"questions":["What is the simplest example of quantifiers and formal reasoning?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Henri Poincaré","id":"poincare","born":1854,"field":"geometry","title":"Shape and dynamics","bio":"Poincaré helped create algebraic topology and qualitative dynamical systems. He studied global structure rather than relying only on explicit solutions of equations.","formula":"π₁(X)","impact":"The fundamental group records how loops can wind through a space. It translates a geometric problem into an algebraic invariant.","ref":"Poincare","sections":[{"title":"The idea to carry forward","text":"The fundamental group records how loops can wind through a space. It translates a geometric problem into an algebraic invariant.","math":"π₁(X)"}],"sources":[{"label":"MacTutor · historical biography","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Poincare/","type":"biography"}],"questions":["What is the simplest example of shape and dynamics?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Andrey Markov","id":"markov","born":1856,"field":"analysis","title":"Randomness with memory of the present","bio":"Markov studied stochastic processes whose next state depends on the present state. These processes became a basic model of dependent randomness.","formula":"Pr(Xₜ₊₁=j ∣ Xₜ=i) = Pᵢⱼ","impact":"A transition matrix turns long-term random behavior into a problem in probability and linear algebra. Markov chains are central to sampling and randomized algorithms.","ref":"Markov","sections":[{"title":"The idea to carry forward","text":"A transition matrix turns long-term random behavior into a problem in probability and linear algebra. Markov chains are central to sampling and randomized algorithms.","math":"Pr(Xₜ₊₁=j ∣ Xₜ=i) = Pᵢⱼ"}],"sources":[{"label":"MacTutor · historical biography","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Markov/","type":"biography"}],"questions":["What is the simplest example of randomness with memory of the present?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Giuseppe Peano","id":"peano","born":1858,"field":"logic","title":"Arithmetic from axioms","bio":"Peano developed an influential axiomatization and notation for arithmetic. He also constructed a continuous space-filling curve, challenging geometric intuition.","formula":"0, S(0), S(S(0)), …","impact":"A small collection of axioms can support systematic reasoning about numbers. First-order arithmetic nevertheless has nonstandard models and is subject to incompleteness.","ref":"Peano","sections":[{"title":"The idea to carry forward","text":"A small collection of axioms can support systematic reasoning about numbers. First-order arithmetic nevertheless has nonstandard models and is subject to incompleteness.","math":"0, S(0), S(S(0)), …"}],"sources":[{"label":"MacTutor · historical biography","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Peano/","type":"biography"}],"questions":["What is the simplest example of arithmetic from axioms?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"David Hilbert","id":"hilbert","born":1862,"field":"logic","title":"Certificates, axioms and algebra","bio":"Hilbert transformed invariant theory, algebraic geometry and mathematical foundations. His work linked finite generation, algebraic certificates and ambitious programs for formal proof.","formula":"Σᵢ gᵢfᵢ = 1","impact":"Over an algebraically closed field, a finite polynomial system with no common zero admits this Nullstellensatz certificate. Existence of a certificate does not guarantee that it is small.","ref":"Hilbert","sections":[{"title":"Finite generation","text":"Hilbert’s basis theorem says that if a commutative ring is Noetherian then its polynomial ring is Noetherian. In particular, every ideal of a polynomial ring over a field has finitely many generators.","math":"I = (f₁,…,fₘ)"},{"title":"A certificate of impossibility","text":"Over an algebraically closed field, polynomials with no common zero generate the unit ideal. An identity Σgᵢfᵢ=1 certifies this: evaluating at a hypothetical common zero would give 0=1.","math":"Σᵢ gᵢfᵢ = 1","tex":"\\sum_{i=1}^{m} g_i f_i = 1","mathSVG":"<mjx-container class=\"MathJax\" jax=\"SVG\" display=\"true\"><svg style=\"vertical-align: -2.819ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"11.46ex\" height=\"6.354ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -1562.5 5065.1 2808.5\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"munderover\"><g data-mml-node=\"mo\"> tebooks continued to generate mathematical work long after his death.","ref":"Ramanujan","sections":[{"title":"The idea to carry forward","text":"A simple-looking congruence reflects deep structure in generating functions. His notebooks continued to generate mathematical work long after his death.","math":"p(5n+4) ≡ 0 (mod 5)"}],"sources":[{"label":"MacTutor · historical biography","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Ramanujan/","type":"biography"}],"questions":["What is the simplest example of unexpected arithmetic patterns?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Stefan Banach","id":"banach","born":1892,"field":"analysis","title":"Infinite-dimensional geometry","bio":"Banach helped establish functional analysis as a systematic subject. Complete normed vector spaces allow functions themselves to be treated as geometric points.","formula":"∥T(x)−T(y)∥ ≤ c∥x−y∥, c<1","impact":"A contraction on a complete metric space has a unique fixed point. Repeated iteration converges to it, connecting existence with an explicit method.","ref":"Banach","sections":[{"title":"The idea to carry forward","text":"A contraction on a complete metric space has a unique fixed point. Repeated iteration converges to it, connecting existence with an explicit method.","math":"∥T(x)−T(y)∥ ≤ c∥x−y∥, c<1"}],"sources":[{"label":"MacTutor · historical biography","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Banach/","type":"biography"}],"questions":["What is the simplest example of infinite-dimensional geometry?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Norbert Wiener","id":"wiener","born":1894,"field":"information","title":"Feedback, noise and control","bio":"Wiener worked on probability, harmonic analysis and cybernetics. He treated communication and control as systems involving noise, prediction and feedback.","formula":"output → feedback → input","impact":"Feedback changes a system in response to its observed behavior. His work connected rigorous stochastic analysis with engineering and the study of adaptive systems.","ref":"Wiener","sections":[{"title":"The idea to carry forward","text":"Feedback changes a system in response to its observed behavior. His work connected rigorous stochastic analysis with engineering and the study of adaptive systems.","math":"output → feedback → input"}],"sources":[{"label":"MacTutor · historical biography","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Wiener/","type":"biography"}],"questions":["What is the simplest example of feedback, noise and control?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Emil Post","id":"post","born":1897,"field":"complexity","title":"Computation through rewriting","bio":"Post developed formal production systems, work on recursive enumerability, and the Post correspondence problem. His approaches helped map the limits of effective procedures.","formula":"uᵢ₁uᵢ₂…uᵢₖ = vᵢ₁vᵢ₂…vᵢₖ","impact":"The Post correspondence problem asks whether tiles can be matched into equal strings. Its undecidability provides a powerful source problem for reductions.","ref":"Post","sections":[{"title":"The idea to carry forward","text":"The Post correspondence problem asks whether tiles can be matched into equal strings. Its undecidability provides a powerful source problem for reductions.","math":"uᵢ₁uᵢ₂…uᵢₖ = vᵢ₁vᵢ₂…vᵢₖ"}],"sources":[{"label":"MacTutor · historical biography","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Post/","type":"biography"}],"questions":["What is the simplest example of computation through rewriting?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Alfred Tarski","id":"tarski","born":1901,"field":"logic","title":"Truth, models and decidability","bio":"Tarski gave a mathematical account of truth in formal languages and contributed to model theory and algebraic logic. He established decidability for the first-order theory of real closed fields.","formula":"T ⊨ φ","impact":"Semantic consequence means truth in every model of the axioms. The connection between syntax and semantics became fundamental to logic.","ref":"Tarski","sections":[{"title":"The idea to carry forward","text":"Semantic consequence means truth in every model of the axioms. The connection between syntax and semantics became fundamental to logic.","math":"T ⊨ φ"}],"sources":[{"label":"MacTutor · historical biography","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Tarski/","type":"biography"}],"questions":["What is the simplest example of truth, models and decidability?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Andrey Kolmogorov","id":"kolmogorov","born":1903,"field":"analysis","title":"Probability from axioms","bio":"Kolmogorov formulated the measure-theoretic axioms of probability and later developed major ideas in randomness and algorithmic information.","formula":"Pr(⋃ᵢ Aᵢ) = Σᵢ Pr(Aᵢ)","impact":"For pairwise disjoint events, countable additivity organizes probability into measure theory. His separate complexity notion measures the length of the shortest effective description.","ref":"Kolmogorov","sections":[{"title":"The idea to carry forward","text":"For pairwise disjoint events, countable additivity organizes probability into measure theory. His separate complexity notion measures the length of the shortest effective description.","math":"Pr(⋃ᵢ Aᵢ) = Σᵢ Pr(Aᵢ)"}],"sources":[{"label":"MacTutor · historical biography","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Kolmogorov/","type":"biography"}],"questions":["What is the simplest example of probability from axioms?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Alonzo Church","id":"church","born":1903,"field":"complexity","title":"Functions as computation","bio":"Church introduced lambda calculus and proved an undecidability result for first-order logic. Lambda calculus became a foundational model of computation and programming-language semantics.","formula":"(λx.M) N → M[x:=N]","impact":"Computation can be expressed through substitution and function application. Different formal models agreeing on computability helped motivate the Church–Turing thesis.","ref":"Church","sections":[{"title":"The idea to carry forward","text":"Computation can be expressed through substitution and function application. Different formal models agreeing on computability helped motivate the Church–Turing thesis.","math":"(λx.M) N → M[x:=N]"}],"sources":[{"label":"MacTutor · historical biography","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Church/","type":"biography"}],"questions":["What is the simplest example of functions as computation?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"John von Neumann","id":"von-neumann","born":1903,"field":"complexity","title":"Mathematics for machines and games","bio":"Von Neumann contributed to game theory, operator algebras, quantum foundations and computing. His EDVAC report was an influential account of stored-program design developed in a broader collaborative setting.","formula":"maxₓ minᵧ xᵀAy = minᵧ maxₓ xᵀAy","impact":"The minimax theorem gives finite two-player zero-sum games a common va t":"Logical completeness concerns truth in all models. Arithmetic incompleteness concerns what a particular effectively axiomatized consistent theory can decide.","ref":"Godel","sections":[{"title":"Two meanings of completeness","text":"The completeness theorem says that first-order deduction captures every consequence true in all models of a theory. Incompleteness concerns a different issue: no consistent, effectively axiomatized theory sufficiently strong for arithmetic decides every arithmetic sentence. A truth in the intended natural numbers need not hold in every model of the axioms.","math":"truth in every model ⇔ formal provability"},{"title":"Encode syntax as arithmetic","text":"Gödel assigns natural-number codes to formulas and proofs. Arithmetic can then express a relation saying that one number encodes a proof of the formula encoded by another. A diagonal construction produces a sentence asserting its own unprovability. Rosser’s refinement obtains undecidability from consistency alone.","math":"syntax → numbers → self-reference"},{"title":"What the limit does not say","text":"The result does not say that a particular true sentence can never be proved in a stronger theory. It says that no single effective consistent arithmetic theory supplies all answers. Gödel also constructed the universe L, establishing relative consistency results for choice and the continuum hypothesis.","math":"T ⊬ Con(T), under the standard hypotheses"}],"sources":[{"label":"MacTutor · historical biography","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Godel/","type":"biography"}],"questions":["How does arithmetic encode a proof?","Why do nonstandard models reconcile completeness and incompleteness?","How do Gödel’s and Turing’s diagonal arguments differ?"],"approximateBirth":false,"extended":true,"readMinutes":3,"tex":"T\\models\\varphi\\quad\\Longleftrightarrow\\quad T\\vdash\\varphi","mathSVG":"<mjx-container class=\"MathJax\" jax=\"SVG\" display=\"true\"><svg style=\" ansform=\"translate(9064.7,0)\"><path data-c=\"1D711\" d=\"M92 210Q92 176 106 149T142 108T185 85T220 72L235 70L237 71L250 112Q268 170 283 211T322 299T370 375T429 423T502 442Q547 442 582 410T618 302Q618 224 575 152T457 35T299 -10Q273 -10 273 -12L266 -48Q260 -83 252 -125T241 -179Q236 -203 215 -212Q204 -218 190 -218Q159 -215 159 -185Q159 -175 214 -2L209 0Q204 2 195 5T173 14T147 28T120 46T94 71T71 103T56 142T50 190Q50 238 76 311T149 431H162Q183 431 183 423Q183 417 175 409Q134 361 114 300T92 210ZM574 278Q574 320 550 344T486 369Q437 369 394 329T323 218Q309 184 295 109L286 64Q304 62 306 62Q423 62 498 131T574 278Z\"><\/path><\/g><\/g><\/g><\/svg><\/mjx-container>"},{"name":"Grace Hopper","id":"hopper","born":1906,"field":"systems","title":"From machine instructions to languages","bio":"Hopper worked on early computers, automatic programming and compiler development. She played an important role in the movement toward machine-independent business programming languages.","formula":"source program → translation → execution","impact":"Higher-level languages separate what a program expresses from one machine's instruction set. This made programming accessible at a much larger scale.","ref":"Hopper","sections":[{"title":"The idea to carry forward","text":"Higher-level languages separate what a program expresses from one machine's instruction set. This made programming accessible at a much larger scale.","math":"source program → translation → execution"}],"sources":[{"label":"MacTutor · historical biography","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Hopper/","type":"biography"}],"questions":["What is the simplest example of from machine instructions to languages?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Hassler Whitney","id":"whitney","born":1907,"field":"graphs","title":"Independence beyond vectors","bio":"Whitney introduced matroids as a way to axiomatize independence, while also making foundational contributions to differential topology.","formula":"I,J independent, |I|<|J| ⇒ ∃e∈J∖I: I+e independent","impact":"The exchange axiom unifies linear independence with forests in graphs. This abstraction later became central to combinatorial optimization.","ref":"Whitney","sections":[{"title":"The idea to carry forward","text":"The exchange axiom unifies linear independence with forests in graphs. This abstraction later became central to combinatorial optimization.","math":"I,J independent, |I|<|J| ⇒ ∃e∈J∖I: I+e independent"}],"sources":[{"label":"MacTutor · historical biography","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Whitney/","type":"biography"}],"questions":["What is the simplest example of independence beyond vectors?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Stephen Kleene","id":"kleene","born":1909,"field":"logic","title":"The structure of effective computation","bio":"Kleene developed recursive function theory and major parts of mathematical logic. His work on regular events also helped establish the theory behind regular expressions.","formula":"L* = ⋃ₙ≥0 Lⁿ","impact":"Kleene star expresses arbitrary finite repetition. The equivalence of regular expressions and finite automata connects symbolic pattern descriptions with machines.","ref":"Kleene","sections":[{"title":"The idea to carry forward","text":"Kleene star expresses arbitrary finite repetition. The equivalence of regular expressions and finite automata connects symbolic pattern descriptions with machines.","math":"L* = ⋃ₙ≥0 Lⁿ"}],"sources":[{"label":"MacTutor · historical biography","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Kleene/","type":"biography"}],"questions":["What is the simplest example of the structure of effective computation?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Stanislaw Ulam","id":"ulam","born":1909,"field":"graphs","title":"Random sampling as a method","bio":"Ulam made contributions to set theory, analysis and combinatorics. With collaborators he helped develop Monte Carlo methods for numerical problems.","formula":"E[X] ≈ (X₁+⋯+Xₘ)/m","impact":"Sampling can estimate a quantity that is difficult to compute exactly. The error depends on the distribution, variance and sampling method, not merely on the sample count.","ref":"Ulam","sections":[{"title":"The idea to carry forward","text":"Sampling can estimate a quantity that is difficult to compute exactly. The error depends on the distribution, variance and sampling method, not merely on the sample count.","math":"E[X] ≈ (X₁+⋯+Xₘ)/m"}],"sources":[{"label":"MacTutor · historical biography","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Ulam/","type":"biography"}],"questions":["What is the simplest example of random sampling as a method?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Alan Turing","id":"turing","born":1912,"field":"complexity","title":"A mathematical model of computation","bio":"Turing defined an abstract computing machine, established universal simulation and proved an undecidability result. His later work included cryptanalysis, machine intelligence and morphogenesis.","formula":"U(⟨M,x⟩) = M(x)","impact":"One machine can simulate the description of another. Encoding programs as data makes universality and diagonal arguments possible.","ref":"Turing","sections":[{"title":"The universal machine","text":"A finite transition rule controls a tape, a read/write head and a state. Encoding such a rule lets a single universal machine simulate every other machine. Programs themselves become manipulable data.","math":"U(⟨M,x⟩) = M(x)","tex":"U(\\langle M,x\\rangle)=M(x)"},{"title":"A diagonal contradiction","text":"Assume a total procedure decides whether any program halts on any input. Construct D so that D(M) loops if that procedure predicts M(M) halts, and halts otherwise. Applying D to itself forces either answer to be wrong.","math":"D(D): halt ⇔ do not halt"},{"title":"Computability comes before efficiency","text":"SAT is decidable by exhaustive search, even when that is expensive. Halting has no total deciding algorithm at all. Turing’s later contributions to cryptanalysis and machine intelligence do not erase this fundamental distinction.","math":"decidable ≠ efficiently decidable"},{"title":"From an endless search to an equation","text":"Run a search over all integer tuples and stop if a polynomial evaluates to zero. This procedure recognizes a solution when one exists; an endless unsuccessful run proves nothing by itself. Julia Robinson’s profile follows the deeper result that integer equations can represent arbitrary computably enumerable sets.\n\nContrast SAT: with finitely many Boolean variables there are only finitely many assignments to check. Both tasks admit a search, but only the bounded search is automatically a decision procedure. This is why “hard to find” and “impossible to decide in general” should remain separate ideas."}],"sources":[{"label":"MacTutor · historical biography","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Turing/","type":"biography"},{"label":"Turing · On Computable Numbers (1936)","url":"https://www.cs.virginia.edu/~robins/Turing_Paper_1936.pdf","type":"primary / scholarly"},{"label":"Poonen · Hilbert’s Tenth Problem, slides 2–4 (2006)","url":"https://math.mit.edu/~poonen/slides/h10.pdf","type":"primary / scholarly"}],"questions":["How is universal simulation encoded?","How can halting reduce to a concrete combinatorial problem?","Which statements about program behavior are decidable under restrictions?"],"approximateBirth":false,"extended":true,"readMinutes":4,"tex":"U(\\langle M,x\\rangle)=M(x)","mathSVG":"<mjx-container class=\"MathJax\" jax=\"SVG\" display=\"true\"><svg style=\"vertical-align: -0.566ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"18.383ex\" height=\"2.262ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -750 8125.2 1000\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"mi\"><path data-c=\"1D448\" d=\"M107 637Q73 637 71 641Q70 643 70 649Q70 673 81 682Q83 683 98 683Q139 681 234 681Q268 681 297 681T342 682T362 682Q378 682 378 672Q378 670 376 658Q371 641 366 638H364Q362 638 359 638T352 638T343 637T334 637Q295 636 284 634T266 623Q265 621 238 518T184 302T154 169Q152 155 152 140Q152 86 183 55T269 24Q336 24 403 69T501 205L552 406Q599 598 599 606Q599 633 535 637Q511 637 511 648Q511 650 513 660Q517 676 519 679T529 683Q532 683 561 682T645 680Q696 680 723 681T752 682Q767 682 767 672Q767 650 759 642Q756 637 737 637Q666 633 648 597Q646 592 598 404Q557 235 548 205Q515 105 433 42T263 -22Q171 -22 116 34T60 167V183Q60 201 115 421Q164 622 164 628Q164 635 107 637Z\"><\/path><\/g><g data-mml-node=\"mo\" transform=\"translate(767,0)\"><path data-c=\"28\" d=\"M94 250Q94 319 104 381T127 488T164 576T202 643T244 695T277 729T302 750H315H319Q333 750 333 741Q333 738 316 720T275 667T226 581T184 443T167 250T184 58T225 -81T274 -167T316 -220T333 -241Q333 -250 318 -250H315H302L274 -226Q180 -141 137 -14T94 250Z\"><\/path><\/g><g data-mml-node=\"mo\" transform=\"translate(1156,0)\"><path data-c=\"27E8\" d=\"M333 -232Q332 -239 327 -244T313 -250Q303 -250 296 -240Q293 -233 202 6T110 250T201 494T296 740Q299 745 306 749L309 750Q312 750 313 750Q331 750 333 732Q333 727 243 489Q152 252 152 250T243 11Q333 -227 333 -232Z\"><\/path><\/g><g data-mml-node=\"mi\" transform=\"translate(1545,0)\"><path data-c=\"1D440\" d=\"M289 629Q289 635 232 637Q208 637 201 638T194 648Q194 649 196 659Q197 662 198 6  times this probability is below one, some graph has neither.","math":"C(n,k) · 2^{1−C(k,2)} < 1"},{"title":"Local simplicity, global difficulty","text":"Erdős proved that graphs can simultaneously have arbitrarily large girth and chromatic number. A random construction creates few short cycles and a small independence number; deleting selected vertices removes the cycles while retaining a large chromatic lower bound.","math":"χ(G) ≥ |V(G)| / α(G)"},{"title":"What the theorem does not control","text":"This unrestricted construction does not settle high-girth coloring questions at one fixed small maximum degree. Keeping degree bounded is an extra structural demand. With Rényi, Erdős also developed the systematic study of phase transitions in random graphs.","math":"large girth + high chromatic number ≠ a fixed-degree construction"}],"sources":[{"label":"MacTutor · historical biography","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Erdos/","type":"biography"}],"questions":["How do you balance short-cycle counts against independence number?","When can conditional expectations derandomize an existence proof?","What changes when maximum degree is fixed in advance?"],"approximateBirth":false,"extended":true,"readMinutes":3,"tex":"\\mathbb{E}[X]<1\\quad\\Longrightarrow\\quad\\Pr[X=0]>0","mathSVG":"<mjx-container class=\"MathJax\" jax=\"SVG\" display=\"true\"><svg style=\"vertical-align: -0.566ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"32.24ex\" height=\"2.262ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -750 14250.2 1000\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"TeXAtom\" data-mjx-texclass=\"ORD\"><g data-mml-node=\"mi\"><path data-c=\"1D53C\" d=\"M12 666Q12 675 24 683H582Q590 680 593 672V588Q593 514 591 502T575 490Q567 490 563 495T555 517Q552 556 517 590Q486 623 445 634T340 648H282Q266 636 264 620T260 492V370H277Q329 375 358 391T404 439Q420 480 420 506 rry forward","text":"A linear program has geometric structure that can be exploited algorithmically. Simplex is highly influential despite exponential worst-case examples.","math":"maximize cᵀx subject to Ax≤b"}],"sources":[{"label":"MacTutor · historical biography","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Dantzig/","type":"biography"}],"questions":["What is the simplest example of linear optimization at scale?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Claude Shannon","id":"shannon","born":1916,"field":"information","title":"Information becomes a quantity","bio":"Shannon linked Boolean algebra to switching circuits and founded information theory. Entropy, channel capacity and coding theorems made communication limits mathematically precise.","formula":"H(X) = −Σₓ p(x) log₂ p(x)","impact":"Entropy measures average information under a distribution. For an independent identically distributed source, it controls asymptotic lossless compression rates.","ref":"Shannon","sections":[{"title":"The right unit of information","text":"An outcome of probability p has surprisal −log₂p. Averaging this over the source distribution gives entropy. A highly biased bit has entropy below one because its outcome is usually predictable.","math":"H(X) = −Σₓ p(x) log₂ p(x)","tex":"H(X)=-\\sum_x p(x)\\log_2 p(x)"},{"title":"Two limits, not one","text":"Source coding concerns how far information can be compressed. Channel coding concerns how fast it can be transmitted reliably through noise. For a discrete memoryless channel, rates strictly below capacity allow codes with error tending to zero as block length grows.","math":"R < C ⇒ error → 0"},{"title":"Where graph theory enters","text":"Zero-error communication is a different requirement from vanishing error. Confusability can be represented by a graph, leading to Shannon capacity and Lovász’s solution for the five-cycle.","math":"Θ(C₅) = √5"},{"title":"Try a code before taking a limit","text":"Send one bit using 000 or 111. Majority decoding repairs one flipped position, at the cost of a rate of 1/3 information bit per transmitted bit. This finite example belongs to error correction. It makes the role of redundancy tangible before a channel-capacity theorem asks which rates are possible with increasingly long blocks.\n\nHamming’s profile takes this geometric view further. Blackwell’s profile asks another question: whether the received observation supports every decision available from a better one. Neither comparison turns entropy into a measure of meaning."}],"sources":[{"label":"MacTutor · historical biography","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Shannon/","type":"biography"},{"label":"Hamming · Error Detecting and Error Correcting Codes (1950)","url":"https://ineffectivetheory.com/edu/papers/hamming-codes-1950.pdf","type":"primary / scholarly"},{"label":"Blackwell · Equivalent Comparisons of Experiments (1953), abstract and publication record","url":"https://celebratio.org/Blackwell_DH/article/255/","type":"primary / scholarly"},{"label":"Shannon · A Mathematical Theory of Communication (1948)","url":"https://people.math.harvard.edu/~ctm/home/text/others/shannon/entropy/entropy.pdf","type":"primary / scholarly"},{"label":"Lovász · On the Shannon Capacity of a Graph (1979)","url":"https://www.sfu.ca/~mdevos/notes/semidef/lovasz-theta.pdf","type":"primary / scholarly"}],"questions":["How does typical-set compression work?","Why are zero-error and vanishing-error capacity different?","How can a graph encode confusable symbols?"],"approximateBirth":false,"extended":true,"readMinutes":4,"tex":"H(X)=-\\sum_x p(x)\\log_2 p(x)","mathSVG":"<mjx-container class=\"MathJax\" jax=\"SVG\" display=\"true\"><svg style=\"vertical-align: -2.619ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"27.513ex\" height=\"4.769ex\" role=\"img\" focusable=\ on studied decision-making, bounded rationality and artificial intelligence. With Allen Newell he built influential models of heuristic problem solving.","formula":"limited resources → bounded rationality","impact":"A decision-maker may seek a satisfactory solution rather than solve an idealized global optimization problem. This connects cognitive modeling with computational constraints.","ref":"Simon","sections":[{"title":"The idea to carry forward","text":"A decision-maker may seek a satisfactory solution rather than solve an idealized global optimization problem. This connects cognitive modeling with computational constraints.","math":"limited resources → bounded rationality"}],"sources":[{"label":"Computer science as empirical inquiry: Symbols and search · Newell and Simon","url":"https://doi.org/10.1145/360018.360022","type":"paper"},{"label":"ACM · Herbert Simon","url":"https://amturing.acm.org/award_winners/simon_1031467.cfm","type":"research"}],"questions":["What is the simplest example of intelligence as problem solving?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"W. T. Tutte","id":"tutte","born":1917,"field":"graphs","title":"The structure of matchings and flows","bio":"Tutte established foundational results in graph theory, including a characterization of graphs with perfect matchings. His work shaped chromatic and flow theory.","formula":"odd(G−S) ≤ |S| for every S⊆V(G)","impact":"A finite graph has a perfect matching exactly when every deleted vertex set leaves at most that many odd components. The condition reveals global obstructions to pairing.","ref":"Tutte","sections":[{"title":"The idea to carry forward","text":"A finite graph has a perfect matching exactly when every deleted vertex set leaves at most that many odd components. The condition reveals global obstructions to pairing.","math":"odd(G−S) ≤ |S| for every S⊆V( ard","text":"Selection, projection and join describe data manipulation algebraically. The relational viewpoint reshaped database design and query languages.","math":"σ, π, ⋈"}],"sources":[{"label":"Relational database: A practical foundation for productivity · Codd","url":"https://doi.org/10.1145/358396.358400","type":"paper"},{"label":"ACM · Edgar F. Codd","url":"https://amturing.acm.org/award_winners/codd_1000892.cfm","type":"research"}],"questions":["What is the simplest example of data as relations?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"John Backus","id":"backus","born":1924,"field":"systems","title":"High-level programming","bio":"Backus led the team that developed FORTRAN and helped shape programming-language notation. He later advocated function-level programming.","formula":"program meaning ≠ machine layout","impact":"An effective high-level language can express scientific computation while allowing compilation to efficient machine code. Language design itself became a serious theoretical discipline.","ref":"Backus","sections":[{"title":"The idea to carry forward","text":"An effective high-level language can express scientific computation while allowing compilation to efficient machine code. Language design itself became a serious theoretical discipline.","math":"program meaning ≠ machine layout"}],"sources":[{"label":"Can programming be liberated from the von Neumann style? · Backus","url":"https://doi.org/10.1145/359576.359579","type":"paper"},{"label":"ACM · John Backus","url":"https://amturing.acm.org/award_winners/backus_0703524.cfm","type":"research"}],"questions":["What is the simplest example of high-level programming?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Jean-Pierre Serre","id" ic family to be studied over Q and over finite fields through changes of base.","math":"X → Spec(Z)"},{"title":"Look through every test ring","text":"For X=Spec(A), its R-points are ring homomorphisms A→R, with the appropriate base compatibility. This functor-of-points viewpoint shifts attention from isolated coordinates to how a space interacts with all test objects.","math":"X(R) = Hom(A,R)"},{"title":"The scope of the legacy","text":"Schemes and étale cohomology transformed arithmetic geometry. Geometric complexity theory uses algebraic geometry and invariant theory, but a direct historical claim that Grothendieck invented GCT would be wrong.","math":"structural geometry → arithmetic and cohomological methods"}],"sources":[{"label":"MacTutor · historical biography","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Grothendieck/","type":"biography"}],"questions":["Why does a nilpotent element carry geometric information?","What does changing the base from Z to Fₚ do?","What do orbit closures mean in algebraic complexity?"],"approximateBirth":false,"extended":true,"readMinutes":3,"tex":"X=\\operatorname{Spec}(A)","mathSVG":"<mjx-container class=\"MathJax\" jax=\"SVG\" display=\"true\"><svg style=\"vertical-align: -0.566ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"12.927ex\" height=\"2.262ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -750 5713.6 1000\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"mi\"><path data-c=\"1D44B\" d=\"M42 0H40Q26 0 26 11Q26 15 29 27Q33 41 36 43T55 46Q141 49 190 98Q200 108 306 224T411 342Q302 620 297 625Q288 636 234 637H206Q200 643 200 645T202 664Q206 677 212 683H226Q260 681 347 681Q380 681 408 681T453 682T473 682Q490 682 490 671Q490 670 488 658Q484 643 481 640T465 637Q434 634 411 620L488 426L541 485Q646 598 646 610Q646 628 622 635Q617 635 609 637Q594 637 594 648Q594 650 596 664Q600 677 606 683H618Q619 683 643 683T697 681T738 680Q8
