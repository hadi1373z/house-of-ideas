 749L64 750Q69 750 74 750H86L114 726Q208 641 251 514T294 250Q294 182 284 119T261 12T224 -76T186 -143T145 -194T113 -227T90 -246Q87 -249 86 -250H74Q66 -250 63 -250T58 -247T55 -238Q56 -237 66 -225Q221 -64 221 250T66 725Q56 737 55 738Q55 746 60 749Z\"><\/path><\/g><\/g><\/g><\/svg><\/mjx-container>"},{"name":"Michael Atiyah","id":"atiyah","born":1929,"field":"geometry","title":"Analysis detects topology","bio":"Atiyah helped develop topological K-theory and, with Isadore Singer, proved the index theorem. The result connects differential operators with topological data.","formula":"analytic index = topological index","impact":"An analytic count involving the kernel and cokernel of an elliptic operator can be computed from geometric-topological invariants.","ref":"Atiyah","sections":[{"title":"The idea to carry forward","text":"An analytic count involving the kernel and cokernel of an elliptic operator can be computed from geometric-topological invariants.","math":"analytic index = topological index"}],"sources":[{"label":"MacTutor · historical biography","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Atiyah/","type":"biography"}],"questions":["What is the simplest example of analysis detects topology?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Edsger Dijkstra","id":"dijkstra","born":1930,"field":"algorithms","title":"Algorithms with invariants","bio":"Dijkstra developed influential algorithms and methods for structured programming and correctness. His shortest-path algorithm is a model of greedy reasoning.","formula":"dist(v) = minᵤ {dist(u)+w(u,v)}","impact":"With nonnegative edge weights, the closest unsettled vertex can be finalized safely. The proof invariant is as important as the implementation.","ref":"Dijkstra","sections":[{"title":"A program needs an argument","text":"Edsger Dijkstra helped establish programming as a mathematical discipline. His work on routes, structured programs, and program derivation shares a question: what fact remains true as a computation changes its state? A useful algorithm comes with a reason its next step is safe.\n\nHis shortest-path paper appeared in 1959. Later, his work on guarded commands and weakest preconditions made the relationship between programs and proofs explicit. These are different contributions, but an invariant provides a useful way to read them together."},{"title":"Follow a route by hand","text":"Consider a directed network with edges S→A of cost 6, S→B of cost 2, B→A of cost 1, B→T of cost 7, and A→T of cost 2. We want the cheapest route from S.\n\nStart with distance 0 at S and infinity elsewhere. After examining S, the tentative distances are A=6 and B=2. Finalize B, the closest unsettled vertex. Its outgoing edges improve A to 3 and give T a tentative distance of 9. Finalize A next; its edge to T improves T to 5. The resulting route S→B→A→T costs 2+1+2=5.\n\nA tentative distance is the cost of a route already discovered, not a promise that no better route exists. Finalizing a vertex is the moment that this upper bound becomes a proven optimum.","math":"d(v) ← min(d(v), d(u) + w(u,v))"},{"title":"Why the smallest tentative distance is safe","text":"Assume every edge weight is nonnegative. Keep the invariant that finalized vertices have their true shortest distances, and that outgoing edges from them have been examined. Let u have the smallest finite tentative distance among unsettled vertices. If a cheaper route to u existed, take its first unsettled vertex x. Its predecessor was finalized, so relaxation already gave x a tentative distance no larger than that route’s prefix. Nonnegative remaining edges make this prefix no more expensive than the whole route to u. That would give x a tentative distance smaller than u’s, contradicting the choice of u.\n\nThis proof explains the hypothesis. With edges S→A=2, S→B=5, and B→A=−4, finalizing A at 2 is premature: S→B→A costs 1. There is no negative cycle in this example; one negative edge is enough to break the argument."},{"title":"The proof can guide the design","text":"Dijkstra’s weakest precondition wp(C,Q) describes exactly which initial states guarantee that program C terminates with result condition Q. For an assignment x:=x+1 and desired result x>10 over mathematical integers, the weakest precondition is x>9. Work backward from what must hold afterward to what must hold beforehand.\n\nHis guarded-command paper explicitly credits Hoare’s use of predicates to describe states. The distinction to watch is termination: a partial-correctness claim permits nontermination, whereas this weakest-precondition interpretation guarantees a terminating computation."},{"title":"Where to go next","text":"Read Hoare for the rules that organize an invariant into a program proof. Read Bellman to compare methods that repeatedly improve distance estimates with Dijkstra’s irrevocable finalization. Read Cook to change the question from “why does this algorithm work?” to “what would an efficient algorithm for this whole problem class imply?” These are conceptual reading connections, not claims that one theorem historically caused another."}],"sources":[{"label":"Dijkstra · retrospective on his 1959 graph paper","url":"https://www.cs.utexas.edu/~EWD/ewd08xx/EWD841a.PDF","type":"primary"},{"label":"Dijkstra · Guarded commands, non-determinacy and formal derivation of programs","url":"https://www.cs.utexas.edu/~EWD/transcriptions/EWD04xx/EWD472.html","type":"primary"}],"questions":["In the five-edge example, what changes if B→A has cost 10? Which distances become final in which order, and why?","Can you strengthen the shortest-path invariant to prove that following stored predecessor pointers reconstructs an optimal route, including when some edge weights are zero?","For a program that searches an unbounded space, what separates a precondition guaranteeing a correct answer if it returns from one guaranteeing that it returns?"],"approximateBirth":false,"extended":true,"readMinutes":5},{"name":"Michael Rabin","id":"rabin","born":1931,"field":"complexity","title":"Randomness as an algorithmic resource","bio":"Rabin contributed to automata theory, logic, randomized algorithms and cryptography. His primality test made probabilistic computation a practical mathematical tool.","formula":"random test + repetition → controlled error","impact":"An algorithm can have a rigorous error guarantee without being deterministic. The distribution and independence assumptions are part of the guarantee.","ref":"Rabin","sections":[{"title":"The idea to carry forward","text":"An algorithm can have a rigorous error guarantee without being deterministic. The distribution and independence assumptions are part of the guarantee.","math":"random test + repetition → controlled error"}],"sources":[{"label":"Finite automata and their decision problems · Rabin and Scott","url":"https://doi.org/10.1147/rd.32.0114","type":"paper"},{"label":"ACM · Michael Rabin","url":"https://amturing.acm.org/award_winners/rabin_9681074.cfm","type":"research"}],"questions":["What is the simplest example of randomness as an algorithmic resource?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Dana Scott","id":"scott","born":1932,"field":"logic","title":"Meaning for recursive programs","bio":"Scott contributed to automata theory, logic and the mathematical semantics of programming languages. Domain theory supplies ordered spaces in which recursive definitions have meanings.","formula":"f = F(f)","impact":"A recursive specification is a fixed-point equation. Suitable ordered structures allow a least solution to be built from increasing approximations.","ref":"Scott","sections":[{"title":"The idea to carry forward","text":"A recursive specification is a fixed-point equation. Suitable ordered structures allow a least solution to be built from increasing approximations.","math":"f = F(f)"}],"sources":[{"label":"Logic and programming languages · Scott","url":"https://doi.org/10.1145/359810.359826","type":"paper"},{"label":"ACM · Dana Scott","url":"https://amturing.acm.org/award_winners/scott_1193622.cfm","type":"research"}],"questions":["What is the simplest example of meaning for recursive programs?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"C. A. R. Hoare","id":"hoare","born":1934,"field":"systems","title":"Programs as mathematical claims","bio":"Hoare introduced a logic for program correctness and developed influential algorithms, including quicksort. His logic separates preconditions, execution and postconditions.","formula":"{P} C {Q}","impact":"A Hoare triple expresses that, when C terminates from a state satisfying P, the resulting state satisfies Q. Termination requires additional reasoning for total correctness.","ref":"Hoare","sections":[{"title":"Make the claim precise","text":"C. A. R. Hoare’s 1969 paper gave a logical framework for reasoning about programs through assertions about their states. A proof can be assembled from rules for assignments, sequences, conditionals, and loops. This turns “the program works” into a claim with explicit assumptions and a specific promised result.\n\nWrite {P} C {Q}. Here P is a precondition, C a program, and Q a postcondition. In partial correctness, the claim is: every terminating execution of C that starts in a state satisfying P ends in a state satisfying Q. It does not by itself establish that execution terminates.","math":"{P} C {Q}"},{"title":"An assignment changes which condition you need","text":"Suppose the program is x:=x+1 and the desired result is x=8. The old value must be 7. The assignment rule obtains this by substituting the expression x+1 for x in the desired postcondition: x+1=8.\n\nFor two assignments x:=x+1; y:=2*x, a starting value x=7 guarantees y=16. First establish x=8, then use that fact as the next command’s precondition. The intermediate assertion connects two small proofs into one larger proof. These examples assume mathematical integers; machine overflow would require a different arithmetic model or additional bounds."},{"title":"Prove a complete loop","text":"Consider a program that sums the first n nonnegative integers, where n is a fixed nonnegative integer. Initialize i:=0 and s:=0. While i<n, execute i:=i+1 followed by s:=s+i. The desired final result is s=n(n+1)/2.\n\nChoose the invariant 0≤i≤n and s=i(i+1)/2. Initialization establishes it because both i and s are zero. For preservation, call the old value of i k. The body first sets i=k+1, then adds k+1 to s. The new sum is k(k+1)/2+(k+1)=(k+1)(k+2)/2, exactly the formula required for the new i. The guard k<n also ensures i≤n afterward.\n\nAt exit, i<n is false. Together with i≤n, this gives i=n, so the invariant implies the desired answer. For n=3, the successive pairs (i,s) are (0,0), (1,1), (2,3), and (3,6).","math":"Invariant: 0 ≤ i ≤ n and s = i(i+1)/2"},{"title":"A correct result and a terminating program","text":"The loop proof needs one more argument for total correctness. The quantity n−i is a nonnegative integer at every loop head and decreases by one on each iteration. It cannot decrease forever, so the loop terminates. This decreasing measure is often called a variant.\n\nContrast the loop “while true do skip.” A partial-correctness statement about its final state can hold vacuously because no execution reaches a final state. This is why the word “terminating” in the meaning of a Hoare triple matters. A useful specification should make clear whether eventual completion is part of the promise."},{"title":"What the proof actually certifies","text":"A proof establishes a chosen specification under a chosen model. The summation proof assumes that n does not change and that arithmetic has no overflow. It also proves only the stated sum, not an unstated promise about memory usage or execution speed. Writing these boundaries down is part of correctness, not an optional footnote.\n\nDijkstra’s weakest preconditions provide a complementary backward view: start from the result and derive acceptable initial states. Turing provides a different boundary, showing why no general algorithm can decide termination for every arbitrary program and input. That limitation does not prevent us from proving termination of particular programs, as the decreasing measure above demonstrates."}],"sources":[{"label":"Hoare · An Axiomatic Basis for Computer Programming (1969)","url":"https://www.cs.cmu.edu/~crary/819-f09/Hoare69.pdf","type":"primary"},{"label":"Dijkstra · weakest preconditions, invariants and termination","url":"https://www.cs.utexas.edu/~EWD/transcriptions/EWD04xx/EWD472.html","type":"primary"}],"questions":["If the summation loop adds i to s before incrementing i, what result does it compute, and which invariant describes that different program?","What upper bound on n would make the same calculation safe using a fixed-width integer type, including the intermediate multiplication in n(n+1)?","Can a loop have a simple invariant but require a more subtle termination argument? Construct an example and identify a well-founded decreasing measure."],"approximateBirth":false,"extended":true,"readMinutes":5},{"name":"Jack Edmonds","id":"edmonds","born":1934,"field":"graphs","title":"The moment efficiency became mathematics","bio":"Jack Edmonds helped establish combinatorial optimization as a meeting point of graph theory, linear programming, convex geometry and algorithms. His work made efficient construction, not merely abstract existence, a central mathematical objective. [1]","formula":"matching = augmenting paths + blossoms; odd-set inequalities restore integrality","impact":"The blossom algorithm, matching polytope and matroid greedy theorem reveal three faces of a strategy: identify the obstruction, express its structure, and exploit it algorithmically.","ref":"Edmonds","sections":[{"title":"Matching: why odd cycles matter","text":"Let M be a matching in a finite loopless graph. An augmenting path alternates between edges outside and inside M, with unmatched endpoints. Flipping membership along the path produces M △ E(P), a matching with one more edge. Berge's criterion says that M is maximum exactly when no augmenting path exists.\n\nBipartite graphs allow a comparatively direct alternating search. In a general graph, the search can encounter an odd alternating cycle. Edmonds's 1965 paper Paths, Trees, and Flowers handles this obstruction by contracting an appropriately rooted blossom, continuing the search, and later expanding it to recover an augmenting path in the original graph. [2]\n\nThe matching and search-tree conditions matter: this is not permission to contract an arbitrary odd cycle. For a blossom found by the alternating search, contraction preserves the relevant augmenting-path problem. Nested blossoms can be handled recursively, giving a polynomial-time maximum-cardinality matching algorithm.\n\nThe general lesson is to compress a precisely identified obstruction while preserving the question being solved.","math":"|M △ E(P)| = |M| + 1","tex":"|M\\triangle E(P)|=|M|+1"},{"title":"The same obstruction becomes an inequality","text":"Write a matching as its edge-incidence vector x. Every such vector satisfies x_e ≥ 0 and x(δ(v)) ≤ 1 for each vertex v. These obvious constraints are not enough: on a triangle, assigning 1/2 to each edge satisfies all vertex constraints but has total weight 3/2, whereas a matching contains at most one edge.\n\nIf S is any odd vertex set, a matching uses at most (|S|−1)/2 edges internal to S. Edmonds proved that adding all these odd-set inequalities gives exactly the convex hull of matchings. [3]\n\nThus an algorithmic obstruction and a geometric obstruction have the same origin. Blossoms explain why the alternating search needs extra machinery; odd sets explain why the first linear relaxation is fractional. This is a foundational example of polyhedral combinatorics: study the convex body whose vertices encode the desired discrete objects.","math":"P_match(G) = {x ≥ 0 : x(δ(v)) ≤ 1 for every v; x(E(S)) ≤ (|S|−1)/2 for every odd S}"},{"title":"Matroids: when greedy is a theorem","text":"A matroid (E,I) is a finite independence system closed under taking subsets and satisfying exchange: if A,B are independent and |A| < |B|, some b in B∖A can be added to A while preserving independence.\n\nSort the elements by decreasing weight and add an element whenever independence is preserved. For a matroid this finds a maximum-weight basis, for arbitrary real weights. For maximum-weight independent sets, use nonnegative weights or skip negative-weight elements. This qualification prevents greedy from needlessly adding costly elements.\n\nThe Rado–Edmonds characterization shows that universal success of the appropriate greedy rule characterizes matroid structure among hereditary independence systems. Edmonds's 1971 paper makes the link to optimization and polyhedra explicit. [4]\n\nGraphic matroids recover the spanning-tree setting; linear matroids recover linear independence. The abstract exchange axiom explains why apparently different greedy algorithms work.","math":"A,B ∈ I and |A| < |B| ⇒ ∃b ∈ B∖A with A ∪ {b} ∈ I"},{"title":"Why polynomial time became the standard","text":"There can be exponentially many matchings. Edmonds nevertheless looked for a procedure whose work is bounded by a polynomial in the input size. His matching papers helped turn this demand into a systematic mathematical theory of efficient combinatorial algorithms. [1,2]\n\nThis does not mean every polynomial is practical, or every exponential algorithm useless. Polynomial time is a robust structural benchmark: changing reasonable encodings and composing efficient procedures usually preserves it.\n\nThe conceptual advance is the separation of three questions: does an object exist, can a proposed answer be checked, and can a correct answer be found efficiently? Edmonds's positive algorithms complemented the later Cook–Karp program of hardness reductions."},{"title":"The link to approximation algorithms","text":"The blossom algorithm tells us to understand the obstruction to search. The matching polytope tells us to express that obstruction by inequalities. Matroid theory tells us to locate the structural axiom behind an algorithmic principle.\n\nThese are useful guides when exact structure is lost. If a relaxation is fractional, one studies its integrality gap and rounding. If exchange is weaker, greedy may yield only an approximation. The connections to Lovász's convex methods and Goemans–Williamson rounding are conceptual reading links, not claims that one paper directly caused every later algorithm."}],"sources":[{"label":"[1] NIST: Edmonds and efficient combinatorial algorithms","url":"https://www.nist.gov/mathematics-statistics/first-mathematical-theory-efficient-combinatorial-algorithms-jack-edmonds","type":"primary source"},{"label":"[2] Edmonds (1965), Paths, Trees, and Flowers","url":"https://doi.org/10.4153/CJM-1965-045-4","type":"primary source"},{"label":"[3] Edmonds (1965), Maximum matching and a polyhedron with 0,1-vertices","url":"https://doi.org/10.6028/jres.069B.013","type":"primary source"},{"label":"[4] Edmonds (1971), Matroids and the greedy algorithm","url":"https://doi.org/10.1007/BF01584082","type":"primary source"}],"questions":["Should the next profile stay with combinatorial optimization or return to graph limits and infinite graphs?","Would a proof-centered mathematician or someone known for a major algorithmic paradigm be more useful next?","Should the next profile go deeper into polyhedral methods, matroids, or approximation algorithms?"],"approximateBirth":false,"extended":true,"readMinutes":6},{"name":"Robin Milner","id":"milner","born":1934,"field":"systems","title":"Types, proofs and communication","bio":"Milner contributed to automated reasoning, programming-language design and concurrency theory. His work includes LCF, ML and process calculi.","formula":"P ∣ Q","impact":"Concurrent processes interact rather than execute as one sequential thread. His formalisms let researchers reason systematically about communication and behavior.","ref":"Milner","sections":[{"title":"The idea to carry forward","text":"Concurrent processes interact rather than execute as one sequential thread. His formalisms let researchers reason systematically about communication and behavior.","math":"P ∣ Q"}],"sources":[{"label":"Elements of interaction · Milner","url":"https://doi.org/10.1145/151233.151240","type":"paper"},{"label":"ACM · Robin Milner","url":"https://amturing.acm.org/award_winners/milner_1569367.cfm","type":"research"}],"questions":["What is the simplest example of types, proofs and communication?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Richard Karp","id":"karp","born":1935,"field":"complexity","title":"A network of hard problems","bio":"Karp's 1972 paper established NP-completeness for 21 natural combinatorial problems. He also made major contributions to algorithms and randomization.","formula":"A ≤ₚ B","impact":"A polynomial-time reduction transfers an efficient algorithm for B into one for A. Starting with Cook–Levin, reductions made hardness reusable across mathematical domains.","ref":"Karp","sections":[{"title":"Cook–Levin supplies the starting point","text":"Cook–Levin encodes arbitrary NP computations as satisfiability. Karp then used reductions among concrete problems to establish widespread NP-completeness. The direction matters: to show B is hard, reduce a known hard A to B.","math":"A ≤ₚ B and B∈P ⇒ A∈P"},{"title":"A reduction you can check","text":"A k-clique in G is an independent set of size k in its complement. The complement of an independent set is a vertex cover. Thus the instance (G,k) becomes (Ḡ,n−k) for Vertex Cover.","math":"CLIQUE(G,k) ⇔ VERTEX-COVER(Ḡ,n−k)"},{"title":"The implication, not an unconditional lower bound","text":"NP-completeness says a polynomial-time exact algorithm would imply P=NP. It is not a proof of exponential running time. The framework motivates approximation, parameterization and special-case algorithms. Karp’s later randomized work includes string fingerprints with Rabin.","math":"hardness classification → a better algorithmic question"}],"sources":[{"label":"ACM · Richard Karp and computational complexity","url":"https://amturing.acm.org/award_winners/karp_3256708.cfm","type":"research"}],"questions":["Can you verify both directions of the clique reduction?","What must an approximation-preserving reduction preserve?","How does a randomized fingerprint avoid reading two objects repeatedly?"],"approximateBirth":false,"extended":true,"readMinutes":3,"tex":"A\\leq_{\\mathrm p}B","mathSVG":"<mjx-container class=\"MathJax\" jax=\"SVG\" display=\"true\"><svg style=\"vertical-align: -0.65ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"7.508ex\" height=\"2.27ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -716 3318.7 1003.2\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"mi\"><path data-c=\"1D434\" d=\"M208 74Q208 50 254 46Q272 46 272 35Q272 34 270 22Q267 8 264 4T251 0Q249 0 239 0T205 1T141 2Q70 2 50 0H42Q35 7 35 11Q37 38 48 46H62Q132 49 164 96Q170 102 345 401T523 704Q530 716 547 716H555H572Q578 707 578 706L606 383Q634 60 636 57Q641 46 701 46Q726 46 726 36Q726 34 723 22Q720 7 718 4T704 0Q701 0 690 0T651 1T578 2Q484 2 455 0H443Q437 6 437 9T439 27Q443 40 445 43L449 46H469Q523 49 533 63L521 213H283L 122L240 52Q240 48 252 48T333 46Q422 46 429 47Q491 54 543 105T595 229Z\"><\/path><\/g><\/g><\/g><\/svg><\/mjx-container>"},{"name":"Robert Floyd","id":"floyd","born":1936,"field":"algorithms","title":"Proving programs correct","bio":"Floyd developed foundational approaches to program verification and influential algorithms. His work ties assertions about program states to control flow.","formula":"invariant + progress → correctness","impact":"An invariant explains what remains true through a computation. A separate progress argument is needed to establish termination.","ref":"Floyd","sections":[{"title":"The idea to carry forward","text":"An invariant explains what remains true through a computation. A separate progress argument is needed to establish termination.","math":"invariant + progress → correctness"}],"sources":[{"label":"The paradigms of programming · Floyd","url":"https://doi.org/10.1145/359138.359140","type":"paper"},{"label":"ACM · Robert Floyd","url":"https://amturing.acm.org/award_winners/floyd_3720707.cfm","type":"research"}],"questions":["What is the simplest example of proving programs correct?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Judea Pearl","id":"pearl","born":1936,"field":"information","title":"From association to intervention","bio":"Pearl developed influential methods for probabilistic reasoning and causal inference. Bayesian networks and structural causal models express different kinds of dependence.","formula":"Pr(Y ∣ do(X=x))","impact":"An intervention changes the mechanism generating X rather than merely conditioning on its observed value. Causal conclusions require assumptions encoded in the model.","ref":"Pearl","sections":[{"title":"The idea to carry forward","text":"An intervention changes the mechanism generating X rather than merely conditioning on its observed value. Causal conclusions require assumptions encoded in the model.","math":"Pr(Y ∣ do(X=x))"}],"sources":[{"label":"Causality · author’s research page","url":"https://bayes.cs.ucla.edu/","type":"research"}],"questions":["What is the simplest example of from association to intervention?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Donald Knuth","id":"knuth","born":1938,"field":"algorithms","title":"The analysis of algorithms","bio":"Knuth systematized algorithmic knowledge in The Art of Computer Programming. He also created TeX and developed literate programming.","formula":"algorithm + proof + cost analysis","impact":"Correctness does not settle efficiency. Knuth's work combines implementation detail, combinatorial analysis and mathematical exposition.","ref":"Knuth","sections":[{"title":"The idea to carry forward","text":"Correctness does not settle efficiency. Knuth's work combines implementation detail, combinatorial analysis and mathematical exposition.","math":"algorithm + proof + cost analysis"}],"sources":[{"label":"MacTutor · historical biography","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Knuth/","type":"biography"}],"questions":["What is the simplest example of the analysis of algorithms?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Stephen Cook","id":"cook","born":1939,"field":"complexity","title":"The first universal NP problem","bio":"Cook proved that satisfiability can encode every polynomial-time nondeterministic computation. Levin independently developed closely related completeness ideas.","formula":"∀L∈NP, L ≤ₚ SAT","impact":"Cook–Levin establishes a starting point for NP-completeness. The theorem does not prove that SAT requires superpolynomial time.","ref":"Cook","sections":[{"title":"Checking and finding are different tasks","text":"Stephen Cook’s 1971 theorem made it possible to compare apparently unrelated computational problems through efficient translations. In its familiar modern formulation, Boolean satisfiability, or SAT, is NP-complete: SAT belongs to NP, and every problem in NP has a polynomial-time many-one reduction to SAT.\n\nNP describes decision problems whose yes answers have certificates of polynomial length that a deterministic algorithm can check in polynomial time. A certificate is evidence for a particular input. The definition does not supply an efficient way to discover it. Read the theorem as a bridge from arbitrary efficient verification to one common logical language."},{"title":"A certificate you can check","text":"Take the formula (a OR b) AND (NOT a OR c) AND (NOT b OR NOT c). The assignment a=true, b=false, c=true satisfies it: the three clauses become true OR false, false OR true, and true OR false. Checking the proposed assignment requires inspecting the clauses.\n\nTo find an assignment by brute force, however, one could try all 2^n assignments for n variables. This describes a simple algorithm, not a proof that every algorithm needs exponential time. The distinction between an obvious search cost and an unavoidable lower bound is central to reading complexity claims accurately."},{"title":"A reduction preserves the answer","text":"A many-one reduction maps each input x of problem A to an input f(x) of problem B in polynomial time, with x a yes-instance exactly when f(x) is a yes-instance. Thus an efficient algorithm for B would give one for A: translate, then solve. The direction matters. To show that B is at least as hard as A, reduce A to B.\n\nAs a small illustration, encode a triangle’s three-coloring problem using variables x(v,c), one for each vertex v and color c. A clause for each vertex requires at least one color. Pairwise negative clauses prohibit two colors at one vertex. For each edge and color, another clause prohibits its endpoints from both having that color. A satisfying assignment now corresponds exactly to a proper coloring. For a triangle there are nine variables, and assigning its three vertices three distinct colors satisfies all these conditions.","math":"x ∈ A ⇔ f(x) ∈ B"},{"title":"How a computation becomes a formula","text":"Cook’s proof encodes an accepting, polynomially bounded computation using Boolean variables for times, tape positions, symbols, states, and the head location. Clauses enforce a legal start, consistent configurations, legal transitions, and acceptance. The resulting formula has polynomial size and is satisfiable exactly when such a computation exists.\n\nThe original paper states its principal theorem using oracle reductions to tautologies. Its construction explicitly produces a conjunctive-normal-form formula satisfiable exactly when the machine accepts; this is the part underlying the modern SAT formulation. Keeping that distinction visible helps when moving from a textbook statement to the historical paper."},{"title":"What completeness does and does not settle","text":"SAT’s completeness says that a polynomial-time SAT algorithm would yield polynomial-time algorithms for every problem in NP. It does not prove that such an algorithm is impossible. Nor does it mean that every individual SAT instance is hard: special structure and easy cases remain possible.\n\nRead Karp next for the spread of reductions across combinatorial problems, and Levin for the independently developed completeness viewpoint. Read Dijkstra for a contrast in method: his shortest-path argument constructs an efficient solution for a specific problem under explicit assumptions. Cook provides a way to transfer the implications of a hypothetical efficient solution across an entire class."}],"sources":[{"label":"Cook · The Complexity of Theorem-Proving Procedures (1971), transcription","url":"https://www.cs.cmu.edu/~15455/resources/Cook1971-complx-thm-proof.pdf","type":"primary"}],"questions":["Write all the clauses in the triangle-coloring example. What changes if only two colors are allowed, and how can you prove that formula unsatisfiable?","If A reduces to B, which consequences follow from an efficient algorithm for B, and which do not follow merely from an efficient algorithm for A?","In the computation encoding, what breaks if local transition constraints are omitted? Can you build a satisfying assignment that invents an accepting computation?"],"approximateBirth":false,"extended":true,"readMinutes":5},{"name":"John Hopcroft","id":"hopcroft","born":1939,"field":"algorithms","title":"Efficient structure in algorithms","bio":"Hopcroft contributed to automata theory and the design and analysis of algorithms. His work with Karp and Tarjan produced fundamental graph algorithms.","formula":"O(|E|√|V|)","impact":"The Hopcroft–Karp bound for bipartite matching comes from augmenting many shortest paths in phases. A structural argument controls the number of phases.","ref":"Hopcroft","sections":[{"title":"The idea to carry forward","text":"The Hopcroft–Karp bound for bipartite matching comes from augmenting many shortest paths in phases. A structural argument controls the number of phases.","math":"O(|E|√|V|)"}],"sources":[{"label":"ACM · John Hopcroft","url":"https://amturing.acm.org/award_winners/hopcroft_1053917.cfm","type":"research"}],"questions":["What is the simplest example of efficient structure in algorithms?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Endre Szemerédi","id":"szemeredi","born":1940,"field":"graphs","title":"Order inside dense sets","bio":"Szemerédi proved that every positive-density set of integers contains arbitrarily long arithmetic progressions. He also introduced the graph regularity lemma.","formula":"a, a+d, …, a+(k−1)d","impact":"Density can force organized patterns without periodicity. His results reshaped extremal combinatorics and connected it with ergodic and additive methods.","ref":"Szemeredi","sections":[{"title":"The idea to carry forward","text":"Density can force organized patterns without periodicity. His results reshaped extremal combinatorics and connected it with ergodic and additive methods.","math":"a, a+d, …, a+(k−1)d"}],"sources":[{"label":"MacTutor · historical biography","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Szemeredi/","type":"biography"}],"questions":["What is the simplest example of order inside dense sets?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Pierre Deligne","id":"deligne","born":1944,"field":"geometry","title":"The Weil conjectures","bio":"Deligne proved the remaining Riemann-hypothesis part of the Weil conjectures using the cohomological framework developed by Grothendieck and others.","formula":"|α| = q^{i/2}","impact":"Frobenius eigenvalues on the relevant cohomology have prescribed magnitudes. This links point counts over finite fields with deep geometric structure.","ref":"Deligne","sections":[{"title":"The idea to carry forward","text":"Frobenius eigenvalues on the relevant cohomology have prescribed magnitudes. This links point counts over finite fields with deep geometric structure.","math":"|α| = q^{i/2}","tex":"|\\alpha|=q^{i/2}","mathSVG":"<mjx-container class=\"MathJax\" jax=\"SVG\" display=\"true\"><svg style=\"vertical-align: -0.564ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"9.218ex\" height=\"2.699ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -943.3 4074.3 1192.8\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"mo\" transform=\"translate(0 -0.5)\"><path data-c=\"7C\" d=\"M139 -249H137Q125 -249 119 -235V251L120 737Q130 750 139 750Q152 750 159 735V-235Q151 blic messages.","formula":"(gᵃ)ᵇ = (gᵇ)ᵃ","impact":"The shared algebraic value is easy for participants to obtain but should be hard for an observer to recover under the chosen group's computational assumptions.","ref":"Diffie","sections":[{"title":"The idea to carry forward","text":"The shared algebraic value is easy for participants to obtain but should be hard for an observer to recover under the chosen group's computational assumptions.","math":"(gᵃ)ᵇ = (gᵇ)ᵃ"}],"sources":[{"label":"New directions in cryptography · Diffie and Hellman","url":"https://doi.org/10.1109/TIT.1976.1055638","type":"paper"}],"questions":["What is the simplest example of secrets over a public channel?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Martin Hellman","id":"hellman","born":1945,"field":"information","title":"Public-key cryptography","bio":"Hellman, with Diffie and other contributors, helped establish modern public-key cryptography. The work changed assumptions about secure communication and prior shared secrets.","formula":"g, gᵃ, gᵇ → gᵃᵇ","impact":"The algebraic identity alone is not security. Parameter choices, protocols and computational assumptions determine whether an implementation is secure.","ref":"Hellman","sections":[{"title":"The idea to carry forward","text":"The algebraic identity alone is not security. Parameter choices, protocols and computational assumptions determine whether an implementation is secure.","math":"g, gᵃ, gᵇ → gᵃᵇ"}],"sources":[{"label":"New directions in cryptography · Diffie and Hellman","url":"https://doi.org/10.1109/TIT.1976.1055638","type":"paper"},{"label":"ACM · Martin Hellman","url":"https://amturing.acm.org/award_winners/hellman_4055781.cfm","type":"research"}],"questions":["What is the simplest example of public-key cryptography?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Leonard Adleman","id":"adleman","born":1945,"field":"information","title":"Computation across representations","bio":"Adleman co-developed RSA with Rivest and Shamir. He later demonstrated a molecular computation using DNA to solve a small combinatorial instance.","formula":"c = mᵉ mod N","impact":"RSA uses a trapdoor-style arithmetic structure; secure encryption additionally requires an appropriate encoding protocol. Adleman's DNA work explored a very different computational substrate.","ref":"Adleman","sections":[{"title":"The idea to carry forward","text":"RSA uses a trapdoor-style arithmetic structure; secure encryption additionally requires an appropriate encoding protocol. Adleman's DNA work explored a very different computational substrate.","math":"c = mᵉ mod N"}],"sources":[{"label":"ACM · Leonard Adleman","url":"https://amturing.acm.org/award_winners/adleman_7308544.cfm","type":"research"}],"questions":["What is the simplest example of computation across representations?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Andrew Yao","id":"yao","born":1946,"field":"complexity","title":"Randomness, communication and security","bio":"Yao developed fundamental ideas in randomized algorithms, communication complexity and cryptography. His minimax principle is a central lower-bound tool.","formula":"randomized worst case ↔ distributional deterministic analysis","impact":"Under the relevant finite minimax formulation, a hard input distribution can lower-bound randomized algorithms. This changes a randomized lower bound into a distributional problem.","ref":"Yao","sections":[{"title":"The idea to carry forward","text":"Under the relevant finite minimax formulation, a hard input distribution can lower-bound randomized algorithms. This changes a randomized lower bound into a distributional problem.","math":"randomized worst case ↔ distributional deterministic analysis"}],"sources":[{"label":"ACM · Andrew Yao","url":"https://amturing.acm.org/award_winners/yao_1611524.cfm","type":"research"}],"questions":["What is the simplest example of randomness, communication and security?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"William Thurston","id":"thurston","born":1946,"field":"geometry","title":"Three-dimensional geometry","bio":"Thurston transformed low-dimensional topology through hyperbolic geometry and the geometrization program. He showed how geometry can organize the classification of three-manifolds.","formula":"topological decomposition → geometric pieces","impact":"A complicated manifold can be studied through canonical pieces carrying geometric structures. Perelman's later work completed geometrization via Ricci flow.","ref":"Thurston","sections":[{"title":"The idea to carry forward","text":"A complicated manifold can be studied through canonical pieces carrying geometric structures. Perelman's later work completed geometrization via Ricci flow.","math":"topological decomposition → geometric pieces"}],"sources":[{"label":"MacTutor · historical biography","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Thurston/","type":"biography"}],"questions":["What is the simplest example of three-dimensional geometry?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Alain Connes","id":"connes","born":1947,"field":"geometry","title":"Geometry without commuting coordinates","bio":"Connes developed noncommutative geometry and major parts of operator-algebra theory. Algebraic structures become geometric objects even when multiplication is noncommutative.","formula":"ab ≠ ba","impact":"Replacing functions on a space by a noncommutative algebra extends geometric reasoning to new settings. The connection also reaches mathematical physics and quantum theory.","ref":"Connes","sections":[{"title":"The idea to carry forward","text":"Replacing functions on a space by a noncommutative algebra extends geometric reasoning to new settings. The connection also reaches mathematical physics and quantum theory.","math":"ab ≠ ba"}],"sources":[{"label":"MacTutor · historical biography","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Connes/","type":"biography"}],"questions":["What is the simplest example of geometry without commuting coordinates?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Ron Rivest","id":"rivest","born":1947,"field":"information","title":"Public-key algorithms","bio":"Rivest co-developed RSA and contributed broadly to algorithms and cryptography. His work connects computational difficulty with practical constructions.","formula":"m ↦ mᵉ mod N","impact":"A public transformation can be easy to apply while reversal requires secret information or a hard computation. Bare algebraic RSA is not a complete secure encryption protocol.","ref":"Rivest","sections":[{"title":"The idea to carry forward","text":"A public transformation can be easy to apply while reversal requires secret information or a hard computation. Bare algebraic RSA is not a complete secure encryption protocol.","math":"m ↦ mᵉ mod N"}],"sources":[{"label":"ACM · Ron Rivest","url":"https://amturing.acm.org/award_winners/rivest_1403005.cfm","type":"research"}],"questions":["What is the simplest example of public-key algorithms?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Leonid Levin","id":"levin","born":1948,"field":"complexity","title":"Universal search and completeness","bio":"Levin independently established foundational completeness results and developed algorithmic information theory and average-case complexity.","formula":"search + verification + resource bounds","impact":"Worst-case difficulty and typical-instance difficulty are different. Levin's frameworks make the input distribution and verification process part of the mathematical problem.","ref":"Levin","sections":[{"title":"The idea to carry forward","text":"Worst-case difficulty and typical-instance difficulty are different. Levin's frameworks make the input distribution and verification process part of the mathematical problem.","math":"search + verification + resource bounds"}],"sources":[{"label":"Leonid Levin · selected research and exposition","url":"https://www.cs.bu.edu/~lnd/","type":"research"}],"questions":["What is the simplest example of universal search and completeness?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Robert Tarjan","id":"tarjan","born":1948,"field":"algorithms","title":"Data structures that adapt, with proofs","bio":"Robert Endre Tarjan helped shape the analysis of data structures and graph algorithms. His work includes the analysis of union–find, splay trees with Daniel Sleator, and Fibonacci heaps with Michael Fredman. A recurring theme is that a structure can be efficient over an entire sequence even when one operation is expensive.","formula":"amortized cost = actual cost + change in potential","impact":"Splay trees make adaptation part of the algorithm: accessing a key changes the tree. Amortized and competitive analysis explain what this simple rule guarantees, and which stronger forms of optimality remain conjectural.","ref":"Tarjan","sections":[{"title":"A sequence is the right unit of analysis","text":"An expensive operation can improve a data structure enough to make later operations cheap. Tarjan’s work makes this intuition precise. Amortized analysis bounds the total cost of a sequence; it does not require a random input distribution.\n\nThree contributions show the range of the idea. Union–find compresses paths while identifying sets. Fibonacci heaps postpone some restructuring work. Splay trees reshape a search tree after each access. These structures solve different problems, but in each case a local change has consequences that must be accounted for across time."},{"title":"Splay trees: change the tree after using it","text":"Sleator and Tarjan’s 1985 paper introduced and analyzed splay trees. After finding a key in a binary search tree, splaying moves its node to the root using rotations that preserve key order. No stored height or balance factor is required.\n\nThere are three cases. A zig rotates a node whose parent is the root. A zig-zig handles two successive left edges or two successive right edges: rotate the parent upward, then the node. A zig-zag handles opposite directions: rotate the node upward twice. The choice of paired rotations is part of the algorithm, not merely an implementation detail."},{"title":"A three-key example","text":"Start with root 30, its left child 20, and 20’s left child 10. Searching for 10 follows two edges. This is a zig-zig case. First rotate 20 above 30; the root becomes 20 with children 10 and 30. Then rotate 10 above 20. The final tree has root 10, right child 20, and 20’s right child 30.\n\nThe sorted order remains 10,20,30, but a second access to 10 is now immediate. Notice that the final tree is still a chain: splaying does not promise a balanced shape after every operation. It adapts the shape to the accesses. Nor does this one example prove good performance for every sequence; that requires an amortized argument."},{"title":"How potential pays for a long access","text":"For a tree T, let size(v) count the nodes in v’s subtree and define Φ(T) as the sum of log₂(size(v)) over all nodes. Charge an operation its actual cost plus the change in Φ. Summing these charges makes intermediate potentials cancel. The actual total is the amortized total plus Φ(initial)−Φ(final).\n\nThe access lemma bounds the amortized cost of splaying a node by a logarithmic quantity involving subtree sizes. It yields O((m+n) log n) total cost for m accesses starting from an arbitrary n-key tree, for n≥2. The n term accounts for the starting configuration. A single access can still cost Θ(n): amortized logarithmic cost is not a worst-case bound on each operation.","math":"Φ(T) = Σᵥ log₂(size(v));   Σ cᵢ = Σ ĉᵢ + Φ(T₀) − Φ(Tₘ)"},{"title":"Static optimality and dynamic optimality compare different rivals","text":"Static optimality compares the total access cost with the best fixed binary search tree for that sequence. The 1985 paper already proves this form of optimality, up to constant factors, under its stated access conditions. In its frequency bound, every key is accessed at least once; more general presentations must account for initialization.\n\nDynamic optimality permits the competitor to change its tree throughout the sequence and even know future requests. Searches and restructuring both count toward its cost. The conjecture asks whether splaying stays within a constant factor of this stronger offline optimum, with appropriate initialization accounting. Matching the best fixed tree does not establish that stronger claim."},{"title":"The July 2026 breakthrough: almost dynamically optimal","text":"The preprint Splay trees are almost dynamically optimal, submitted on 20 July 2026 by Petr Chmel, Bernhard Haeupler, Richard Hladík, Michal Koucký, Antti Roeyskoe, Václav Rozhoň, Ondřej Sladký, and Robert E. Tarjan, proves an O(log log n · (log log log n)²) competitive ratio.\n\nTheorem 1 gives the more precise total-cost bound below for an access sequence X on a fixed set of n keys, allowing an arbitrary initial splay tree. OPT(X) is the minimum cost in the dynamic binary-search-tree model. The additive n inside the parentheses matters when the initial tree is poor and the sequence is short.\n\nThis is a major advance for the original splay algorithm, rather than a replacement data structure. As checked on 30 September 2026, the cited result is a preprint proving almost dynamic optimality; its factor still grows with n, so it does not settle the constant-factor dynamic-optimality conjecture.","math":"cost(splay, X) = O((OPT(X) + n) · log log n · (log log log n)²)"},{"title":"Beyond splaying: union–find and Fibonacci heaps","text":"Tarjan’s 1975 union–find analysis established inverse-Ackermann bounds for a set-union algorithm. For m≥n find operations interspersed with n−1 unions, the bound has the form O(m α(m,n)), where α grows extraordinarily slowly. This is a precise asymptotic statement, not literally a constant bound.\n\nWith Michael Fredman, Tarjan developed Fibonacci heaps. Their inexpensive amortized decrease-key operation yields O(m+n log n) time for single-source shortest paths with nonnegative edge lengths, using n vertices and m edges. This supplies a concrete connection to Dijkstra: better data structures improve the implementation’s complexity while the shortest-path correctness argument remains essential. Read Knuth for broader algorithm analysis, and Hopcroft for Tarjan’s collaborative work on graph algorithms."}],"sources":[{"label":"Sleator and Tarjan · Self-Adjusting Binary Search Trees (1985)","url":"https://www.cs.cmu.edu/~sleator/papers/self-adjusting.pdf","type":"primary"},{"label":"Chmel et al. · Splay trees are almost dynamically optimal (July 2026 preprint), Theorem 1","url":"https://arxiv.org/html/2607.18498v1","type":"primary / preprint"},{"label":"Carnegie Mellon · Binary Search Trees and Dynamic Optimality (Spring 2026), amortized-analysis exposition","url":"https://www.cs.cmu.edu/~yangp/15-451/lecture23.pdf","type":"university lecture notes"},{"label":"Tarjan · Efficiency of a Good But Not Linear Set Union Algorithm (1975)","url":"https://collaborate.princeton.edu/en/publications/efficiency-of-a-good-but-not-linear-set-union-algorithm/","type":"primary / publication record"},{"label":"Fredman and Tarjan · Fibonacci heaps and their uses in improved network optimization algorithms (1987)","url":"https://collaborate.princeton.edu/en/publications/fibonacci-heaps-and-their-uses-in-improved-network-optimization-a-2/","type":"primary / publication record"}],"questions":["In the three-key example, compute the subtree-size potential before and after each rotation. What does the calculation reveal about why a local example alone cannot establish the general amortized bound?","Construct an access sequence with two phases concentrated on different groups of keys. Why can a dynamically changing competitor have an advantage over every single fixed tree?","In the July 2026 bound, when does the initialization term dominate? What additional improvement in the competitive factor would be needed to establish full dynamic optimality?"],"approximateBirth":false,"extended":true,"readMinutes":7},{"name":"László Lovász","id":"lovasz","born":1948,"field":"graphs","title":"Discrete questions, richer spaces","bio":"Lovász connected combinatorics with probability, topology, optimization and graph limits. His local lemma, theta function and topological methods became major tools.","formula":"α(G) ≤ ϑ(G) ≤ χ(Ḡ)","impact":"The theta function bridges an intractable combinatorial quantity and semidefinite optimization. It also gives a multiplicative upper bound for Shannon capacity.","ref":"Lovasz","sections":[{"title":"Avoid locally dependent failures","text":"The symmetric Local Lemma gives positive probability of avoiding all bad events if each has probability at most p and a dependency graph has degree at most d with ep(d+1)≤1. Each event must be independent of the sigma-algebra generated by its nonneighbors, not merely pairwise independent of them.","math":"ep(d+1) ≤ 1"},{"title":"Geometry bounds an independent set","text":"One formulation of theta maximizes ⟨J,X⟩ subject to tr(X)=1, X⪰0 and Xᵢⱼ=0 on edges. An independent set gives a feasible matrix, so α(G)≤ϑ(G). Multiplicativity gives an upper bound for Shannon capacity.","math":"ϑ(C₅) = Θ(C₅) = √5"},{"title":"Beyond one technique","text":"Lovász’s topological proof of Kneser’s conjecture and his work on graphons both replace a finite combinatorial problem with a richer object. Dense graphons and bounded-degree graphings are different limit frameworks.","math":"discrete problem → geometric or analytic representation"}],"sources":[{"label":"MacTutor · historical biography","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Lovasz/","type":"biography"}],"questions":["Why is pairwise independence not enough for the Local Lemma?","Can you derive the theta SDP from an independent set?","What information does a graphon retain that a local graph limit does not?"],"approximateBirth":false,"extended":true,"readMinutes":3,"tex":"\\alpha(G)\\leq\\vartheta(G)\\leq\\chi(\\overline{G})","mathSVG":"<mjx-container class=\"MathJax\" jax=\"SVG\" display=\"true\"><svg style=\"vertical-align: -0.566ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"20.851ex\" height=\"2.878ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -1022 9216.1 1272\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"mi\"><path data-c=\"1D6FC\" d=\"M34 156Q34 270 120 356T309 442Q379 442 421 402T478 304Q484 275 485 237V208Q534 282 560 374Q564 388 566 390T582 393Q603 393 603 385Q603 376 594 346T558 261T497 161L486 147L487 123Q489 67 495 47T514 26Q528 28 540 37T557 60Q559 67 562 68T577 70Q597 70 597 62Q597 56 591 43Q579 19 556 5T512 -10H505Q438 -10 414 62L411 69L400 61Q390 53 370 41T325 18T267 -2T203 -11Q124 -11 79 39T34 156ZM208 26Q257 26 306 47T379 90L403 112Q401 255 396 290Q382 405 304 405Q235 405 183 332Q1 raph has a perfect matching is polynomial-time; counting all perfect matchings is #P-complete. This does not unconditionally separate their running times.","math":"perm(A) = number of perfect matchings"},{"title":"Algebraic complexity","text":"VP consists of polynomial-degree families with polynomial-size arithmetic circuits. VNP permits an exponential Boolean summation of efficiently computed polynomials. The permanent is VNP-complete under projections over fields of characteristic different from two. In characteristic two it equals the determinant.","math":"f(x) = Σy∈{0,1}ᵖ g(x,y)"},{"title":"Learning as a resource question","text":"PAC learning separates accuracy ε, failure probability δ, sample complexity and running time. A class can be statistically learnable yet computationally hard to learn under cryptographic assumptions.","math":"PrS[Prx∼D[h(x)≠f(x)] ≤ ε] ≥ 1−δ"}],"sources":[{"label":"ACM · Leslie Valiant's research","url":"https://amturing.acm.org/award_winners/valiant_2612174.cfm","type":"research"}],"questions":["Why do counting reductions need more than decision reductions?","What changes in the permanent over characteristic two?","Can a class need few examples but still be hard to learn?"],"approximateBirth":false,"extended":true,"readMinutes":3,"tex":"\\operatorname{perm}(A)=\\sum_{\\sigma\\in S_n}\\prod_{i=1}^{n}a_{i,\\sigma(i)}","mathSVG":"<mjx-container class=\"MathJax\" jax=\"SVG\" display=\"true\"><svg style=\"vertical-align: -3.002ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24.018ex\" height=\"6.538ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -1562.5 10615.8 2889.6\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"mi\"><path data-c=\"70\" d=\"M36 -148H50Q89 -148 97 -134V-126Q97 -119 97 -107T97 -77T98 -38T98 6T98 55T98 106Q98 140 98 177T98 243T98 296T97 335T97 351Q94 370 83 376T38 385H20V408Q20 431 22 431L32 432Q42 433 61 434T98 436Q115 437 135 ized interaction with an unlimited prover. The theorem concerns verification, not efficient computation of the answer alone.","ref":"Shamir","sections":[{"title":"Translate logic into algebra","text":"On Boolean inputs, negation is 1−x, conjunction is xy, and disjunction is x+y−xy. Universal quantification multiplies the two evaluations; existential quantification takes their Boolean OR. Summation alone is not existential quantification.","math":"∀x: p(0)p(1);  ∃x: p(0)+p(1)−p(0)p(1)"},{"title":"Control the degree","text":"Repeated quantifiers can double individual degrees. Replace p by its multilinearization in x: this preserves its values at x=0 and x=1 while reducing its degree in x to one. The protocol verifies these reductions rather than writing out an exponential expression.","math":"Rₓp = (1−x)p(0)+xp(1)","tex":"R_xp=(1-x)p(0)+xp(1)","mathSVG":"<mjx-container class=\"MathJax\" jax=\"SVG\" display=\"true\"><svg style=\"vertical-align: -0.566ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"26.045ex\" height=\"2.262ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -750 11511.9 1000\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"msub\"><g data-mml-node=\"mi\"><path data-c=\"1D445\" d=\"M230 637Q203 637 198 638T193 649Q193 676 204 682Q206 683 378 683Q550 682 564 680Q620 672 658 652T712 606T733 563T739 529Q739 484 710 445T643 385T576 351T538 338L545 333Q612 295 612 223Q612 212 607 162T602 80V71Q602 53 603 43T614 25T640 16Q668 16 686 38T712 85Q717 99 720 102T735 105Q755 105 755 93Q755 75 731 36Q693 -21 641 -21H632Q571 -21 531 4T487 82Q487 109 502 166T517 239Q517 290 474 313Q459 320 449 321T378 323H309L277 193Q244 61 244 59Q244 55 245 54T252 50T269 48T302 46H333Q339 38 339 37T336 19Q332 6 326 0H311Q275 2 180 2Q146 2 117 2T71 2T50 1Q33 1 33 10Q33 12 36 24Q41 43 46 45Q50 46 61 46H67Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628Q287 635 230 637ZM630 554Q630 586 609 608T5 ature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Grigori Perelman","id":"perelman","born":1966,"field":"geometry","title":"Topology through geometric flow","bio":"Perelman completed decisive parts of Hamilton's Ricci-flow program, proving geometrization and the Poincaré conjecture. His work controlled singularities in a changing geometry.","formula":"∂g/∂t = −2 Ric(g)","impact":"Ricci flow evolves a metric according to curvature. Understanding its singularities and surgery lets one extract topological information.","ref":"Perelman","sections":[{"title":"The idea to carry forward","text":"Ricci flow evolves a metric according to curvature. Understanding its singularities and surgery lets one extract topological information.","math":"∂g/∂t = −2 Ric(g)"}],"sources":[{"label":"MacTutor · historical biography","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Perelman/","type":"biography"}],"questions":["What is the simplest example of topology through geometric flow?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Terence Tao","id":"tao","born":1975,"field":"analysis","title":"Methods across mathematical borders","bio":"Tao has made major contributions to harmonic analysis, partial differential equations, number theory and combinatorics. With Green he proved that the primes contain arbitrarily long arithmetic progressions.","formula":"p, p+d, …, p+(k−1)d","impact":"The primes have zero density among integers, so a direct application of Szemerédi's theorem is insufficient. Transference and pseudorandomness bridge that gap.","ref":"Tao","sections":[{"title":"The idea to carry forward","text":"The primes have zero density among integers, so a direct application of Szemerédi's theorem is insufficient. Transference and pseudorandomness bridge that gap.","math":"p, p+d, …, p+(k−1)d"}],"sources":[{"label":"MacTutor · historical biography","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Tao/","type":"biography"}],"questions":["What is the simplest example of methods across mathematical borders?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"Maryam Mirzakhani","id":"mirzakhani","born":1977,"field":"geometry","title":"The geometry of all surfaces","bio":"Mirzakhani made major advances in hyperbolic geometry, moduli spaces and dynamics. She connected the counting of curves on surfaces with volumes of parameter spaces.","formula":"N(L) ∼ c L^{6g−6}","impact":"For a fixed closed hyperbolic surface of genus g≥2, suitable counts of simple closed geodesics have polynomial asymptotics. The constant depends on the surface and counting convention.","ref":"Mirzakhani","sections":[{"title":"The idea to carry forward","text":"For a fixed closed hyperbolic surface of genus g≥2, suitable counts of simple closed geodesics have polynomial asymptotics. The constant depends on the surface and counting convention.","math":"N(L) ∼ c L^{6g−6}"}],"sources":[{"label":"MacTutor · historical biography","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Mirzakhani/","type":"biography"}],"questions":["What is the simplest example of the geometry of all surfaces?","Which assumptions are essential to the signature result?","Which connected idea would you explore next?"],"approximateBirth":false,"extended":false,"readMinutes":1},{"name":"László Babai","id":"babai","born":1950,"field":"complexity","title":"Symmetry becomes an algorithm","bio":"Babai developed influential graph-isomorphism and permutation-group algorithms and helped establish Arthur–Merlin protocols. His quasipolynomial isomorphism algorithm combines combinatorial and algebraic structure.","formula":"GI ∈ TIME(exp((log n)^O(1)))","impact":"A large symmetry group can be represented by generators and studied through its actions. Large automorphism groups alone do not make an isomorphism instance hard.","ref":"Babai","sections":[{"title":"Search a group rather than all permutations","text":"Graph isomorphism asks for an adjacency-preserving bijection. Permutation groups can be represented by a small list of generators, while their orbits, stabilizers and cosets organize the candidate maps.","math":"Aut(G) ≤ Sₙ"},{"title":"Refinement and structured obstructions","text":"Color refinement distinguishes vertices by recursively aggregating neighborhood information. Babai’s algorithm combines more powerful combinatorial analysis with local certificates and permutation-group structure. The structural dichotomy is much more precise than “symmetric graphs are hard.”","math":"refinement + local certificates + group actions"},{"title":"Two contributions to verification","text":"Babai introduced Arthur–Merlin games and, with Fortnow and Lund, proved MIP=NEXP. His graph-isomorphism work and his interactive-proof work connect through complexity but should not be confused as the same algorithm.","math":"MIP = NEXP"}],"sources":[{"label":"Graph Isomorphism in Quasipolynomial Time","url":"https://arxiv.org/abs/1512.03547","type":"paper"}],"questions":["Why do equally sized regular graphs defeat 1-WL?","How can a generating set encode a huge permutation group?","How does GI∈coAM constrain an NP-completeness claim?"],"approximateBirth":false,"extended":true,"readMinutes":3,"tex":"\\mathrm{GI}\\in\\mathrm{TIME}\\!\\left(\\exp((\\log n)^{O(1)})\\right)","mathSVG":"<mjx-container class=\"MathJax\" jax=\"SVG\" display=\"true\"><svg style=\"vertical-align: -1.469ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"29.181ex\" height=\"4.07ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -1149.5 12898.1 1799\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-n ower-bound strategies to pseudorandomness.","formula":"small circuit → simple approximation","impact":"If a restricted circuit admits a low-complexity approximation that the target function cannot admit, the circuit must be large. Restrictions on the circuit model are essential.","ref":"Razborov","sections":[{"title":"Restrict the circuit model","text":"An unrestricted Boolean circuit uses AND, OR and NOT. Monotone circuits omit NOT. Razborov proved strong lower bounds in this restricted setting, including for clique, using an approximation method.","math":"small monotone circuit → controlled approximation"},{"title":"Arithmetization for a lower bound","text":"Razborov–Smolensky methods approximate small constant-depth circuits with MOD-p gates by low-degree polynomials over Fₚ. Functions with incompatible modular behavior resist such approximations.","math":"small AC⁰[p] circuit → low-degree approximation"},{"title":"Natural proofs","text":"Razborov and Rudich identified a barrier to properties that are large, efficiently recognizable from a truth table, and useful against small circuits. Under sufficiently strong pseudorandom-function assumptions, such properties would distinguish pseudorandom functions from random ones. Truth-table efficiency is exponential in the number of input variables.","math":"large + constructive + useful → a distinguisher"}],"sources":[{"label":"Natural Proofs · Razborov and Rudich","url":"https://doi.org/10.1006/jcss.1997.1494","type":"paper"},{"label":"Natural Proofs · original paper copy","url":"https://www1.karlin.mff.cuni.cz/~krajicek/rr.pdf","type":"research"}],"questions":["How does the monotone approximation method work?","Why does field characteristic matter for modular gates?","What is the input length in the natural-proofs constructivity condition?"],"approximateBirth":false,"extended":true,"readMinutes":3},{"name":"Noam Nisan","id":"nisan","born":1961,"field":"complexity","title":"Randomness for limited memory","bio":"Nisan constructed pseudorandom generators for space-bounded computation and developed hardness-versus-randomness methods with Wigderson. He also contributed to communication complexity and algorithmic economics.","formula":"G : {0,1}ˢ → {0,1}ᴿ","impact":"A distribution can fool a resource-bounded observer without being truly uniform. The observer model and error parameter determine the required seed length.","ref":"Nisan","sections":[{"title":"Pseudorandomness is relative","text":"A seed generator has support much smaller than the full random-bit space. It can still fool a bounded class of computations if their acceptance probabilities change by at most ε.","math":"|Pr[A(U)=1]−Pr[A(G(Uₛ))=1]| ≤ ε"},{"title":"Memory limits the observer","text":"An S-space computation has only exponentially many possible configurations. In the standard bounded-space model, Nisan’s generator exploits this restriction to reduce randomness dramatically; a common summary is seed length O(S log R), with the model and error conditions understood.","math":"limited memory → limited ability to expose correlations"},{"title":"Hardness versus randomness","text":"With Wigderson, Nisan used carefully overlapping subsets of a seed to evaluate a hard function many times. A distinguisher can be converted into a predictor. Hardness amplification and parameter control are needed to turn worst-case hardness into a full derandomization theorem.","math":"G(z)ᵢ = f(z restricted to Sᵢ)"}],"sources":[{"label":"Nisan–Wigderson: Hardness vs Randomness","url":"https://doi.org/10.1016/S0022-0000(05)80043-1","type":"paper"}],"questions":["How is space-bounded computation represented by a branching program?","Why does a hybrid argument expose one predictable output bit?","Which hardness assumption is strong enough for logarithmic seeds?"],"approximateBirth":false,"extended":true,"readMinutes":3,"tex":"G:\\{0,1\\}^{s}\\longrightarrow\\{0,1\\}^{R}","mathSVG":"<mjx-container class=\"MathJax\" jax=\"SVG\" display=\"true\"><sv 2T735 105Q755 105 755 93Q755 75 731 36Q693 -21 641 -21H632Q571 -21 531 4T487 82Q487 109 502 166T517 239Q517 290 474 313Q459 320 449 321T378 323H309L277 193Q244 61 244 59Q244 55 245 54T252 50T269 48T302 46H333Q339 38 339 37T336 19Q332 6 326 0H311Q275 2 180 2Q146 2 117 2T71 2T50 1Q33 1 33 10Q33 12 36 24Q41 43 46 45Q50 46 61 46H67Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628Q287 635 230 637ZM630 554Q630 586 609 608T523 636Q521 636 500 636T462 637H440Q393 637 386 627Q385 624 352 494T319 361Q319 360 388 360Q466 361 492 367Q556 377 592 426Q608 449 619 486T630 554Z\"><\/path><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>"},{"name":"Avi Wigderson","id":"wigderson","born":1956,"field":"complexity","title":"Hardness can replace randomness","bio":"Wigderson's work connects cryptography, pseudorandomness, lower bounds and optimization. With Nisan and Impagliazzo he developed major hardness-versus-randomness results.","formula":"strong circuit hardness ⇒ P = BPP","impact":"The hypothesis is a sufficiently strong circuit lower bound for an efficiently describable function, not merely P≠NP. Enumerating logarithmic-length seeds then gives deterministic simulation.","ref":"Wigderson","sections":[{"title":"A circuit lower bound becomes an algorithm","text":"Nisan–Wigderson generators evaluate a hard function on overlapping portions of a seed. Small intersections let one convert a distinguisher into a small predictor. Impagliazzo–Wigderson hardness amplification supplies the bridge from suitable worst-case hardness.","math":"hardness → pseudorandomness → deterministic simulation"},{"title":"Enumerate the seeds","text":"A BPP algorithm using polynomially many random bits can be simulated by trying every seed when a suitable efficiently evaluable generator has O(log n) seed length. The number of seeds is then polynomial.","math":"2^{O(log n)} = n^{O(1)}"},{"title":"A careful reverse connection","text":"A separate theorem of Kabanets and Impagliazzo says that sufficiently strong derandomization of arithmetic polynomial identity testing implies a major Boolean or arithmetic circuit lower bound. It should not be attributed to Wigderson, nor simplified to an unconditional arithmetic lower bound alone.","math":"PIT derandomization ⇒ NEXP circuit lower bound OR permanent lower bound"}],"sources":[{"label":"Mathematics and Computation · author’s book page","url":"https://www.math.ias.edu/avi/book","type":"research"}],"questions":["How does the hybrid argument produce a predictor?","What is the distinction between worst-case and average-case hardness?","Why can derandomization itself imply circuit lower bounds?"],"approximateBirth":false,"extended":true,"readMinutes":3},{"name":"Richard Lipton","id":"lipton","born":1946,"field":"complexity","title":"Small circuits, large consequences","bio":"Lipton contributed to complexity, verification and randomized algebraic algorithms. The Karp–Lipton theorem connects small circuits for NP to a collapse of the polynomial hierarchy.","formula":"NP ⊆ P/poly ⇒ PH = Σ₂ᴾ","impact":"A hypothetical small SAT circuit can be used to produce witnesses. Existentially guessing the circuit and universally checking its outputs compresses quantifier alternation.","ref":"Lipton","sections":[{"title":"Nonuniform computation","text":"P/poly permits a separate polynomial-size circuit for each input length. There need not be an efficient algorithm that constructs those circuits. Uniform algorithms are therefore a stricter resource model.","math":"P ⊆ P/poly"},{"title":"Use circuits to produce witnesses","text":"Assume SAT has small circuits. A SAT decision circuit can choose the bits of a satisfying assignment by self-reduction. For a statement ∀y∃z R(x,y,z), existentially guess such a witness-producing circuit, then universally verify R(x,y,C(y)).","math":"∀y∃z R(x,y,z) → ∃C∀y R(x,y,C(y))"},{"title":"Why the argument is sound","text":"A false statement has some y with no witness z. No guessed circuit can output a valid witness on that y. With polynomial circuit bounds, this puts Π₂ᴾ inside Σ₂ᴾ and collapses PH. Lipton’s separate work with DeMillo helped develop randomized algebraic identity checking.","math":"NP ⊆ P/poly ⇒ PH = Σ₂ᴾ","tex":"\\mathrm{NP}\\subseteq\\mathrm{P/poly}\\quad\\Longrightarrow\\quad\\mathrm{PH}=\\Sigma_2^{\\mathrm P}","mathSVG":"<mjx-container class=\"MathJax\" jax=\"SVG\" display=\"true\"><svg style=\"vertical-align: -0.566ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"31.792ex\" height=\"2.593ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -896 14052.2 1146\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"TeXAtom\" data-mjx-texclass=\"ORD\"><g data-mml-node=\"mi\"><path data-c=\"4E\" d=\"M42 46Q74 48 94 56T118 69T128 86V634H124Q114 637 52 637H25V683H232L235 680Q237 679 322 554T493 303L578 178V598Q572 608 568 613T544 627T492 637H475V683H483Q498 680 600 680Q706 680 715 683H724V637H707Q634 633 622 598L621 302V6L614 0H600Q585 0 582 3T481 150T282 443T171 605V345L172 86Q183 50 257 46H274V0H265Q250 3 150 3Q48 3 33 0H25V46H42Z\"><\/path><path data-c=\"50\" d=\"M130 622Q123 629 119 631T103 634T60 637H27V683H214Q237 683 276 683T331 684Q419 684 471 671T567 616Q624 563 624 489Q624 421 573 372T451 307Q429 302 328 301H234V181Q234 62 237 58Q245 47 304 46H337V0H326Q305 3 182 3Q47 3 38 0H27V46H60Q102 47 111 49T130 61V622ZM507 488Q507 514 506 528T500 564T483 597T450 620T397 635Q385 637 307 637H286Q237 637 234 628Q231 624 231 483V342H302H339Q390 342 423 349T481 382Q507 411 507 488Z\" transform=\"translate(750,0)\"><\/path><\/g><\/g><g data-mml-node=\"mo\" transform=\"translate(1708.8,0)\"><path data-c=\"2286\" d=\"M84 346Q84 468 166 546T360 635Q361 635 370 635T395 635T430 636T475 636T524 636H679Q694 628 694 616Q694 607 681 597L522 596H470H441Q366 596 338 592T266 568Q244 557 224 542T179 500T139 433T124 346V341Q124 253 185 185Q244 121 328 103Q348 98 366 98T522 96H681Q694 86 694 76Q694 64 proximateBirth":false,"extended":true,"readMinutes":3},{"name":"Lance Fortnow","id":"fortnow","born":1963,"field":"complexity","title":"The power of separated provers","bio":"Fortnow, with Babai and Lund, proved MIP=NEXP. He also contributed to the algebraic interactive-proof methods behind the 1990 advances in verification.","formula":"MIP = NEXP","impact":"A polynomial-time verifier can cross-check separated provers about an exponentially large claimed computation. Noncommunication constrains coordinated cheating strategies.","ref":"Fortnow","sections":[{"title":"Separated answers impose consistency","text":"Multiple provers may coordinate before the protocol but cannot communicate during it. The verifier can send related questions whose connection is hidden from either prover. Their answers must agree with a common global account.","math":"local answers + secret cross-checks"},{"title":"Why exponential time appears","text":"An NEXP computation can have an exponentially large witness. The BFL theorem encodes such a witness so that a polynomial-time verifier can perform algebraic and consistency checks without reading the whole object.","math":"MIP = NEXP","tex":"\\mathrm{MIP}=\\mathrm{NEXP}","mathSVG":"<mjx-container class=\"MathJax\" jax=\"SVG\" display=\"true\"><svg style=\"vertical-align: -0.186ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"13.924ex\" height=\"1.731ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -683 6154.6 765\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"TeXAtom\" data-mjx-texclass=\"ORD\"><g data-mml-node=\"mi\"><path data-c=\"4D\" d=\"M132 622Q125 629 121 631T105 634T62 637H29V683H135Q221 683 232 682T249 675Q250 674 354 398L458 124L562 398Q666 674 668 675Q671 681 683 682T781 683H887V637H854Q814 636 803 634T785 622V61Q791 51 802 49T854 46H887V0H876Q855 3 736 3Q605 3 596 0H585V46H618Q660 47 669 49T688 61V347Q688 424 688 461T688 546T688 613L687 s":[{"title":"Why 7/8 appears","text":"An OR of three distinct noncontradictory literals is false on exactly one of eight assignments. A uniformly random assignment therefore satisfies 7m/8 clauses in expectation, and conditional expectations can remove the randomness.","math":"E[satisfied clauses] = 7m/8"},{"title":"A constant gap is the key","text":"Ordinary NP-hardness may separate full satisfaction from failure on one clause out of millions. Approximation hardness requires a robust gap. Håstad constructed PCPs giving essentially optimal gaps for MAX-E3SAT and MAX-E3LIN.","math":"near 1 versus near 7/8; near 1 versus near 1/2"},{"title":"Decode a coordinate from a function","text":"Long-code tests encode a label i as the dictator f(x)=xᵢ. Fourier analysis shows how unusually high acceptance reveals coordinates usable as labels. The test and predicate determine the quantitative hardness.","math":"local test → influential coordinate → decoded label"}],"sources":[{"label":"Some Optimal Inapproximability Results · author’s copy","url":"https://www.csc.kth.se/~johanh/optimalinap.pdf","type":"research"}],"questions":["How is each verifier random string turned into a constraint?","Why is a tiny exact-satisfaction gap useless for constant-factor hardness?","How does Fourier information recover a label from a long code?"],"approximateBirth":false,"extended":true,"readMinutes":3,"tex":"\\text{MAX-E3SAT:}\\quad\\frac78\\ \\text{approximation threshold}","mathSVG":"<mjx-container class=\"MathJax\" jax=\"SVG\" display=\"true\"><svg style=\"vertical-align: -1.602ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"43.231ex\" height=\"4.661ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -1352 19108 2060\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"mtext\"><path data-c=\"4D\" d=\"M132 622Q125 629 121 631T105 634T62 637H29V683H135Q221 683 232 682T249 675Q250 674 354 398L458 124L562 398
