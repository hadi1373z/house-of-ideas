pose different optimality arguments."},{"source":"codd","target":"immerman","label":"Queries and logic","description":"Relational query languages connect databases with descriptive complexity."},{"source":"backus","target":"milner","label":"Programming languages","description":"Language design connects through types and functional programming."},{"source":"serre","target":"grothendieck","label":"Algebraic geometry","description":"Their work and correspondence are central to the development of the subject."},{"source":"grothendieck","target":"deligne","label":"Étale cohomology","description":"Deligne proved the final Weil conjecture in the cohomological framework."},{"source":"grothendieck","target":"valiant","label":"Geometry and complexity","description":"A thematic bridge, not direct mentorship: polynomial complexity invites geometric methods."},{"source":"atiyah","target":"connes","label":"Noncommutative geometry","description":"Index theory and operator algebras meet in noncommutative geometry."},{"source":"mccarthy","target":"minsky","label":"Artificial intelligence","description":"Both helped shape the early research field of artificial intelligence."},{"source":"minsky","target":"newell","label":"Models of intelligence","description":"Compare representation-centered and problem-solving-centered approaches."},{"source":"newell","target":"polya","label":"Proof search","description":"A conceptual reading connection between mathematical heuristics and search programs."},{"source":"nash","target":"papadimitriou","label":"Equilibrium computation","description":"Equilibrium existence becomes a total-search complexity problem."},{"source":"dijkstra","target":"hoare","label":"Program correctness","description":"Invariants and logical assertions turn programs into objects of proof."},{"source":"dijkstra","target":"tarjan","label":"Graph algorithms","description":"A reading link through provably efficient graph computations."},{"source":"rabin","target":"karp","label":"String fingerprints","description":"Rabin–Karp uses compact hashes for string matching."},{"source":"rabin","target":"yao","label":"Randomized complexity","description":"Yao's minimax perspective provides tools for understanding randomized algorithms."},{"source":"scott","target":"milner","label":"Semantics and languages","description":"Domain-theoretic semantics and practical typed languages connect."},{"source":"hoare","target":"floyd","label":"Assertions and invariants","description":"Their work helped establish formal methods for program correctness."},{"source":"edmonds","target":"lovasz","label":"Combinatorial optimization","description":"Matching, matroids and convex optimization link their contributions."},{"source":"edmonds","target":"karp","label":"Efficient computation","description":"Polynomial-time combinatorial algorithms connect to complexity classification."},{"source":"karp","target":"lipton","label":"Karp–Lipton theorem","description":"Small circuits for NP imply a collapse of the polynomial hierarchy."},{"source":"karp","target":"hopcroft","label":"Matching algorithms","description":"They developed the phased bipartite matching algorithm."},{"source":"floyd","target":"knuth","label":"Algorithm analysis","description":"Program analysis and combinatorial algorithms connect their contributions."},{"source":"pearl","target":"simon","label":"Decision and reasoning","description":"A thematic comparison of bounded rationality, uncertainty and causal models."},{"source":"knuth","target":"tarjan","label":"Data structures","description":"Detailed algorithm analysis meets structural and amortized bounds."},{"source":"cook","target":"karp","label":"NP-completeness","description":"Cook–Levin supplies the starting problem for Karp's reductions."},{"source":"cook","target":"levin","label":"Independent completeness results","description":"Their independent work established foundational completeness principles."},{"source":"hopcroft","target":"tarjan","label":"Graph algorithms","description":"Their collaborations include efficient planarity and graph-structure algorithms."},{"source":"szemeredi","target":"gowers","label":"Arithmetic progressions","description":"Gowers developed a new proof and quantitative methods using uniformity norms."},{"source":"szemeredi","target":"tao","label":"Additive structure","description":"The Green–Tao theorem uses transference beyond positive density."},{"source":"deligne","target":"wiles","label":"Arithmetic geometry","description":"A conceptual route through geometric and modular tools in number theory."},{"source":"diffie","target":"hellman","label":"Key exchange","description":"Their joint work established the public-key paradigm and key-exchange protocol."},{"source":"hellman","target":"rivest","label":"Public-key cryptography","description":"RSA is a distinct construction in the public-key paradigm."},{"source":"rivest","target":"shamir","label":"RSA","description":"They co-developed RSA with Adleman."},{"source":"shamir","target":"adleman","label":"RSA","description":"They co-developed RSA with Rivest."},{"source":"yao","target":"goldwasser","label":"Computational security","description":"Indistinguishability and simulation are central shared themes."},{"source":"thurston","target":"perelman","label":"Geometrization","description":"Perelman completed the Ricci-flow route to geometrization."},{"source":"thurston","target":"mirzakhani","label":"Geometry of surfaces","description":"Hyperbolic surfaces and moduli connect their mathematical worlds."},{"source":"levin","target":"valiant","label":"Complexity frameworks","description":"Search, counting and learning ask for different types of computational information."},{"source":"tarjan","target":"goemans","label":"Graph optimization","description":"A reading route from exact algorithms to geometric approximation."},{"source":"lovasz","target":"goemans","label":"Semidefinite optimization","description":"Theta and MAX-CUT rounding exemplify graph problems expressed by PSD matrices."},{"source":"lovasz","target":"nesetril","label":"Graph structure and limits","description":"Homomorphisms, sparsity and limit objects connect these research directions."},{"source":"valiant","target":"hastad","label":"Beyond exact decision","description":"Counting, learning and approximation expose different complexity measures."},{"source":"valiant","target":"odonnell","label":"Learning theory","description":"Fourier methods become tools for analyzing learnability."},{"source":"papadimitriou","target":"nisan","label":"Algorithmic economics","description":"Computation, strategic interaction and mechanism design form a thematic bridge."},{"source":"khachiyan","target":"goemans","label":"Convex relaxations","description":"Polynomial-time optimization supports relax-and-round algorithms."},{"source":"shamir","target":"fortnow","label":"Algebraic interactive proofs","description":"LFKN sum-check and Shamir's degree control led to IP=PSPACE."},{"source":"shamir","target":"goldwasser","label":"Interactive verification","description":"Goldwasser's foundational proof model is the setting for IP=PSPACE."},{"source":"wiles","target":"galois","label":"Galois representations","description":"A conceptual route from symmetries of equations to modern modularity methods."},{"source":"micali","target":"goldwasser","label":"Joint foundations","description":"Their collaborations include probabilistic encryption and zero knowledge."},{"source":"karmarkar","target":"lasserre","label":"Convex optimization","description":"A thematic route from interior-point methods to moment SDPs."},{"source":"goldwasser","target":"fortnow","label":"Multiple provers","description":"Interactive verification develops into the BFL characterization of MIP."},{"source":"gowers","target":"tao","label":"Uniformity and structure","description":"Higher-order analysis helps study additive patterns."},{"source":"perelman","target":"poincare","label":"Poincaré conjecture","description":"Perelman's geometrization work resolves the three-dimensional conjecture."},{"source":"mirzakhani","target":"riemann","label":"Moduli of surfaces","description":"A conceptual connection through Riemann surfaces and their parameter spaces."},{"source":"babai","target":"weisfeiler","label":"Graph isomorphism","description":"Refinement and group-theoretic methods contribute different tools."},{"source":"babai","target":"fortnow","label":"MIP=NEXP","description":"Babai, Fortnow and Lund proved the equality."},{"source":"razborov","target":"nisan","label":"Hardness and randomness","description":"Lower bounds and pseudorandom generators are linked by complexity reductions."},{"source":"nisan","target":"wigderson","label":"Nisan–Wigderson generator","description":"They developed the combinatorial-design hardness-versus-randomness construction."},{"source":"wigderson","target":"lasserre","label":"Proofs and optimization","description":"A thematic reading route into SoS and the complexity of convex relaxations."},{"source":"lipton","target":"shamir","label":"Random polynomial checking","description":"Low-degree identity tests support algebraic verification protocols."},{"source":"polya","target":"lovasz","label":"Probabilistic methods","description":"A thematic route from random walks and counting to local-dependence arguments."},{"source":"fortnow","target":"hastad","label":"PCP and approximation","description":"Multiprover ideas fed into PCP constructions and gap hardness."},{"source":"fortnow","target":"vidick","label":"Changing prover resources","description":"Compare classical MIP=NEXP with entangled MIP*=RE; the models differ."},{"source":"hastad","target":"khot","label":"Approximation thresholds","description":"Unique Games became a source of sharp conditional hardness beyond earlier PCP results."},{"source":"khot","target":"odonnell","label":"MAX-CUT hardness","description":"They coauthored the work connecting Unique Games, noise stability and MAX-CUT."},{"source":"odonnell","target":"goemans","label":"Gaussian geometry","description":"Noise-stability hardness and hyperplane rounding meet at the same constant."},{"source":"goemans","target":"raghavendra","label":"SDP approximation","description":"Raghavendra generalized the SDP-versus-hardness viewpoint to fixed CSPs."},{"source":"raghavendra","target":"lasserre","label":"Stronger relaxations","description":"A thematic comparison of basic SDP optimality and higher-level moment relaxations."},{"source":"lasserre","target":"gaifman","label":"Local and global","description":"An analogy between low-degree consistency and logical locality, not a theorem identifying them."},{"source":"weisfeiler","target":"immerman","label":"Counting logic","description":"Cai–Fürer–Immerman connects refinement limitations to bounded-variable logic."},{"source":"immerman","target":"gaifman","label":"Logical expressiveness","description":"Descriptive complexity and locality illuminate different logical resources."},{"source":"gaifman","target":"nesetril","label":"Sparse logical algorithms","description":"Locality combines with structural sparsity in model checking."},{"source":"shannon","target":"blackwell","label":"Two meanings of information","description":"Shannon measures uncertainty and communication limits. Blackwell compares experiments by the decisions they permit. A channel matrix is a useful bridge, but mutual information for one prior is not a universal ranking of decision usefulness. This comparison asserts no direct historical influence.","kind":"Thematic comparison","sources":[{"label":"Shannon · A Mathematical Theory of Communication (1948)","url":"https://people.math.harvard.edu/~ctm/home/text/others/shannon/entropy/entropy.pdf","type":"primary / scholarly"},{"label":"Blackwell · Equivalent Comparisons of Experiments (1953), abstract and publication record","url":"https://celebratio.org/Blackwell_DH/article/255/","type":"primary / scholarly"}]},{"source":"bellman","target":"blackwell","label":"Decisions over time","description":"Bellman’s dynamic programming organizes choices by their future consequences. Blackwell also made substantial contributions to dynamic programming and statistical decisions. Read the two profiles to distinguish the quality of an observation from the recursive planning problem that uses it. The route is thematic, not a claim of joint authorship.","kind":"Thematic comparison","sources":[{"label":"Bickel · David Blackwell: An explorer in mathematics and statistics (2020)","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7703635/","type":"primary / scholarly"}]},{"source":"kolmogorov","target":"blackwell","label":"From probability to a decision","description":"A probability model specifies uncertainty; a decision problem adds available actions and losses. Blackwell’s experiments illustrate why two observers with different signals may have different achievable risks even when they agree on the underlying probability model. This is an explanatory connection, not a claim of mentorship.","kind":"Thematic comparison","sources":[{"label":"Blackwell · Equivalent Comparisons of Experiments (1953), abstract and publication record","url":"https://celebratio.org/Blackwell_DH/article/255/","type":"primary / scholarly"}]},{"source":"shannon","target":"hamming","label":"Capacity meets construction","description":"Shannon asks how much information a noisy channel can carry reliably; Hamming asks how to build and decode a particular code. Compare a long-block probabilistic guarantee with correction of every single-bit error in a short block. This is a reading comparison, not a claim that the 1950 paper followed directly from the 1948 theorem.","kind":"Thematic comparison","sources":[{"label":"Hamming · Error Detecting and Error Correcting Codes (1950)","url":"https://ineffectivetheory.com/edu/papers/hamming-codes-1950.pdf","type":"primary / scholarly"},{"label":"Shannon · A Mathematical Theory of Communication (1948)","url":"https://people.math.harvard.edu/~ctm/home/text/others/shannon/entropy/entropy.pdf","type":"primary / scholarly"}]},{"source":"lovasz","target":"hamming","label":"Separating confusable messages","description":"A distance code separates words that a bounded number of bit changes could confuse. Zero-error graph theory instead records which channel inputs can produce a common output. Both select mutually distinguishable messages, but their noise models and guarantees must be stated separately.","kind":"Thematic comparison","sources":[{"label":"Hamming · Error Detecting and Error Correcting Codes (1950)","url":"https://ineffectivetheory.com/edu/papers/hamming-codes-1950.pdf","type":"primary / scholarly"},{"label":"Lovász · On the Shannon Capacity of a Graph (1979)","url":"https://www.sfu.ca/~mdevos/notes/semidef/lovasz-theta.pdf","type":"primary / scholarly"}]},{"source":"turing","target":"hamming","label":"Correct computation on imperfect machines","description":"A universal machine specifies what a computation means; an error-correcting code helps protect its representation against damage. These address different obstacles: repairing bits does not make an undecidable problem decidable. No personal influence is asserted by this route.","kind":"Thematic comparison","sources":[{"label":"Turing · On Computable Numbers (1936)","url":"https://www.cs.virginia.edu/~robins/Turing_Paper_1936.pdf","type":"primary / scholarly"},{"label":"Hamming · Error Detecting and Error Correcting Codes (1950)","url":"https://ineffectivetheory.com/edu/papers/hamming-codes-1950.pdf","type":"primary / scholarly"}]},{"source":"hilbert","target":"julia-robinson","label":"Hilbert’s tenth problem","description":"Robinson worked on the decision problem Hilbert posed for integer polynomial equations. Her contributions with Davis and Putnam, completed by Matiyasevich, established the negative answer. This connects a published problem to work explicitly devoted to it; it does not imply that Hilbert and Robinson collaborated.","kind":"Documented research lineage","sources":[{"label":"University of California · Julia Robinson, memorial by her colleagues","url":"https://mathshistory.st-andrews.ac.uk/Obituaries/Robinson_Julia_UC/","type":"primary / scholarly"},{"label":"Poonen · Hilbert’s Tenth Problem, slides 2–4 (2006)","url":"https://math.mit.edu/~poonen/slides/h10.pdf","type":"primary / scholarly"}]},{"source":"turing","target":"julia-robinson","label":"From machines to integer equations","description":"The DPRM theorem represents computably enumerable sets by polynomial equations over integers. Since some such sets are undecidable, a universal solver for integer equations would contradict computability theory. The connection is a reduction of decision problems, not an assertion of a personal collaboration.","kind":"Mathematical connection","sources":[{"label":"Poonen · Hilbert’s Tenth Problem, slides 2–4 (2006)","url":"https://math.mit.edu/~poonen/slides/h10.pdf","type":"primary / scholarly"},{"label":"Turing · On Computable Numbers (1936)","url":"https://www.cs.virginia.edu/~robins/Turing_Paper_1936.pdf","type":"primary / scholarly"}]},{"source":"tarski","target":"julia-robinson","label":"Logic meets number theory","description":"Tarski supervised Robinson’s doctorate at Berkeley. Her thesis proved the full first-order theory of the rationals undecidable. Compare this with decidability for real closed fields: the domain and allowed language change what an algorithm can decide.","kind":"Documented supervision","sources":[{"label":"University of California · Julia Robinson, memorial by her colleagues","url":"https://mathshistory.st-andrews.ac.uk/Obituaries/Robinson_Julia_UC/","type":"primary / scholarly"}]},{"source":"bayer","target":"codd","label":"Logical data and physical indexes","description":"Thematic comparison: Codd’s relational model describes data logically; Bayer and McCreight’s B-trees organize ordered keys for physical access. A relational system can use a B-tree without making it part of the relational model."},{"source":"bayer","target":"tarjan","label":"Balance and self-adjustment","description":"Thematic comparison: B-trees maintain occupancy and equal leaf depth, while splay trees adjust to accesses. Their guarantees count different resources and should be compared within an explicit memory model."},{"source":"sedgewick","target":"knuth","label":"Algorithm analysis and supervision","description":"Documented supervision: Sedgewick completed his doctorate with Donald Knuth. Their profiles also form a reading route through the mathematical analysis of algorithms."},{"source":"bayer","target":"sedgewick","label":"Balanced-tree representations","description":"Documented research lineage: Bayer’s symmetric binary B-trees preceded Guibas and Sedgewick’s dichromatic framework. Multiway and binary views expose related balance invariants."},{"source":"sleator","target":"tarjan","label":"Self-adjusting data structures","description":"Documented collaboration: Sleator and Tarjan jointly developed splay trees and analyzed move-to-front and paging rules. Their papers compare total sequence costs under explicit models."},{"source":"sleator","target":"sedgewick","label":"Adaptation and balance","description":"Thematic comparison: splay trees reorganize around accesses, while red-black trees preserve balance constraints. The distinction is amortized adaptation versus a logarithmic worst-case height guarantee."},{"source":"edmonds","target":"goemans","label":"From integral polytopes to rounding","description":"Conceptual reading link: compare the exact matching polytope with the semidefinite relaxation and rounding used for MAX-CUT."},{"source":"whitney","target":"edmonds","label":"Matroid structure and optimization","description":"Whitney’s matroid viewpoint provides the independence structure whose exchange axiom underlies the greedy optimization discussed in this profile."},{"source":"lyons","target":"lovasz","label":"Sparse laws and dense kernels","description":"Conceptual reading link: distinguish unimodular rooted graph laws from dense graphons, rather than treating them as interchangeable limits."},{"source":"gromov","target":"lyons","label":"Geometry and random infinite networks","description":"Conceptual reading link: compare coarse group geometry with invariant probabilistic structure on infinite graphs."},{"source":"aldous","target":"lyons","label":"Unimodular random networks","description":"Documented collaboration: Aldous and Lyons developed the theory in Processes on Unimodular Random Networks."},{"source":"aldous","target":"gromov","label":"Two notions of limit","description":"Conceptual reading link: compare probabilistic local limits with rescaled metric limits such as the continuum random tree."},{"source":"edmonds","target":"aldous","label":"Matching: algorithms and random asymptotics","description":"Conceptual reading link: exact finite matching algorithms and the infinite-tree analysis of random assignment answer different questions about matching."},{"source":"schramm","target":"aldous","label":"Two views of random limits","description":"Conceptual reading link: compare Benjamini–Schramm neighborhood limits with Aldous's objective method and continuum random tree."},{"source":"schramm","target":"lyons","label":"Random rooted networks","description":"Conceptual reading link: local weak limits of finite graphs satisfy the mass-transport identities developed systematically by Aldous and Lyons."},{"source":"kechris","target":"gaifman","label":"Two different logical constraints","description":"Conceptual reading link: Gaifman locality concerns first-order descriptions, whereas Borel combinatorics constrains the definability of global solutions."},{"source":"kechris","target":"schramm","label":"Which hyperfiniteness?","description":"Conceptual reading link: compare finite graph decompositions, random rooted limits, and Borel or measured equivalence relations without conflating their definitions."},{"source":"gromov","target":"weiss","label":"Sofic approximation and dynamics","description":"Gromov's group-approximation framework and Weiss's naming and dynamical treatment of sofic groups provide a documented connection."},{"source":"weiss","target":"kechris","label":"Actions and equivalence relations","description":"Conceptual reading link: compare finite approximation of actions with Borel and measured orbit-equivalence theory."},{"source":"ornstein","target":"weiss","label":"Amenable entropy and isomorphism","description":"Ornstein and Weiss jointly developed entropy and isomorphism theory for amenable-group actions."},{"source":"shannon","target":"ornstein","label":"Information rate becomes an invariant","description":"Conceptual reading link: Shannon entropy of the base distribution is the complete invariant for classical Bernoulli ℤ-shifts."},{"source":"ornstein","target":"aldous","label":"Different uses of finite approximation","description":"Conceptual reading link: contrast classification by compatible process approximations with Aldous's objective method for asymptotic optimization."}],"trails":[{"id":"limits","title":"The limits of computation","tag":"LOGIC → COMPLEXITY","description":"From axioms and universal machines to reductions and the logical description of efficient computation.","ids":["hilbert","godel","turing","cook","karp","immerman"],"field":"complexity"},{"id":"proofs","title":"From proofs to approximation","tag":"YOUR CONVERSATION THREAD","description":"How interaction and a few random checks turned into sharp limits on approximation algorithms.","ids":["goldwasser","shamir","fortnow","hastad","khot","odonnell","goemans","raghavendra","lasserre"],"field":"algorithms"},{"id":"symmetry","title":"When graphs look the same","tag":"GRAPHS → LOGIC","description":"Follow symmetry, refinement and locality into the structure of sparse graphs.","ids":["cayley","babai","weisfeiler","immerman","gaifman","nesetril"],"field":"graphs"},{"id":"randomness","title":"What randomness makes possible","tag":"PROBABILITY → ALGORITHMS","description":"From dependent random processes and existence proofs to pseudorandom generators.","ids":["markov","kolmogorov","polya","erdos","lovasz","nisan","wigderson"],"field":"analysis"},{"id":"algebra","title":"The algebra inside complexity","tag":"ALGEBRA → CIRCUITS","description":"Move from structural algebra and polynomial certificates to arithmetic circuits and proof systems.","ids":["galois","noether","hilbert","grothendieck","valiant","razborov","lasserre"],"field":"algebra"},{"id":"information","title":"Information, secrecy, trust","tag":"INFORMATION → CRYPTOGRAPHY","description":"A route through information limits, public-key exchange and proofs that protect secrets.","ids":["boole","shannon","diffie","hellman","rivest","shamir","goldwasser"],"field":"information"},{"id":"programming","title":"Giving programs a language","tag":"MACHINES → MEANING","description":"From symbolic instructions to high-level languages, invariants and formal semantics.","ids":["lovelace","turing","hopper","backus","dijkstra","hoare","scott","milner"],"field":"systems"},{"id":"space","title":"What can a space be?","tag":"GEOMETRY → TOPOLOGY","description":"See geometry expand from coordinates and curvature to manifolds, flows and moduli.","ids":["euclid","descartes","gauss","riemann","poincare","thurston","perelman","mirzakhani"],"field":"geometry"}],"scope":{"originalMap":100,"additional":18,"expandedProfiles":31},"standards":["The catalogue contains the original 100-person map and 18 additional people profiled later in the conversation. Repeated profiles have been merged.","The 31 expanded profiles are edited learning articles, not verbatim transcripts. The other 87 entries are compact introductions with a signature idea and further-reading link.","Connections are directed reading and conceptual links, not a genealogy. An arrow does not assert direct mentorship, sole invention or chronological priority. Each connection has a descriptive label.","Proof sketches are not full proofs. Hypotheses, model restrictions and conditional results are stated where they change the meaning of the claim.","This is a static educational edition, not a live research-status service. UGC-based results are labeled as conditional. External reading links require an internet connection.","Approximate ancient dates are marked. Birth years are used for the timeline rather than unverified present-day roles or life-status claims.","Your bookmarks, notes, read marks and preferences stay in this browser when storage is available. They are not synchronized to ChatGPT, an account, or another device.","Research interest prompts help select another entry from this catalogue. They do not create a scheduled task or generate a new article."],"exploration":{"edition":"2.0 — Reader’s edition","concepts":[{"id":"computation","name":"Limits of computation","question":"What can a machine actually do?","description":"Move between computability, reductions, circuits and the resources needed to solve a problem.","field":"complexity","terms":["computability","computable","Turing","NP-complete","NP-completeness","reductions","circuit","Diophantine","undecidable"],"start":"turing","plate":"computation","takeaway":"Search is not always a decision.","caption":"A finite tree and an unfinished chain illustrate two kinds of search. The drawing is schematic, not a runtime bound.","explanation":"A solution can be easy to check even when a search has no known stopping point. For a finite Boolean formula, exhausting all assignments eventually yields YES or NO. For an integer polynomial, expanding the search box finds any existing solution, but an unsuccessful run may continue forever.\n\nTuring supplies the language for this distinction; Julia Robinson’s work helps carry it into arithmetic. Ask first whether a total algorithm exists, then what resources it needs. Decidability and efficiency are separate questions.","sources":[{"label":"Turing · On Computable Numbers (1936)","url":"https://www.cs.virginia.edu/~robins/Turing_Paper_1936.pdf","type":"primary / scholarly"},{"label":"Poonen · Hilbert’s Tenth Problem, slides 2–4 (2006)","url":"https://math.mit.edu/~poonen/slides/h10.pdf","type":"primary / scholarly"}],"bridges":[{"to":"verification","why":"A witness can settle a YES instance without giving a method that decides every instance."},{"to":"algebra","why":"Encoding computation with polynomials turns a question about programs into a question about integer solutions."}]},{"id":"verification","name":"Proof & verification","question":"Can checking be easier than solving?","description":"Read the profiles on formal proofs, interactive verification and probabilistically checkable proofs.","field":"logic","terms":["interactive proof","verification","zero knowledge","zero-knowledge","PCP","proof system","sum-check"],"start":"goldwasser","plate":"verification","takeaway":"A witness and a search are different objects.","caption":"The highlighted five-edge tour is a certificate: it visits each vertex once and returns to its start. The faint diagonals are other graph edges.","explanation":"A proposed Hamiltonian cycle can be checked by verifying its edges and its visits to vertices. The certificate tells the checker where to look. Finding such a certificate is a different task, and the absence of one proposed certificate does not prove that none exists.\n\nInteractive proofs replace a single handed-over witness with a conversation and a verifier’s random choices. Zero knowledge adds a further demand about what that conversation reveals. Neither interaction nor a short convincing transcript by itself establishes zero knowledge.","sources":[{"label":"Goldwasser, Micali & Rackoff · The Knowledge Complexity of Interactive Proof Systems","url":"https://www.cs.miami.edu/home/burt/learning/csc609.221/goldwasser-micali-rackoff-knoweldge-complexity.pdf"}],"bridges":[{"to":"computation","why":"Verification conditions become meaningful only after the computation and resource bounds of the checker are specified."},{"to":"information","why":"A proof may convince while controlling disclosure. Secrecy is an additional property, not a synonym for correctness."}]},{"id":"approximation","name":"Approximation & optimization","question":"How close to the best can we get?","description":"Explore the conversation between approximation algorithms, relaxations and hardness results.","field":"algorithms","terms":["approximation","MAX-CUT","semidefinite","Unique Games","optimization","sum-of-squares","pseudoexpectation"],"start":"goemans","plate":"approximation","takeaway":"A good answer needs a yardstick.","caption":"An original MAX-CUT example: filled and hollow vertices define the two sides. Four edges cross; the fifth stays on one side. An odd cycle cannot alternate all the way around.","explanation":"For the five-cycle, four crossing edges are optimal: cutting all five would require a two-coloring of an odd cycle. This small example gives both a construction and an upper bound. On larger graphs, certifying closeness to the optimum is often the difficult part.\n\nGoemans and Williamson relax MAX-CUT into a problem about vectors and round a solution back to a cut. Approximation ratios compare the resulting value with the unknown optimum; they are not percentages of instances solved exactly. Nonnegative edge weights are part of the standard guarantee.","sources":[{"label":"Goemans & Williamson · Improved Approximation Algorithms (1995)","url":"https://www.davidpwilliamson.net/work/publication/goemans-w-95-b/"}],"bridges":[{"to":"spaces","why":"Vector geometry can make a discrete optimization problem easier to bound before rounding."},{"to":"verification","why":"A certificate of a good feasible solution differs from a certificate that no much better solution exists."}]},{"id":"local-global","name":"Local views, global structure","question":"What can a neighborhood reveal?","description":"Follow refinement, logical locality and sparsity through the graph-theory profiles.","field":"graphs","terms":["locality","local-to-global","neighborhood","neighbourhood","Weisfeiler","sparse graph","bounded expansion","nowhere dense"],"start":"gaifman"},{"id":"randomness","name":"Randomness & probability","question":"When is chance a mathematical tool?","description":"Find random constructions, dependent events and the algorithms that use or replace randomness.","field":"analysis","terms":["randomness","pseudorandom","random walk","probabilistic method","probability","Local Lemma","martingale"],"start":"erdos"},{"id":"algebra","name":"The polynomial viewpoint","question":"What happens when logic becomes algebra?","description":"Explore arithmetization, polynomial identities, arithmetic circuits and algebraic certificates.","field":"algebra","terms":["polynomial","arithmetization","Nullstellensatz","arithmetic circuit","permanent","sum of squares","sum-of-squares"],"start":"shamir"},{"id":"symmetry","name":"Symmetry & sameness","question":"When are two objects really the same?","description":"Read about permutations, invariants, group actions and graph isomorphism.","field":"geometry","terms":["symmetry","symmetric","group action","permutation","invariant","isomorphism"],"start":"babai","plate":"symmetry","takeaway":"A new drawing need not be a new graph.","caption":"The two four-cycles are isomorphic. One matching is 1↔c, 2↔a, 3↔d, 4↔b; every edge is preserved. Coordinates are not part of the abstract graph.","explanation":"A graph isomorphism is a bijection of vertices preserving adjacency. Moving the vertices on the page or changing their names does not change that structure. A useful invariant must therefore survive these operations.\n\nAn invariant is a test, not necessarily a complete description: the same degree sequence does not guarantee isomorphism. For example, one six-cycle and two disjoint triangles both have six degree-two vertices, yet only the first is connected. This is why refinement and stronger structural methods matter.","sources":[{"label":"Babai · Graph Isomorphism in Quasipolynomial Time","url":"https://arxiv.org/abs/1512.03547"}],"bridges":[{"to":"local-global","why":"Matching local signatures may conceal different global structures; connectivity is already a simple example."},{"to":"information","why":"Confusability graphs translate a communication question into a structural one."}]},{"id":"counting","name":"Counting & combinatorics","question":"Why can counting be harder than finding?","description":"Find counting problems, generating functions, combinatorial structures and enumeration.","field":"graphs","terms":["counting","enumeration","generating function","permanent","#P","perfect matching"],"start":"valiant"},{"id":"information","name":"Information & secrecy","question":"What can be sent without being revealed?","description":"Explore information, coding, cryptography and proof systems that protect secrets.","field":"information","terms":["information","entropy","cryptography","cryptographic","encryption","zero knowledge","zero-knowledge","coding","error correction","Hamming","redundancy"],"start":"shannon","plate":"information","takeaway":"Redundancy can protect a message.","caption":"An original worked example: 000 becomes 010 after one bit flips; majority decoding recovers 000. This is a repetition code, not the seven-bit Hamming code.","explanation":"Represent a bit by either 000 or 111. Each valid word has a neighborhood of strings one flip away; the two neighborhoods do not overlap. That separation makes correction possible. Two flips can cause a wrong answer, so the error assumption is part of the claim.\n\nHamming studies explicit codes and decoding. Shannon asks which rates a channel can sustain reliably. Blackwell asks how an observation changes the decisions available to its recipient. These are connected meanings of information, with different success criteria.","sources":[{"label":"Hamming · Error Detecting and Error Correcting Codes (1950)","url":"https://ineffectivetheory.com/edu/papers/hamming-codes-1950.pdf","type":"primary / scholarly"},{"label":"Shannon · A Mathematical Theory of Communication (1948)","url":"https://people.math.harvard.edu/~ctm/home/text/others/shannon/entropy/entropy.pdf","type":"primary / scholarly"},{"label":"Blackwell · Equivalent Comparisons of Experiments (1953), abstract and publication record","url":"https://celebratio.org/Blackwell_DH/article/255/","type":"primary / scholarly"}],"bridges":[{"to":"symmetry","why":"Distance and confusability turn messages into geometric or graph objects whose structure matters."},{"to":"learning","why":"A signal is useful because of what can be inferred or decided from it, not only how many bits it contains."}]},{"id":"learning","name":"Learning & intelligence","question":"What does it mean to learn a rule?","description":"Find profiles about learning from examples, reasoning and the representation of knowledge.","field":"information","terms":["learning","artificial intelligence","PAC","neural","causal","inference","decision","experiment","Blackwell"],"start":"valiant","plate":"learning","takeaway":"Better information means more possible decisions.","caption":"A finite experiment: E reveals a hidden bit; a state-independent random channel K flips it with probability 1/4 to produce F.","explanation":"Imagine holding a perfect signal while another observer sees a randomly corrupted version. You can imitate their observation and then use their decision rule. They cannot generally reverse the corruption. This simulation explains one direction of Blackwell’s comparison of experiments.\n\nLearning a rule from examples adds its own questions about the hypothesis class, sample size, and generalization. The connection is a reading bridge: a more informative experiment is not automatically a faster learning algorithm.","sources":[{"label":"Blackwell · Equivalent Comparisons of Experiments (1953), abstract and publication record","url":"https://celebratio.org/Blackwell_DH/article/255/","type":"primary / scholarly"},{"label":"Bickel · David Blackwell: An explorer in mathematics and statistics (2020)","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7703635/","type":"primary / scholarly"}],"bridges":[{"to":"information","why":"Channels describe both communication and the observations available to a decision-maker."},{"to":"computation","why":"A useful statistical rule may still be expensive to compute; information and computational resources are different constraints."}]},{"id":"spaces","name":"Geometry & spaces","question":"What can a space be?","description":"Follow geometric and topological ideas, from coordinates to manifolds and schemes.","field":"geometry","terms":["geometry","topology","manifold","cohomology","scheme","curvature"],"start":"riemann"},{"id":"programs","name":"Programs & their meaning","question":"How do we make computation precise?","description":"Explore programming languages, formal semantics, verification and algorithm design.","field":"systems","terms":["programming","compiler","program verification","semantics","type theory","algorithm design","programs"],"start":"dijkstra"},{"id":"data-structures","name":"Data structures","question":"How should information be organized for the next operation?","description":"Compare balance, adaptation, and storage locality through search trees, heaps, and union–find.","field":"algorithms","terms":["data structures","data-structure","splay","B-tree","red-black","heap","union–find","union-find","amortized"],"start":"tarjan","plate":"data-structures","takeaway":"Choose the operations—and the cost you are trying to reduce.","caption":"Splaying 10 in the three-key tree uses a zig-zig: first rotate 20 above 30, then 10 above 20. Key order is preserved; the next access to 10 starts at the root.","explanation":"A data structure is a representation together with operations and guarantees. Ask what must stay true after an update, which operations are frequent, and what counts as expensive. An ordered tree supports interval queries; a heap exposes an extremal key; union–find maintains a partition. Their interfaces solve different problems.\n\nStart with Tarjan for amortized analysis and the 2026 almost-dynamic-optimality result for splay trees. Sleator develops the online viewpoint: compare an adaptive algorithm with a competitor that knows future requests. Sedgewick explains how local rules preserve balanced binary search trees. Bayer changes the unit of cost to storage-page transfers.\n\nThe diagram illustrates adaptation, not a proof of optimality. Splaying can leave a tall tree, a red-black tree retains a logarithmic height bound, and a B-tree keeps many keys in each page. Worst-case, amortized, competitive, and page-transfer bounds answer different questions. None alone establishes that one structure is best for every workload.","sources":[{"label":"Sleator and Tarjan · self-adjusting search trees","url":"https://www.cs.cmu.edu/~sleator/papers/self-adjusting.pdf"},{"label":"Sedgewick and Wayne · balanced search trees","url":"https://algs4.cs.princeton.edu/33balanced/"},{"label":"Chmel et al. · almost dynamic optimality (2026 preprint)","url":"https://arxiv.org/abs/2607.18498"}],"bridges":[{"to":"computation","why":"A representation determines the resources needed to execute an algorithm, even when the underlying mathematical problem stays the same."},{"to":"verification","why":"Ordering, balance, and occupancy are invariants: each update must preserve the properties that make future operations correct."}]}]},"publications":[{"event_id":"edit-2026-09-28-blackwell-connected-ideas","source_key":"edit:2026-09-28:blackwell:connected-ideas","created_at":"2026-09-28T16:08:51Z","kind":"profile-edit","person_id":"blackwell","name":"David Blackwell","summary":"Add Blackwell: statistical experiments, garbling, and an explicit two-state example.","revision":"3617b17f99f06b9d20702241540116d5b19f06322926377b42204061808487b9","article_markdown":"# David Blackwell — When is one observation more useful?\n\nDavid Blackwell worked across statistics, probability, game theory, and information theory. His comparison of experiments turns “better information” into a precise question about the decisions an observer can make.\n\nIf one observation is obtained by randomly degrading another, the original observer can reproduce every decision available to the degraded observer. More useful information is defined relative to what decisions it enables.\n\nF = EK  ⇒  every rule using F can be simulated using E\n\n## An experiment is a channel from a hidden state\n\nFor finitely many states and signals, describe an experiment by a matrix E. Row θ gives the probabilities of its possible signals when the state is θ. A decision rule maps a signal to an action, possibly at random. A loss function then tells us how costly that action is in each state. This makes “useful” testable rather than impressionistic.\n\n## Garbling supplies a simulation\n\nSuppose a second experiment is F = EK, where K is a stochastic matrix that processes the first signal without access to the hidden state. The observer of E can sample K and then apply any rule designed for F. The distribution of actions, and hence the risk in every state, is the same.\n\nBlackwell’s comparison theory characterizes this ordering through performance across decision problems. The finite setting is enough to see the central idea: an experiment is better when it permits all the decisions of the other, not merely when it scores better on one chosen task.\n\n## A two-state example\n\nLet E reveal a hidden bit perfectly. Let K flip that bit with probability 1/4. Then F is a noisy observation with 3/4 chance of agreement. Someone holding E can imitate F by tossing a coin; someone holding F cannot generally reconstruct E.\n\nTo guess an equally likely hidden bit with zero-one loss, the perfect signal has error 0 and the noisy signal has minimum error 1/4. But if both states call for the same action, the signals are equally useful for that particular task. A strict difference on every task is not required.\n\n## A bridge, with a boundary\n\nCompare this with Shannon’s information quantities. A channel description is shared mathematical language, but a single information score for one prior does not settle comparison for every decision problem. The atlas uses this as a thematic bridge to communication and learning, not as evidence that all these theories ask the same question.\n\n## Three directions to explore\n\n1. Can you construct two experiments that are incomparable because each helps a different decision?\n\n2. Why must the garbling matrix be independent of the hidden state?\n\n3. When does compressing an observation preserve every decision you care about?\n\n## Sources\n\n- [Blackwell · Equivalent Comparisons of Experiments (1953), abstract and publication record](https://celebratio.org/Blackwell_DH/article/255/)\n\n- [Bickel · David Blackwell: An explorer in mathematics and statistics (2020)](https://pmc.ncbi.nlm.nih.gov/articles/PMC7703635/)\n\n- [Shannon · A Mathematical Theory of Communication (1948)](https://people.math.harvard.edu/~ctm/home/text/others/shannon/entropy/entropy.pdf)\n"},{"event_id":"edit-2026-09-28-hamming-connected-ideas","source_key":"edit:2026-09-28:hamming:connected-ideas","created_at":"2026-09-28T16:08:51Z","kind":"profile-edit","person_id":"hamming","name":"Richard Hamming","summary":"Add Hamming: distance, redundancy, and a worked decoding example.","revision":"e0bb2e751799c0e7dec6fbefcf1198548550badc88934dd288a683a182f6df6c","article_markdown":"# Richard Hamming — Give a message room to survive\n\nRichard Hamming turned unreliable digital operations into a mathematical question: how should valid messages be arranged so that a small error can be recognized and repaired?\n\nRedundancy can create distance between valid messages. The receiver uses that distance to distinguish a damaged message from a different intended message.\n\nd(x, y) = number of positions where x and y differ\n\n## From a failed calculation to a code\n\nWorking with computers at Bell Laboratories, Hamming studied parity checks and their limits. His 1950 paper gave explicit constructions for detecting and correcting errors; his later retrospective connects the work to the practical need for dependable computation. The mathematical object is a code: a chosen subset of all possible strings.\n\n## A small example you can decode\n\nEncode 0 as 000 and 1 as 111. If exactly one position flips, the received word still has a majority of the intended bit. Thus 010 decodes to 000 and 101 decodes to 111. The two valid words differ in three positions.\n\nThis is the repetition code, an elementary illustration rather than the more efficient seven-bit Hamming construction. It spends three transmitted bits on one bit of information. Its simplicity lets you see the tradeoff before studying better codes.\n\n## Distance turns noise into geometry\n\nFor a code to correct every pattern of at most t bit errors, distinct codewords must have distance at least 2t + 1. Otherwise their radius-t neighborhoods can overlap, leaving the receiver unable to identify the sender’s choice uniquely. A minimum distance of three therefore permits single-error correction.\n\nHamming’s seven-bit code carries four information bits. Three parity checks produce a syndrome; for a single-bit error, it identifies which of the seven positions changed. Two errors are outside that correction guarantee.\n\nd_min ≥ 2t + 1\n\n## Existence and construction ask different questions\n\nShannon describes achievable communication rates for a channel model; Hamming supplies explicit finite codes and a decoding rule. Read them together to distinguish a limit theorem from an actual method. A guarantee against one arbitrary error in a short block is different from a probability of error tending to zero as blocks grow.\n\n## Three directions to explore\n\n1. Why do overlapping error neighborhoods prevent unique decoding?\n\n2. How can three parity checks identify seven possible single-bit errors?\n\n3. What changes when errors arrive in bursts rather than independently?\n\n## Sources\n\n- [Hamming · Error Detecting and Error Correcting Codes (1950)](https://ineffectivetheory.com/edu/papers/hamming-codes-1950.pdf)\n\n- [Naval Postgraduate School · Richard Hamming](https://library.nps.edu/richard-w-hamming)\n\n- [Hamming · Retrospective on error correction (1982)](https://garfield.library.upenn.edu/classics1982/A1982NY35700001.pdf)\n\n- [Shannon · A Mathematical Theory of Communication (1948)](https://people.math.harvard.edu/~ctm/home/text/others/shannon/entropy/entropy.pdf)\n"},{"event_id":"edit-2026-09-28-julia-robinson-connected-ideas","source_key":"edit:2026-09-28:julia-robinson:connected-ideas","created_at":"2026-09-28T16:08:51Z","kind":"profile-edit","person_id":"julia-robinson","name":"Julia Robinson","summary":"Add Julia Robinson with shared attribution and the distinction between search and decision.","revision":"8ad202eaf274a4c36ef4e73034b026b437b5a45b985e8234455b950ecc67cb8a","article_markdown":"# Julia Robinson — When equations encode computation\n\nJulia Robinson connected number theory with mathematical logic. Her work with Martin Davis and Hilary Putnam prepared the route to Yuri Matiyasevich’s 1970 resolution of Hilbert’s tenth problem.\n\nA polynomial can encode a search. The surprise is that integer solutions can express every computably enumerable set, including sets whose membership cannot be decided by an algorithm.\n\na ∈ A ⇔ ∃x₁,…,xₙ ∈ ℤ : P(a,x₁,…,xₙ) = 0\n\n## A question about every equation\n\nHilbert’s tenth problem asks for one algorithm that takes any polynomial with integer coefficients and decides whether it has an integer solution. A collection of clever methods for particular equations is not yet that universal method. Robinson’s research helped show why the unrestricted demand cannot be met.\n\n## Finding a witness is not deciding absence\n\nFor x² + y² = 25, the pair (3,4) is a witness that can be checked by substitution. For an arbitrary equation in finitely many integer variables, search successively through boxes of radius 0, 1, 2, and so on. Any existing solution eventually appears. If none exists, this search never announces that fact.\n\nThe difference between recognizing a successful search and deciding both outcomes is the bridge to computability. A bound on the search would change the task, but the unrestricted problem provides no such bound.\n\n## The theorem belongs to a chain of work\n\nDavis, Putnam, and Robinson established a crucial exponential-Diophantine representation result. Matiyasevich supplied the missing step in 1970. The resulting DPRM theorem says that computably enumerable sets are exactly the Diophantine sets. An algorithm deciding all integer polynomial equations would therefore decide sets known to be undecidable.\n\nCredit matters here: Robinson was a central contributor to a cumulative proof, not its sole author. The formula above describes representation of a set by a polynomial with extra variables; it is not a practical recipe for solving all equations.\n\n## The domain and the quantifiers matter\n\nRobinson’s doctoral work under Alfred Tarski established undecidability of the full first-order theory of the rational numbers. That theory allows alternating quantifiers and logical operations. Hilbert’s tenth problem asks only for existence of solutions. Do not identify these two decision problems, or silently replace integer solutions by rational or real solutions.\n\n## Three directions to explore\n\n1. Why does enumeration find every existing integer solution but fail to decide all negative cases?\n\n2. What must a reduction preserve when it turns a program into an equation?\n\n3. How does changing the allowed domain or quantifiers change a decision problem?\n\n## Sources\n\n- [University of California · Julia Robinson, memorial by her colleagues](https://mathshistory.st-andrews.ac.uk/Obituaries/Robinson_Julia_UC/)\n\n- [Poonen · Hilbert’s Tenth Problem, slides 2–4 (2006)](https://math.mit.edu/~poonen/slides/h10.pdf)\n\n- [Turing · On Computable Numbers (1936)](https://www.cs.virginia.edu/~robins/Turing_Paper_1936.pdf)\n"},{"event_id":"edit-2026-09-28-shannon-connected-ideas","source_key":"edit:2026-09-28:shannon:connected-ideas","created_at":"2026-09-28T16:08:51Z","kind":"profile-edit","person_id":"shannon","name":"Claude Shannon","summary":"Expand Shannon with an explicit code example and routes to Hamming and Blackwell.","revision":"94b202fccb32a0bf9a77e49ebbc8da8a1ef69f26646eab072d70d647fcada528","article_markdown":"# Claude Shannon — Information becomes a quantity\n\nShannon linked Boolean algebra to switching circuits and founded information theory. Entropy, channel capacity and coding theorems made communication limits mathematically precise.\n\nEntropy measures average information under a distribution. For an independent identically distributed source, it controls asymptotic lossless compression rates.\n\nH(X) = −Σₓ p(x) log₂ p(x)\n\n## The right unit of information\n\nAn outcome of probability p has surprisal −log₂p. Averaging this over the source distribution gives entropy. A highly biased bit has entropy below one because its outcome is usually predictable.\n\nH(X) = −Σₓ p(x) log₂ p(x)\n\n```tex\nH(X)=-\\sum_x p(x)\\log_2 p(x)\n```\n\n## Two limits, not one\n\nSource coding concerns how far information can be compressed. Channel coding concerns how fast it can be transmitted reliably through noise. For a discrete memoryless channel, rates strictly below capacity allow codes with error tending to zero as block length grows.\n\nR < C ⇒ error → 0\n\n## Where graph theory enters\n\nZero-error communication is a different requirement from vanishing error. Confusability can be represented by a graph, leading to Shannon capacity and Lovász’s solution for the five-cycle.\n\nΘ(C₅) = √5\n\n## Try a code before taking a limit\n\nSend one bit using 000 or 111. Majority decoding repairs one flipped position, at the cost of a rate of 1/3 information bit per transmitted bit. This finite example belongs to error correction. It makes the role of redundancy tangible before a channel-capacity theorem asks which rates are possible with increasingly long blocks.\n\nHamming’s profile takes this geometric view further. Blackwell’s profile asks another question: whether the received observation supports every decision available from a better one. Neither comparison turns entropy into a measure of meaning.\n\n## Three directions to explore\n\n1. How does typical-set compression work?\n\n2. Why are zero-error and vanishing-error capacity different?\n\n3. How can a graph encode confusable symbols?\n\n## Sources\n\n- [MacTutor · historical biography](https://mathshistory.st-andrews.ac.uk/Biographies/Shannon/)\n\n- [Hamming · Error Detecting and Error Correcting Codes (1950)](https://ineffectivetheory.com/edu/papers/hamming-codes-1950.pdf)\n\n- [Blackwell · Equivalent Comparisons of Experiments (1953), abstract and publication record](https://celebratio.org/Blackwell_DH/article/255/)\n\n- [Shannon · A Mathematical Theory of Communication (1948)](https://people.math.harvard.edu/~ctm/home/text/others/shannon/entropy/entropy.pdf)\n\n- [Lovász · On the Shannon Capacity of a Graph (1979)](https://www.sfu.ca/~mdevos/notes/semidef/lovasz-theta.pdf)\n"},{"event_id":"edit-2026-09-28-turing-connected-ideas","source_key":"edit:2026-09-28:turing:connected-ideas","created_at":"2026-09-28T16:08:51Z","kind":"profile-edit","person_id":"turing","name":"Alan Turing","summary":"Expand Turing with search versus decision and a route into integer equations.","revision":"18c2d517d75d88bf0d714d0fb79a82694417303a258a03aafa19e6266500ce66","article_markdown":"# Alan Turing — A mathematical model of computation\n\nTuring defined an abstract computing machine, established universal simulation and proved an undecidability result. His later work included cryptanalysis, machine intelligence and morphogenesis.\n\nOne machine can simulate the description of another. Encoding programs as data makes universality and diagonal arguments possible.\n\nU(⟨M,x⟩) = M(x)\n\n## The universal machine\n\nA finite transition rule controls a tape, a read/write head and a state. Encoding such a rule lets a single universal machine simulate every other machine. Programs themselves become manipulable data.\n\nU(⟨M,x⟩) = M(x)\n\n```tex\nU(\\langle M,x\\rangle)=M(x)\n```\n\n## A diagonal contradiction\n\nAssume a total procedure decides whether any program halts on any input. Construct D so that D(M) loops if that procedure predicts M(M) halts, and halts otherwise. Applying D to itself forces either answer to be wrong.\n\nD(D): halt ⇔ do not halt\n\n## Computability comes before efficiency\n\nSAT is decidable by exhaustive search, even when that is expensive. Halting has no total deciding algorithm at all. Turing’s later contributions to cryptanalysis and machine intelligence do not erase this fundamental distinction.\n\ndecidable ≠ efficiently decidable\n\n## From an endless search to an equation\n\nRun a search over all integer tuples and stop if a polynomial evaluates to zero. This procedure recognizes a solution when one exists; an endless unsuccessful run proves nothing by itself. Julia Robinson’s profile follows the deeper result that integer equations can represent arbitrary computably enumerable sets.\n\nContrast SAT: with finitely many Boolean variables there are only finitely many assignments to check. Both tasks admit a search, but only the bounded search is automatically a decision procedure. This is why “hard to find” and “impossible to decide in general” should remain separate ideas.\n\n## Three directions to explore\n\n1. How is universal simulation encoded?\n\n2. How can halting reduce to a concrete combinatorial problem?\n\n3. Which statements about program behavior are decidable under restrictions?\n\n## Sources\n\n- [MacTutor · historical biography](https://mathshistory.st-andrews.ac.uk/Biographies/Turing/)\n\n- [Turing · On Computable Numbers (1936)](https://www.cs.virginia.edu/~robins/Turing_Paper_1936.pdf)\n\n- [Poonen · Hilbert’s Tenth Problem, slides 2–4 (2006)](https://math.mit.edu/~poonen/slides/h10.pdf)\n"},{"event_id":"edit-2026-09-29-cook-worked-profile","source_key":"edit:2026-09-29:cook:worked-profile","created_at":"2026-09-28T22:38:09Z","kind":"profile-edit","person_id":"cook","name":"Stephen Cook","summary":"Expand Stephen Cook with a worked example, proof reasoning, limitations, and specific further questions.","revision":"f69ba44e6c13c5d77654bf53aa3b3952a512d0b28503245a4443676c8c33cd14","article_markdown":"# Stephen Cook — The first universal NP problem\n\nCook proved that satisfiability can encode every polynomial-time nondeterministic computation. Levin independently developed closely related completeness ideas.\n\nCook–Levin establishes a starting point for NP-completeness. The theorem does not prove that SAT requires superpolynomial time.\n\n∀L∈NP, L ≤ₚ SAT\n\n## Checking and finding are different tasks\n\nStephen Cook’s 1971 theorem made it possible to compare apparently unrelated computational problems through efficient translations. In its familiar modern formulation, Boolean satisfiability, or SAT, is NP-complete: SAT belongs to NP, and every problem in NP has a polynomial-time many-one reduction to SAT.\n\nNP describes decision problems whose yes answers have certificates of polynomial length that a deterministic algorithm can check in polynomial time. A certificate is evidence for a particular input. The definition does not supply an efficient way to discover it. Read the theorem as a bridge from arbitrary efficient verification to one common logical language.\n\n## A certificate you can check\n\nTake the formula (a OR b) AND (NOT a OR c) AND (NOT b OR NOT c). The assignment a=true, b=false, c=true satisfies it: the three clauses become true OR false, false OR true, and true OR false. Checking the proposed assignment requires inspecting the clauses.\n\nTo find an assignment by brute force, however, one could try all 2^n assignments for n variables. This describes a simple algorithm, not a proof that every algorithm needs exponential time. The distinction between an obvious search cost and an unavoidable lower bound is central to reading complexity claims accurately.\n\n## A reduction preserves the answer\n\nA many-one reduction maps each input x of problem A to an input f(x) of problem B in polynomial time, with x a yes-instance exactly when f(x) is a yes-instance. Thus an efficient algorithm for B would give one for A: translate, then solve. The direction matters. To show that B is at least as hard as A, reduce A to B.\n\nAs a small illustration, encode a triangle’s three-coloring problem using variables x(v,c), one for each vertex v and color c. A clause for each vertex requires at least one color. Pairwise negative clauses prohibit two colors at one vertex. For each edge and color, another clause prohibits its endpoints from both having that color. A satisfying assignment now corresponds exactly to a proper coloring. For a triangle there are nine variables, and assigning its three vertices three distinct colors satisfies all these conditions.\n\nx ∈ A ⇔ f(x) ∈ B\n\n## How a computation becomes a formula\n\nCook’s proof encodes an accepting, polynomially bounded computation using Boolean variables for times, tape positions, symbols, states, and the head location. Clauses enforce a legal start, consistent configurations, legal transitions, and acceptance. The resulting formula has polynomial size and is satisfiable exactly when such a computation exists.\n\nThe original paper states its principal theorem using oracle reductions to tautologies. Its construction explicitly produces a conjunctive-normal-form formula satisfiable exactly when the machine accepts; this is the part underlying the modern SAT formulation. Keeping that distinction visible helps when moving from a textbook statement to the historical paper.\n\n## What completeness does and does not settle\n\nSAT’s completeness says that a polynomial-time SAT algorithm would yield polynomial-time algorithms for every problem in NP. It does not prove that such an algorithm is impossible. Nor does it mean that every individual SAT instance is hard: special structure and easy cases remain possible.\n\nRead Karp next for the spread of reductions across combinatorial problems, and Levin for the independently developed completeness viewpoint. Read Dijkstra for a contrast in method: his shortest-path argument constructs an efficient solution for a specific problem under explicit assumptions. Cook provides a way to transfer the implications of a hypothetical efficient solution across an entire class.\n\n## Three directions to explore\n\n1. Write all the clauses in the triangle-coloring example. What changes if only two colors are allowed, and how can you prove that formula unsatisfiable?\n\n2. If A reduces to B, which consequences follow from an efficient algorithm for B, and which do not follow merely from an efficient algorithm for A?\n\n3. In the computation encoding, what breaks if local transition constraints are omitted? Can you build a satisfying assignment that invents an accepting computation?\n\n## Sources\n\n- [Cook · The Complexity of Theorem-Proving Procedures (1971), transcription](https://www.cs.cmu.edu/~15455/resources/Cook1971-complx-thm-proof.pdf)\n"},{"event_id":"edit-2026-09-29-dijkstra-worked-profile","source_key":"edit:2026-09-29:dijkstra:worked-profile","created_at":"2026-09-28T22:38:09Z","kind":"profile-edit","person_id":"dijkstra","name":"Edsger Dijkstra","summary":"Expand Edsger Dijkstra with a worked example, proof reasoning, limitations, and specific further questions.","revision":"ee0f845c5e96c5794abb93e5d53f63f0bc9b3b922140d4d52aedbb5d1ce4844b","article_markdown":"# Edsger Dijkstra — Algorithms with invariants\n\nDijkstra developed influential algorithms and methods for structured programming and correctness. His shortest-path algorithm is a model of greedy reasoning.\n\nWith nonnegative edge weights, the closest unsettled vertex can be finalized safely. The proof invariant is as important as the implementation.\n\ndist(v) = minᵤ {dist(u)+w(u,v)}\n\n## A program needs an argument\n\nEdsger Dijkstra helped establish programming as a mathematical discipline. His work on routes, structured programs, and program derivation shares a question: what fact remains true as a computation changes its state? A useful algorithm comes with a reason its next step is safe.\n\nHis shortest-path paper appeared in 1959. Later, his work on guarded commands and weakest preconditions made the relationship between programs and proofs explicit. These are different contributions, but an invariant provides a useful way to read them together.\n\n## Follow a route by hand\n\nConsider a directed network with edges S→A of cost 6, S→B of cost 2, B→A of cost 1, B→T of cost 7, and A→T of cost 2. We want the cheapest route from S.\n\nStart with distance 0 at S and infinity elsewhere. After examining S, the tentative distances are A=6 and B=2. Finalize B, the closest unsettled vertex. Its outgoing edges improve A to 3 and give T a tentative distance of 9. Finalize A next; its edge to T improves T to 5. The resulting route S→B→A→T costs 2+1+2=5.\n\nA tentative distance is the cost of a route already discovered, not a promise that no better route exists. Finalizing a vertex is the moment that this upper bound becomes a proven optimum.\n\nd(v) ← min(d(v), d(u) + w(u,v))\n\n## Why the smallest tentative distance is safe\n\nAssume every edge weight is nonnegative. Keep the invariant that finalized vertices have their true shortest distances, and that outgoing edges from them have been examined. Let u have the smallest finite tentative distance among unsettled vertices. If a cheaper route to u existed, take its first unsettled vertex x. Its predecessor was finalized, so relaxation already gave x a tentative distance no larger than that route’s prefix. Nonnegative remaining edges make this prefix no more expensive than the whole route to u. That would give x a tentative distance smaller than u’s, contradicting the choice of u.\n\nThis proof explains the hypothesis. With edges S→A=2, S→B=5, and B→A=−4, finalizing A at 2 is premature: S→B→A costs 1. There is no negative cycle in this example; one negative edge is enough to break the argument.\n\n## The proof can guide the design\n\nDijkstra’s weakest precondition wp(C,Q) describes exactly which initial states guarantee that program C terminates with result condition Q. For an assignment x:=x+1 and desired result x>10 over mathematical integers, the weakest precondition is x>9. Work backward from what must hold afterward to what must hold beforehand.\n\nHis guarded-command paper explicitly credits Hoare’s use of predicates to describe states. The distinction to watch is termination: a partial-correctness claim permits nontermination, whereas this weakest-precondition interpretation guarantees a terminating computation.\n\n## Where to go next\n\nRead Hoare for the rules that organize an invariant into a program proof. Read Bellman to compare methods that repeatedly improve distance estimates with Dijkstra’s irrevocable finalization. Read Cook to change the question from “why does this algorithm work?” to “what would an efficient algorithm for this whole problem class imply?” These are conceptual reading connections, not claims that one theorem historically caused another.\n\n## Three directions to explore\n\n1. In the five-edge example, what changes if B→A has cost 10? Which distances become final in which order, and why?\n\n2. Can you strengthen the shortest-path invariant to prove that following stored predecessor pointers reconstructs an optimal route, including when some edge weights are zero?\n\n3. For a program that searches an unbounded space, what separates a precondition guaranteeing a correct answer if it returns from one guaranteeing that it returns?\n\n## Sources\n\n- [Dijkstra · retrospective on his 1959 graph paper](https://www.cs.utexas.edu/~EWD/ewd08xx/EWD841a.PDF)\n\n- [Dijkstra · Guarded commands, non-determinacy and formal derivation of programs](https://www.cs.utexas.edu/~EWD/transcriptions/EWD04xx/EWD472.html)\n"},{"event_id":"edit-2026-09-29-hoare-worked-profile","source_key":"edit:2026-09-29:hoare:worked-profile","created_at":"2026-09-28T22:38:09Z","kind":"profile-edit","person_id":"hoare","name":"C. A. R. Hoare","summary":"Expand C. A. R. Hoare with a worked example, proof reasoning, limitations, and specific further questions.","revision":"224679676f3b7ca9ceb8b9aef0b02a983e5fbbb3e045b6d0dd3c660e927805d8","article_markdown":"# C. A. R. Hoare — Programs as mathematical claims\n\nHoare introduced a logic for program correctness and developed influential algorithms, including quicksort. His logic separates preconditions, execution and postconditions.\n\nA Hoare triple expresses that, when C terminates from a state satisfying P, the resulting state satisfies Q. Termination requires additional reasoning for total correctness.\n\n{P} C {Q}\n\n## Make the claim precise\n\nC. A. R. Hoare’s 1969 paper gave a logical framework for reasoning about programs through assertions about their states. A proof can be assembled from rules for assignments, sequences, conditionals, and loops. This turns “the program works” into a claim with explicit assumptions and a specific promised result.\n\nWrite {P} C {Q}. Here P is a precondition, C a program, and Q a postcondition. In partial correctness, the claim is: every terminating execution of C that starts in a state satisfying P ends in a state satisfying Q. It does not by itself establish that execution terminates.\n\n{P} C {Q}\n\n## An assignment changes which condition you need\n\nSuppose the program is x:=x+1 and the desired result is x=8. The old value must be 7. The assignment rule obtains this by substituting the expression x+1 for x in the desired postcondition: x+1=8.\n\nFor two assignments x:=x+1; y:=2*x, a starting value x=7 guarantees y=16. First establish x=8, then use that fact as the next command’s precondition. The intermediate assertion connects two small proofs into one larger proof. These examples assume mathematical integers; machine overflow would require a different arithmetic model or additional bounds.\n\n## Prove a complete loop\n\nConsider a program that sums the first n nonnegative integers, where n is a fixed nonnegative integer. Initialize i:=0 and s:=0. While i<n, execute i:=i+1 followed by s:=s+i. The desired final result is s=n(n+1)/2.\n\nChoose the invariant 0≤i≤n and s=i(i+1)/2. Initialization establishes it because both i and s are zero. For preservation, call the old value of i k. The body first sets i=k+1, then adds k+1 to s. The new sum is k(k+1)/2+(k+1)=(k+1)(k+2)/2, exactly the formula required for the new i. The guard k<n also ensures i≤n afterward.\n\nAt exit, i<n is false. Together with i≤n, this gives i=n, so the invariant implies the desired answer. For n=3, the successive pairs (i,s) are (0,0), (1,1), (2,3), and (3,6).\n\nInvariant: 0 ≤ i ≤ n and s = i(i+1)/2\n\n## A correct result and a terminating program\n\nThe loop proof needs one more argument for total correctness. The quantity n−i is a nonnegative integer at every loop head and decreases by one on each iteration. It cannot decrease forever, so the loop terminates. This decreasing measure is often called a variant.\n\nContrast the loop “while true do skip.” A partial-correctness statement about its final state can hold vacuously because no execution reaches a final state. This is why the word “terminating” in the meaning of a Hoare triple matters. A useful specification should make clear whether eventual completion is part of the promise.\n\n## What the proof actually certifies\n\nA proof establishes a chosen specification under a chosen model. The summation proof assumes that n does not change and that arithmetic has no overflow. It also proves only the stated sum, not an unstated promise about memory usage or execution speed. Writing these boundaries down is part of correctness, not an optional footnote.\n\nDijkstra’s weakest preconditions provide a complementary backward view: start from the result and derive acceptable initial states. Turing provides a different boundary, showing why no general algorithm can decide termination for every arbitrary program and input. That limitation does not prevent us from proving termination of particular programs, as the decreasing measure above demonstrates.\n\n## Three directions to explore\n\n1. If the summation loop adds i to s before incrementing i, what result does it compute, and which invariant describes that different program?\n\n2. What upper bound on n would make the same calculation safe using a fixed-width integer type, including the intermediate multiplication in n(n+1)?\n\n3. Can a loop have a simple invariant but require a more subtle termination argument? Construct an example and identify a well-founded decreasing measure.\n\n## Sources\n\n- [Hoare · An Axiomatic Basis for Computer Programming (1969)](https://www.cs.cmu.edu/~crary/819-f09/Hoare69.pdf)\n\n- [Dijkstra · weakest preconditions, invariants and termination](https://www.cs.utexas.edu/~EWD/transcriptions/EWD04xx/EWD472.html)\n"},{"event_id":"edit-2026-09-30-tarjan-splay-trees","source_key":"edit:2026-09-30:tarjan:splay-trees","created_at":"2026-09-29T23:31:51Z","kind":"profile-edit","person_id":"tarjan","name":"Robert Tarjan","summary":"Expand Tarjan on splay trees, amortized analysis, union–find and Fibonacci heaps; state the July 2026 almost-dynamic-optimality theorem precisely.","revision":"8a5251c2a3138a4cf4c04e9a98fa7fcbdc6bce0710bf33845278d9b5f97e22c4","article_markdown":"# Robert Tarjan — Data structures that adapt, with proofs\n\nRobert Endre Tarjan helped shape the analysis of data structures and graph algorithms. His work includes the analysis of union–find, splay trees with Daniel Sleator, and Fibonacci heaps with Michael Fredman. A recurring theme is that a structure can be efficient over an entire sequence even when one operation is expensive.\n\nSplay trees make adaptation part of the algorithm: accessing a key changes the tree. Amortized and competitive analysis explain what this simple rule guarantees, and which stronger forms of optimality remain conjectural.\n\namortized cost = actual cost + change in potential\n\n## A sequence is the right unit of analysis\n\nAn expensive operation can improve a data structure enough to make later operations cheap. Tarjan’s work makes this intuition precise. Amortized analysis bounds the total cost of a sequence; it does not require a random input distribution.\n\nThree contributions show the range of the idea. Union–find compresses paths while identifying sets. Fibonacci heaps postpone some restructuring work. Splay trees reshape a search tree after each access. These structures solve different problems, but in each case a local change has consequences that must be accounted for across time.\n\n## Splay trees: change the tree after using it\n\nSleator and Tarjan’s 1985 paper introduced and analyzed splay trees. After finding a key in a binary search tree, splaying moves its node to the root using rotations that preserve key order. No stored height or balance factor is required.\n\nThere are three cases. A zig rotates a node whose parent is the root. A zig-zig handles two successive left edges or two successive right edges: rotate the parent upward, then the node. A zig-zag handles opposite directions: rotate the node upward twice. The choice of paired rotations is part of the algorithm, not merely an implementation detail.\n\n## A three-key example\n\nStart with root 30, its left child 20, and 20’s left child 10. Searching for 10 follows two edges. This is a zig-zig case. First rotate 20 above 30; the root becomes 20 with children 10 and 30. Then rotate 10 above 20. The final tree has root 10, right child 20, and 20’s right child 30.\n\nThe sorted order remains 10,20,30, but a second access to 10 is now immediate. Notice that the final tree is still a chain: splaying does not promise a balanced shape after every operation. It adapts the shape to the accesses. Nor does this one example prove good performance for every sequence; that requires an amortized argument.\n\n## How potential pays for a long access\n\nFor a tree T, let size(v) count the nodes in v’s subtree and define Φ(T) as the sum of log₂(size(v)) over all nodes. Charge an operation its actual cost plus the change in Φ. Summing these charges makes intermediate potentials cancel. The actual total is the amortized total plus Φ(initial)−Φ(final).\n\nThe access lemma bounds the amortized cost of splaying a node by a logarithmic quantity involving subtree sizes. It yields O((m+n) log n) total cost for m accesses starting from an arbitrary n-key tree, for n≥2. The n term accounts for the starting configuration. A single access can still cost Θ(n): amortized logarithmic cost is not a worst-case bound on each operation.\n\nΦ(T) = Σᵥ log₂(size(v));   Σ cᵢ = Σ ĉᵢ + Φ(T₀) − Φ(Tₘ)\n\n## Static optimality and dynamic optimality compare different rivals\n\nStatic optimality compares the total access cost with the best fixed binary search tree for that sequence. The 1985 paper already proves this form of optimality, up to constant factors, under its stated access conditions. In its frequency bound, every key is accessed at least once; more general presentations must account for initialization.\n\nDynamic optimality permits the competitor to change its tree throughout the sequence and even know future requests. Searches and restructuring both count toward its cost. The conjecture asks whether splaying stays within a constant factor of this stronger offline optimum, with appropriate initialization accounting. Matching the best fixed tree does not establish that stronger claim.\n\n## The July 2026 breakthrough: almost dynamically optimal\n\nThe preprint Splay trees are almost dynamically optimal, submitted on 20 July 2026 by Petr Chmel, Bernhard Haeupler, Richard Hladík, Michal Koucký, Antti Roeyskoe, Václav Rozhoň, Ondřej Sladký, and Robert E. Tarjan, proves an O(log log n · (log log log n)²) competitive ratio.\n\nTheorem 1 gives the more precise total-cost bound below for an access sequence X on a fixed set of n keys, allowing an arbitrary initial splay tree. OPT(X) is the minimum cost in the dynamic binary-search-tree model. The additive n inside the parentheses matters when the initial tree is poor and the sequence is short.\n\nThis is a major advance for the original splay algorithm, rather than a replacement data structure. As checked on 30 September 2026, the cited result is a preprint proving almost dynamic optimality; its factor still grows with n, so it does not settle the constant-factor dynamic-optimality conjecture.\n\ncost(splay, X) = O((OPT(X) + n) · log log n · (log log log n)²)\n\n## Beyond splaying: union–find and Fibonacci heaps\n\nTarjan’s 1975 union–find analysis established inverse-Ackermann bounds for a set-union algorithm. For m≥n find operations interspersed with n−1 unions, the bound has the form O(m α(m,n)), where α grows extraordinarily slowly. This is a precise asymptotic statement, not literally a constant bound.\n\nWith Michael Fredman, Tarjan developed Fibonacci heaps. Their inexpensive amortized decrease-key operation yields O(m+n log n) time for single-source shortest paths with nonnegative edge lengths, using n vertices and m edges. This supplies a concrete connection to Dijkstra: better data structures impr
