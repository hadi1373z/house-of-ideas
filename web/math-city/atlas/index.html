rdness gives a matching threshold, but that optimality statement is conditional.","math":"αGW ≈ 0.878567"}],"sources":[{"label":"Improved approximation algorithms for maximum cut and satisfiability problems","url":"https://doi.org/10.1145/227683.227684","type":"paper"}],"questions":["Can you prove the θ/π separation probability geometrically?","Why is the SDP optimum an upper bound on MAX-CUT?","Can a small graph exhibit a strict integrality gap?"],"approximateBirth":false,"extended":true,"readMinutes":3,"tex":"\\mathbb E[\\mathrm{cut}]\\geq 0.87856\\cdot\\mathrm{OPT}","mathSVG":"<mjx-container class=\"MathJax\" jax=\"SVG\" display=\"true\"><svg style=\"vertical-align: -0.566ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"22.912ex\" height=\"2.262ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -750 10127 1000\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"TeXAtom\" data-mjx-texclass=\"ORD\"><g data-mml-node=\"mi\"><path data-c=\"1D53C\" d=\"M12 666Q12 675 24 683H582Q590 680 593 672V588Q593 514 591 502T575 490Q567 490 563 495T555 517Q552 556 517 590Q486 623 445 634T340 648H282Q266 636 264 620T260 492V370H277Q329 375 358 391T404 439Q420 480 420 506Q420 529 436 529Q445 529 451 521Q455 517 455 361Q455 333 455 298T456 253Q456 217 453 207T437 197Q420 196 420 217Q420 240 406 270Q377 328 284 335H260V201Q261 174 261 134Q262 73 264 61T278 38Q281 36 282 35H331Q400 35 449 50Q571 93 602 179Q605 203 622 203Q629 203 634 197T640 183Q638 181 624 95T604 3L600 -1H24Q12 5 12 16Q12 35 51 35Q92 38 97 52Q102 60 102 341T97 632Q91 645 51 648Q12 648 12 666ZM137 341Q137 131 136 89T130 37Q129 36 129 35H235Q233 41 231 48L226 61V623L231 635L235 648H129Q132 641 133 638T135 603T137 517T137 341ZM557 603V648H504Q504 646 515 639Q527 634 542 619L557 603ZM420 317V397L406 383Q394 370 380 363L366 355Q373 350 382 346Q400 333 409 328L420 317ZM582 61L586 88Q585 88 582 83Q557 61 526 46L511 37L542 35H577Q577 36  75T510 4T388 -22T267 3T160 74T85 189T56 340ZM467 647Q426 665 388 665Q360 665 331 654T269 620T213 549T179 439Q174 411 174 354Q174 144 277 61Q327 20 385 20H389H391Q474 20 537 99Q603 188 603 354Q603 411 598 439Q577 592 467 647Z\"><\/path><path data-c=\"50\" d=\"M130 622Q123 629 119 631T103 634T60 637H27V683H214Q237 683 276 683T331 684Q419 684 471 671T567 616Q624 563 624 489Q624 421 573 372T451 307Q429 302 328 301H234V181Q234 62 237 58Q245 47 304 46H337V0H326Q305 3 182 3Q47 3 38 0H27V46H60Q102 47 111 49T130 61V622ZM507 488Q507 514 506 528T500 564T483 597T450 620T397 635Q385 637 307 637H286Q237 637 234 628Q231 624 231 483V342H302H339Q390 342 423 349T481 382Q507 411 507 488Z\" transform=\"translate(778,0)\"><\/path><path data-c=\"54\" d=\"M36 443Q37 448 46 558T55 671V677H666V671Q667 666 676 556T685 443V437H645V443Q645 445 642 478T631 544T610 593Q593 614 555 625Q534 630 478 630H451H443Q417 630 414 618Q413 616 413 339V63Q420 53 439 50T528 46H558V0H545L361 3Q186 1 177 0H164V46H194Q264 46 283 49T309 63V339V550Q309 620 304 625T271 630H244H224Q154 630 119 601Q101 585 93 554T81 486T76 443V437H36V443Z\" transform=\"translate(1459,0)\"><\/path><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>"},{"name":"Prasad Raghavendra","id":"raghavendra","born":1981,"field":"algorithms","title":"A unified theory of CSP approximation","bio":"Raghavendra proved that a canonical SDP framework gives optimal approximation guarantees for finite constraint languages, conditional on the Unique Games Conjecture.","formula":"UGC ⇒ optimality of the basic SDP framework","impact":"The theorem concerns fixed finite-domain, bounded-arity maximum CSPs and asymptotic approximation guarantees. It is not a claim that SDP solves every optimization problem exactly.","ref":"Raghavendra","sections":[{"title":"A fixed constraint language","text":"Fix a finite domain and a finite set of bounded-arity predicates. The task is to maximize the fraction or weight of satisfied constraints. This framework includes many, but not all, optimization problems.","math":"MAX-CSP(Λ)"},{"title":"Local distributions and vectors","text":"The basic SDP combines vector correlations with local distributions on constraint scopes. Pairwise inner products alone do not describe arbitrary higher-arity constraints. A genuine assignment gives a feasible solution, while an SDP solution may not correspond to any global assignment.","math":"local consistency ≠ a global distribution"},{"title":"A conditional classification","text":"Raghavendra connects the achievable rounding guarantees to matching Unique-Games-based hardness, with arbitrarily small slack. The theorem turns a problem-by-problem approximation search into a unified framework, though finding a simple closed-form threshold may still be difficult.","math":"UGC + SDP integrality gap → optimal approximation boundary"}],"sources":[{"label":"Optimal algorithms and inapproximability results for every CSP?","url":"https://doi.org/10.1145/1374376.1374414","type":"paper"}],"questions":["Why do higher-arity predicates need local distributions?","What is the difference between an integrality gap and NP-hardness?","How does the rounding guarantee become a dictatorship test?"],"approximateBirth":false,"extended":true,"readMinutes":3},{"name":"Jean-Bernard Lasserre","id":"lasserre","born":1953,"field":"algorithms","title":"Optimization through moments","bio":"Lasserre developed a hierarchy of semidefinite relaxations for polynomial optimization. Moments and sums of squares connect algorithms with algebraic certificates.","formula":"Ẽ[p²] ≥ 0","impact":"A low-degree pseudoexpectation satisfies selected consistency and positivity conditions without necessarily coming from a real distribution. Higher levels impose stronger conditions at greater cost.","ref":"Lasserre","sections":[{"title":"Replace an assignment by moments","text":"A distribution on Boolean assignments determines moments of every monomial. A relaxation retains moments only through degree 2d, expressed as a linear functional Ẽ. It must normalize 1 and annihilate the equality constraints at allowed degrees.","math":"Ẽ[1]=1;  Ẽ[(xᵢ²−1)q]=0"},{"title":"Positivity becomes an SDP","text":"For monomials xᵅ of degree at most d, form Mᵅᵝ=Ẽ[xᵅ⁺ᵝ]. Requiring Ẽ[p²]≥0 for every degree-d polynomial p is equivalent to M being positive semidefinite.","math":"M ⪰ 0"},{"title":"A hierarchy, not a miracle","text":"As the level rises, feasible truncated moment sets become more restricted, and maximization upper bounds decrease. For Boolean problems, sufficiently high levels are exact. Fixed levels have SDP size n^{O(d)}, with numerical precision conditions still relevant.","math":"U₁ ≥ U₂ ≥ ⋯ ≥ OPT"},{"title":"The proof side","text":"The dual seeks bounded-degree sum-of-squares certificates modulo the constraints. General polynomial optimization needs appropriate compactness or positivity assumptions for convergence claims. A pseudoexpectation obstructs a low-degree certificate without necessarily describing a real probability measure.","math":"pseudoexpectation ↔ obstruction to a low-degree refutation"}],"sources":[{"label":"Global Optimization with Polynomials and the Problem of Moments","url":"https://doi.org/10.1137/S1052623400366802","type":"paper"}],"questions":["Can you build the degree-two moment matrix for three variables?","How does a pseudoexpectation certify a proof-system lower bound?","Which additional moment constraints first detect an inconsistent cycle?"],"approximateBirth":false,"extended":true,"readMinutes":3,"tex":"\\widetilde{\\mathbb E}[p^2]\\geq0","mathSVG":"<mjx-container class=\"MathJax\" jax=\"SVG\" display=\"true\"><svg style=\"vertical-align: -0.566ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"9.041ex\" height=\"2.857ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -1013 3996.1 1263\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"TeXAtom\" data-mjx-te 62 478 354 524T321 597Z\"><\/path><\/g><\/g><\/g><\/svg><\/mjx-container>"},{"name":"Boris Weisfeiler","id":"weisfeiler","born":1941,"field":"graphs","title":"Refining the information in a graph","bio":"Weisfeiler worked in algebra and group theory. With Andrei Leman, he developed graph-refinement ideas that became central to isomorphism, finite model theory and later machine-learning expressiveness.","formula":"cₜ₊₁(v) = encode(cₜ(v), multiset{cₜ(u):u∼v})","impact":"Vertex color refinement is an isomorphism invariant, not a complete test. Equally sized regular graphs already show that local aggregation can miss global differences.","ref":"Weisfeiler","sections":[{"title":"Refine without guessing labels","text":"The vertex update records a vertex’s old color and the multiset of its neighbors’ colors. Assign equal new colors exactly when these records agree. Run comparison with a common encoding, not unrelated color names in each graph.","math":"cₜ₊₁(v) = encode(cₜ(v), multiset{cₜ(u):u∼v})"},{"title":"Why one dimension fails","text":"Starting from one color, every vertex of a d-regular graph sees the same multiset forever. Two nonisomorphic d-regular graphs of equal order are therefore indistinguishable by this basic procedure. Rigidity and automorphism count are separate issues.","math":"same regular degree + same order ⇒ same 1-WL histogram"},{"title":"Tuples, logic and limitations","text":"Higher-dimensional versions refine tuples. Precise correspondences with counting logic depend on conventions and indexing. Cai–Fürer–Immerman constructions give nonisomorphic graph families requiring linearly many variables to distinguish, exposing a global parity obstruction.","math":"refinement ↔ counting logic ↔ pebble games"}],"sources":[{"label":"A Lower Bound on the Number of Variables in First Order Logic","url":"https://doi.org/10.1007/BF01305232","type":"paper"}],"questions":["Can you exhibit two connected regular graphs that 1-WL cannot distinguish?","What global parity does a CFI gadget encode?","How does a pebble game represent bounded-variable logic?"],"approximateBirth":false,"extended":true,"readMinutes":3},{"name":"Neil Immerman","id":"immerman","born":1954,"field":"logic","title":"Computation described by logic","bio":"Immerman helped establish descriptive complexity and independently proved closure of nondeterministic space under complement. His work connects machines, logical languages and graph algorithms.","formula":"NL = coNL","impact":"Inductive counting can certify non-reachability in logarithmic space. On ordered finite structures, fixed-point logic also captures polynomial-time computation.","ref":"Immerman","sections":[{"title":"Nondeterminism certifies absence","text":"Directed reachability is NL-complete. Immerman and Szelepcsényi independently proved that its complement is in NL. The method tracks the number of vertices reachable within k steps rather than storing all of them.","math":"NL = coNL","tex":"\\mathrm{NL}=\\mathrm{coNL}","mathSVG":"<mjx-container class=\"MathJax\" jax=\"SVG\" display=\"true\"><svg style=\"vertical-align: -0.186ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"11.375ex\" height=\"1.731ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -683 5027.6 765\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"TeXAtom\" data-mjx-texclass=\"ORD\"><g data-mml-node=\"mi\"><path data-c=\"4E\" d=\"M42 46Q74 48 94 56T118 69T128 86V634H124Q114 637 52 637H25V683H232L235 680Q237 679 322 554T493 303L578 178V598Q572 608 568 613T544 627T492 637H475V683H483Q498 680 600 680Q706 680 715 683H724V637H707Q634 633 622 598L621 302V6L614 0H600Q585 0 582 3T481 150T282 443T171 605V345L172 86Q183 50 257 46H274V0H265Q250 3 150 3Q48 3 33 0H25V46H42Z\"><\/path><path data-c=\"4C\" d=\"M128 622Q121 629 117 631T101 634T58 637H25V683H36Q48 680 182 680Q324 680 348 683H360V637H333Q273 637 258 635T233 622L232 342V129Q232 57 237 52Q243 47 \" transform=\"translate(1694,0)\"><\/path><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>"},{"title":"Why a count makes the certificate trustworthy","text":"Given the correct number of reachable vertices, a nondeterministic computation can enumerate witnessed reachable vertices and reject if the count is wrong. This supports an inductive update of the next reachable-set size using logarithmic workspace.","math":"Rₖ = {v : dist(s,v)≤k}"},{"title":"Logic captures a resource bound","text":"On finite structures equipped with a linear order, first-order logic with transitive closure captures NL, and least fixed-point logic captures P. The order hypothesis in the Immerman–Vardi theorem is essential to its stated form.","math":"FO(LFP) = P on ordered finite structures"}],"sources":[{"label":"Languages that Capture Complexity Classes","url":"https://doi.org/10.1137/0216051","type":"paper"},{"label":"Nondeterministic Space is Closed Under Complementation","url":"https://doi.org/10.1137/0217058","type":"paper"}],"questions":["How can an exact count certify that no reachable vertex was omitted?","Where does the order enter the characterization of P?","How does WL correspond to counting logic rather than ordinary FO?"],"approximateBirth":false,"extended":true,"readMinutes":3,"tex":"\\mathrm{NL}=\\mathrm{coNL}","mathSVG":"<mjx-container class=\"MathJax\" jax=\"SVG\" display=\"true\"><svg style=\"vertical-align: -0.186ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"11.375ex\" height=\"1.731ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -683 5027.6 765\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"TeXAtom\" data-mjx-texclass=\"ORD\"><g data-mml-node=\"mi\"><path data-c=\"4E\" d=\"M42 46Q74 48 94 56T118 69T128 86V634H124Q114 637 52 637H25V683H232L235 680Q237 679 322 554T493 303L578 178V598Q572 608 568 613T544 627T492 637H475V683H483Q498 680 600 680Q706 680 715 683H724V637H707Q634 633 a-c=\"4C\" d=\"M128 622Q121 629 117 631T101 634T58 637H25V683H36Q48 680 182 680Q324 680 348 683H360V637H333Q273 637 258 635T233 622L232 342V129Q232 57 237 52Q243 47 313 47Q384 47 410 53Q470 70 498 110T536 221Q536 226 537 238T540 261T542 272T562 273H582V268Q580 265 568 137T554 5V0H25V46H58Q100 47 109 49T128 61V622Z\" transform=\"translate(1694,0)\"><\/path><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>"},{"name":"Haim Gaifman","id":"gaifman","born":1934,"field":"logic","title":"The locality of first-order logic","bio":"Gaifman proved a normal-form theorem expressing first-order sentences through local properties and separated witnesses. It became foundational in finite model theory.","formula":"local types + distant witnesses","impact":"Bounded logical depth limits the scale of local inspection. It does not mean that first-order truth is determined solely by frequencies seen from a random vertex.","ref":"Gaifman","sections":[{"title":"The normal form","text":"Every first-order sentence over a finite relational vocabulary is equivalent to a Boolean combination of basic local sentences. Such a sentence asks for finitely many sufficiently separated vertices, all satisfying a specified local formula.","math":"∃x₁…xₖ: ⋀ᵢ<ⱼ dist(xᵢ,xⱼ)>2r ∧ ⋀ᵢ ψ(xᵢ)"},{"title":"Locality is not frequency alone","text":"For bounded-degree graph sequences, Benjamini–Schramm convergence records the probabilities of rooted neighborhoods. A rare feature can occur at one vertex and disappear from those probabilities, while an existential FO sentence still detects it.","math":"frequency → 0 does not imply absence"},{"title":"Why algorithms need more than a radius","text":"A fixed-radius ball can still be huge when degrees are unbounded. Algorithmic applications therefore combine locality with structural sparsity or other restrictions. Locality does not make arbitrary-graph model checking automatically easy.","math":"logical locality + structural control → algorithmic leverage"}],"sources":[{"label":"On Local and Non-Local Properties · original chapter","url":"https://doi.org/10.1016/S0049-237X(08)71879-2","type":"paper"}],"questions":["Can one exceptional vertex change FO truth without changing a local limit?","What do separated witnesses add to purely local formulas?","Why does a sparse neighborhood need not have bounded size?"],"approximateBirth":false,"extended":true,"readMinutes":3},{"name":"Jaroslav Nešetřil","id":"nesetril","born":1946,"field":"graphs","title":"Sparsity with structural meaning","bio":"Nešetřil shaped graph homomorphism theory, Ramsey theory and structural sparsity. With Ossona de Mendez he developed bounded-expansion and nowhere-dense classes.","formula":"∀r ∃f(r): |E(H)|/|V(H)| ≤ f(r)","impact":"For bounded expansion, this bound applies to every depth-r shallow minor H. Sparse structure remains sparse after bounded-radius contractions.","ref":"Nesetril","sections":[{"title":"Few edges is not enough","text":"Subdividing every edge of a clique once gives a graph of bounded average degree, but depth-one contractions recover the original clique. A useful sparsity notion must control what is revealed by local contraction.","math":"subdivide Kₙ → sparse graph → shallow minor Kₙ"},{"title":"Bounded expansion and nowhere density","text":"Bounded expansion bounds the density of every fixed-depth shallow minor by a function of that depth. Nowhere density instead excludes sufficiently large clique shallow minors at each fixed depth. It is a weaker structural restriction.","math":"∀r ∃N(r): K_N(r) is not a depth-r shallow minor"},{"title":"Logic, algorithms and homomorphisms","text":"Nešetřil and Ossona de Mendez developed the structural framework underlying important model-checking results. Dvořák–Král’–Thomas obtained linear-time FO model checking for bounded expansion, and Grohe–Kreutzer–Siebertz almost-linear algorithms for effectively nowhere-dense classes. Nešetřil’s work with Hell also made graph homomorphisms central to coloring and CSPs.",
